<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taller — Palma Grande</title>
<meta name="theme-color" content="#16211C">
<link rel="manifest" href="manifest-taller.json">
<link rel="icon" href="icons/taller-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/taller-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Taller">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDF0EE; --card:#fff; --ink:#16211C; --soft:#4A5B53; --steel:#7E8C86; --line:#D3DAD6;
    --green:#1F5D3C; --green-s:#E2EDE6; --amber:#B0600D; --amber-s:#FBEEDC;
    --red:#9E2B21; --red-s:#F9E3E1; --r:4px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:'Barlow',system-ui,sans-serif;font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace}
  button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
  :focus-visible{outline:3px solid var(--green);outline-offset:2px}

  header{background:var(--ink);color:#EDF0EE;padding:12px 16px;position:sticky;top:0;z-index:20;border-bottom:3px solid var(--green)}
  header .fila{display:flex;align-items:center;gap:12px;max-width:1080px;margin:0 auto}
  header .volver{color:#9CB3A7;font-size:24px;line-height:1;text-decoration:none;padding:2px 4px 4px 0}
  header .marca{font-size:11px;letter-spacing:.14em;color:#8FA79A;font-weight:600;text-transform:uppercase}
  header h1{font-size:19px;margin:0;font-weight:700;line-height:1.15}
  header .fecha{font-size:12px;color:#8FA79A}
  header .inst-btn{margin-left:auto;font-size:13px;font-weight:600;color:#fff;background:var(--green);border:1px solid var(--green);border-radius:20px;padding:6px 12px;white-space:nowrap}
  header .inst-btn[hidden]{display:none}
  header .inst-btn:not([hidden]) + .maq-btn{margin-left:0}
  header .maq-btn{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:#EDF0EE;background:#26352E;border:1px solid #34443C;border-radius:20px;padding:6px 13px;white-space:nowrap}
  header .maq-btn svg{width:15px;height:15px}
  header .yo[hidden]{display:none}
  header .yo{margin-left:auto;font-size:13px;color:#C9D8D0;background:#26352E;border:1px solid #34443C;border-radius:20px;padding:6px 13px;white-space:nowrap;max-width:46%;overflow:hidden;text-overflow:ellipsis}
  .sync{background:var(--amber);color:#fff;font-size:13px;padding:7px 16px;text-align:center}
  .sync[hidden]{display:none}
  .lectura{background:var(--red);color:#fff;font-size:13.5px;padding:9px 16px;text-align:center;line-height:1.35}
  .lectura[hidden]{display:none}
  .lectura b{font-weight:700}
  .nollego{background:#9a3412}
  .nollego button{margin-left:8px;background:#fff;color:#9a3412;border:0;border-radius:6px;padding:3px 10px;font:inherit;font-weight:700;cursor:pointer}

  .wrap{max-width:1080px;margin:0 auto;padding:16px 16px 110px}
  .resumen{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:6px}
  .res{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;border-top:3px solid var(--line)}
  .res .t{font-size:11px;color:var(--steel);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
  .res .n{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:28px;font-weight:700;line-height:1.1;margin-top:4px}
  .res .n small{font-size:15px;color:var(--steel);font-weight:500}
  .res.mal{border-top-color:var(--red)} .res.mal .n{color:var(--red)}
  .res.bien{border-top-color:var(--green)} .res.bien .n{color:var(--green)}
  .res.medio{border-top-color:var(--amber)} .res.medio .n{color:var(--amber)}
  .medidor{height:5px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden}
  .medidor i{display:block;height:100%;background:var(--green)}
  .res.medio .medidor i{background:var(--amber)} .res.mal .medidor i{background:var(--red)}
  @media (max-width:420px){ .res{padding:10px} .res .n{font-size:23px} .res .t{font-size:10px} }

  h2{font-size:12px;margin:22px 0 9px;font-weight:700;color:var(--soft);text-transform:uppercase;letter-spacing:.08em;display:flex;align-items:center;gap:8px}
  h2 .cuenta{font-family:'JetBrains Mono',monospace;background:var(--line);color:var(--soft);border-radius:10px;padding:0 7px;font-size:11px;letter-spacing:0}
  h2.rojo .cuenta{background:var(--red-s);color:var(--red)}

  .lista{display:grid;grid-template-columns:1fr;gap:9px}
  @media (min-width:760px){ .lista{grid-template-columns:1fr 1fr} }
  .eq{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
      padding:8px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 2px rgba(22,33,28,.04);transition:border-color .15s}
  .eq:hover{border-color:var(--steel)}
  .eq:active{transform:scale(.995)}
  .eq.varado{border-left:4px solid var(--red)}
  .eq.pend{border-left:4px solid var(--amber)}
  h2.ambar .cuenta{background:var(--amber-s);color:var(--amber)}
  .eq .txt{min-width:0;flex:1}
  .eq .cod{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700}
  .eq .nom{font-size:15px;font-weight:600;margin-left:6px}
  .eq .det{display:block;font-size:13px;color:var(--steel);margin-top:3px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .eq .estado{display:block;margin-top:6px}
  .eq .ir{color:var(--steel);font-size:22px;flex:none;padding-right:4px}

  /* foto de la máquina: si el archivo no existe, queda el dibujo de fondo */
  .foto{position:relative;flex:none;width:96px;height:68px;border-radius:2px;background:#DCE2DE;color:var(--soft);
        display:flex;align-items:center;justify-content:center;overflow:hidden}
  .foto svg{width:44%;height:auto;opacity:.45}
  .foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .eq.varado .foto img{filter:saturate(.55)}
  .cambiar-foto{position:relative;padding:0;flex:none;border-radius:2px}
  .cambiar-foto .marca-foto{position:absolute;right:6px;bottom:6px;background:rgba(14,22,18,.78);color:#EDF0EE;
        font-size:12px;font-weight:600;padding:3px 8px;border-radius:12px;display:flex;align-items:center;gap:5px}
  .cambiar-foto .marca-foto svg{width:14px;height:14px}
  .cambiar-foto.subiendo .foto{opacity:.5}

  .fab{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(to top,var(--paper) 72%,rgba(237,240,238,0));
       padding:14px 16px calc(14px + env(safe-area-inset-bottom));z-index:15}
  .fab button{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:520px;margin:0 auto;background:var(--red);color:#fff;
       padding:16px;border-radius:var(--r);font-size:17px;font-weight:700;box-shadow:0 6px 18px rgba(158,43,33,.28)}
  .fab button b{font-size:22px;line-height:1;font-weight:500}
  .fab button.secundario{background:var(--card);color:var(--soft);border:1px solid var(--line);font-size:15px;font-weight:600;padding:14px}

  .hoja{position:fixed;inset:0;background:rgba(14,22,18,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
  .hoja[hidden]{display:none}
  .panel{background:var(--paper);width:100%;max-width:760px;max-height:94vh;overflow:auto;
         border-radius:14px 14px 0 0;padding:0 0 calc(18px + env(safe-area-inset-bottom))}
  .panel .tope{position:sticky;top:0;background:var(--paper);padding:16px 16px 10px;border-bottom:1px solid var(--line);z-index:2}
  .panel .tope.ficha{background:var(--ink);color:#EDF0EE;border-bottom:3px solid var(--green);padding:16px}
  .tope.ficha .fila{align-items:flex-end;gap:16px}
  .tope.ficha .foto{width:150px;height:104px;background:#22302A;color:#EDF0EE}
  .tope.ficha .cod{font-family:'JetBrains Mono',monospace;font-size:28px;font-weight:700;line-height:1}
  .tope.ficha .nom{font-size:17px;font-weight:600;margin:4px 0 8px}
  .tope.ficha .cerrar{color:#9CB3A7;align-self:flex-start}
  @media (max-width:480px){ .tope.ficha .foto{width:118px;height:84px} .tope.ficha .cod{font-size:23px} }
  .panel .tope .fila{display:flex;align-items:center;gap:10px}
  .panel h3{margin:0;font-size:19px;font-weight:700}
  .panel .sub{font-size:13px;color:var(--steel)}
  .cerrar{margin-left:auto;font-size:26px;color:var(--steel);padding:0 6px;line-height:1}
  .cuerpo{padding:16px}

  .paso{font-size:14px;font-weight:600;color:var(--soft);margin:0 0 9px}
  .rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:9px;margin-bottom:20px}
  #g-eq{grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}
  .op{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:15px 8px;text-align:center;font-weight:600;font-size:15px;line-height:1.2}
  .op small{display:block;font-weight:400;font-size:12px;color:var(--steel);margin-top:3px}
  .op[aria-pressed=true]{border-color:var(--green);background:var(--green-s);color:var(--green)}
  .op.con-foto{padding:6px 6px 9px}
  .op.con-foto .foto{width:100%;height:58px;margin-bottom:6px}
  .op.ancho{grid-column:1/-1;text-align:left;padding:15px 14px}

  .campo{display:block;margin-bottom:18px}
  .campo[hidden]{display:none}
  .campo select{width:100%;padding:13px;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
  .maq-fila{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:8px;margin-bottom:8px;width:100%;text-align:left}
  .maq-fila .foto{width:72px;height:50px}
  .maq-fila .txt{flex:1;min-width:0}
  .maq-fila .cod{font-family:'JetBrains Mono',monospace;font-weight:700}
  .maq-fila .det{display:block;font-size:13px;color:var(--steel)}
  .maq-fila.baja{opacity:.6}
  .campo span{display:block;font-size:14px;font-weight:600;color:var(--soft);margin-bottom:6px}
  .campo span i{font-weight:400;font-style:normal;color:var(--steel)}
  .campo textarea,.campo input{width:100%;padding:13px;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
  .campo textarea{min-height:78px;resize:vertical}

  .accion{display:block;width:100%;padding:17px;border-radius:var(--r);font-size:17px;font-weight:700;margin-bottom:10px}
  .accion.verde{background:var(--green);color:#fff}
  .accion.roja{background:var(--red);color:#fff}
  .accion.gris{background:var(--card);border:1px solid var(--line);color:var(--ink);font-weight:600}
  .accion.ambar{background:var(--card);border:1px solid var(--amber);color:var(--amber);font-weight:700}
  .mini{display:inline-block;padding:8px 12px;border-radius:var(--r);font-size:14px;font-weight:600;margin:10px 8px 0 0;border:1px solid var(--line);background:var(--card)}
  .mini.verde{border-color:var(--green);color:var(--green)} .mini.roja{border-color:var(--red);color:var(--red)}
  .mini.gris{color:var(--steel)}
  .adj{display:flex;flex-direction:column;gap:6px;margin-top:8px}
  .adj-a{display:block;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;font-size:14px;font-weight:600;color:var(--ink);text-decoration:none;word-break:break-word}
  .adj-a small{display:block;font-weight:400;font-size:12px;color:var(--steel)}
  .adj-a small button{border:0;background:none;color:var(--red);text-decoration:underline;font-size:12px;padding:0}
  .accion[disabled]{opacity:.45}

  .tarj{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px}
  .tarj.alerta{border-left:4px solid var(--red);background:#FFF9F8}
  .tarj.pend{border-left:4px solid var(--amber);background:#FFFBF4}
  .eq-mt{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;width:100%;text-align:left;padding:10px 0;border-bottom:1px solid #EDEFEE;font-size:15px}
  .eq-mt:last-child{border-bottom:none}
  .eq-mt > span{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .eq-mt small{color:var(--steel);font-size:12.5px}
  .tarj.mtto-v{border-left:4px solid var(--red);background:#FFF9F8}
  .tarj.mtto-p{border-left:4px solid var(--amber);background:#FFFBF4}
  .tarj .et{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--steel);font-weight:600}
  .tarj .vl{font-size:16px;margin-top:2px}
  .tarj .vl.grande{font-size:21px;font-weight:700}
  .hist{font-size:14px;padding:9px 0;border-bottom:1px solid #EDEFEE;display:flex;gap:10px}
  .hist:last-child{border-bottom:none}
  .hist .f{color:var(--steel);font-size:13px;min-width:72px;flex:none}
  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600}
  .pill.osc{background:#26352E;color:#C9D8D0}
  .pill.ro{background:var(--red);color:#fff}
  .pill.r{background:var(--red-s);color:var(--red)}
  .pill.a{background:var(--amber-s);color:var(--amber)}
  .pill.v{background:var(--green-s);color:var(--green)}
  .pill.n{background:#E9ECEA;color:var(--steel)}
  .nota{font-size:13px;color:var(--steel);margin:0 0 16px}
  .vacio{background:var(--card);border:1px dashed var(--line);border-radius:var(--r);padding:26px 16px;text-align:center;color:var(--steel)}
  .barra i.a{background:var(--amber)} .barra i.r{background:var(--red)}
  .nota-inf{background:var(--amber-s);border-left:4px solid var(--amber);color:#7A430A;padding:12px 14px;border-radius:2px;margin-bottom:14px;font-size:14px}
  .aviso{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;background:var(--ink);color:#EDF0EE;
         padding:12px 20px;border-radius:var(--r);z-index:60;font-size:15px;max-width:90%;text-align:center}
  .aviso[hidden]{display:none}

  #pin{position:fixed;inset:0;background:var(--ink);z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;color:#EDF0EE}
  #pin[hidden]{display:none}
  #pin .marca{font-size:11px;letter-spacing:.16em;color:#8FA79A;font-weight:600;text-transform:uppercase;margin-bottom:6px}
  #pin h2{color:#EDF0EE;font-size:24px;text-transform:none;letter-spacing:0;margin:0 0 4px;display:block}
  #pin .sub{color:#9CB3A7;font-size:14px;margin-bottom:22px}
  #pin .puntos{display:flex;gap:12px;justify-content:center;margin-bottom:22px}
  #pin .puntos i{width:14px;height:14px;border-radius:50%;border:2px solid #4A5B53}
  #pin .puntos i.lleno{background:#EDF0EE;border-color:#EDF0EE}
  #pin .teclas{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:280px}
  #pin .teclas button{background:#2A3A33;border-radius:var(--r);padding:16px;font-size:21px;font-weight:600;color:#EDF0EE}
  #pin .error{min-height:20px;margin-top:14px;font-size:14px;color:#F1A39B}
  #pin a{margin-top:18px;color:#9CB3A7;font-size:14px}
</style>
<script>
  /* oculta el PIN antes de pintar si este celular ya lo ingresó (misma clave que la versión anterior) */
  /* sin PIN si este equipo ya lo ingresó, o si se abre dentro de Agrovisión con la sesión iniciada allá */
  (function(){
    var ok = false;
    try { ok = localStorage.getItem('pin_ok_taller') === '1'; } catch(e){}
    try {
      if (!ok && window.self !== window.top && window.top.location.origin === location.origin)
        ok = sessionStorage.getItem('av_logged_in') === '1' || localStorage.getItem('av_logged_in') === '1';
    } catch(e){}
    if (ok) document.documentElement.classList.add('pin-ok');
  })();
</script>
<style>.pin-ok #pin{display:none}</style>
</head>
<body>

<div id="pin">
  <div class="marca">Palma Grande S.A.S.</div>
  <h2>Taller</h2>
  <div class="sub">Ingrese el PIN</div>
  <div class="puntos" id="pin-puntos"><i></i><i></i><i></i><i></i></div>
  <div class="teclas" id="pin-teclas"></div>
  <div class="error" id="pin-error"></div>
  <a href="https://rojasanderson18-ship-it.github.io/maquinaria-taller-palmag/">← Volver a la página principal</a>
</div>

<header><div class="fila">
  <a class="volver" href="https://rojasanderson18-ship-it.github.io/maquinaria-taller-palmag/" aria-label="Volver a la página principal">‹</a>
  <div><div class="marca">Palma Grande S.A.S.</div><h1>Taller de maquinaria</h1><div class="fecha" id="fecha-hoy"></div></div>
  <button class="inst-btn" id="btn-instalar" hidden>Instalar app</button>
  <button class="maq-btn" id="btn-maquinas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Máquinas</button>
  <button class="yo" id="btn-yo" hidden>—</button>
</div></header>
<div class="lectura" id="lectura" hidden></div>
<div class="sync" id="sync" hidden></div>
<div class="lectura nollego" id="nollego" hidden></div>
<div class="lectura nollego" id="viejo" hidden></div>


<div class="wrap" id="app"></div>

<div class="fab" id="fab"><button id="btn-reportar"><b>+</b> Reportar una máquina dañada</button></div>

<div class="hoja" id="hoja" hidden><div class="panel" id="panel"></div></div>
<div class="aviso" id="aviso" hidden></div>

<script src="maestros.js"></script>
<script>
/* =====================================================================
   TALLER — Palma Grande S.A.S.
   Captura solo lo que el informe de disponibilidad necesita:
   qué máquina, cuándo quedó fuera, cuándo volvió, qué le pasó,
   si fue falla o mantenimiento, y quién lo registró.
   Un evento = un registro, que nace abierto y se cierra con el alta.
   El taller es la única fuente de paradas: el preoperativo no entra aquí.
   Cada evento se envía a la hoja "Taller" como fila PARADA y luego ALTA,
   con el mismo ID; al leer la hoja se juntan por ID.
   Ojo con el Apps Script: si ya hay una fila de hoy con el mismo valor en
   la columna 4, la sobrescribe en vez de agregar. Por eso la columna 4 es
   el ID (único por evento) y la fila ALTA lleva todos los datos: si el alta
   es el mismo día, reemplaza a la PARADA sin perder nada.
   Pendientes: algo que la máquina tiene pero que todavía no la para (fuga
   leve, ruido). No bajan la disponibilidad. Van en la misma hoja como filas
   PENDIENTE y luego RESUELTO, con el mismo esquema de ID.
   ===================================================================== */

/* La flota es la de la hoja Maestros, compartida con Programación y Gerencia
   (ver maestros.js). Aquí se puede agregar una máquina o darla de baja. */
var FLOTA = Maestros.flota();

/* Fotos: primero la que se subió desde el Taller (hoja "Fotos" de Sheets),
   si no, la de la carpeta fotos/ del repositorio con el código sin el #
   (fotos/01.jpg, fotos/FORD.jpg). Sin ninguna, el dibujo del tractor o camión. */
var DIBUJO = {
  maquina: '<svg viewBox="0 0 48 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<circle cx="13" cy="22" r="8"/><circle cx="37" cy="24" r="6"/><path d="M6 14h9V7h11l5 7h11v8"/><path d="M15 14h11"/></svg>',
  camion: '<svg viewBox="0 0 48 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M3 8h25v14H3z"/><path d="M28 13h8l6 6v3h-14z"/><circle cx="13" cy="24" r="4"/><circle cx="36" cy="24" r="4"/></svg>'
};
function fotoHtml(cod){
  var f = Maestros.flotaTodas().filter(function(x){ return x.cod === cod; })[0] || {};
  var src = fotos[cod] || ('fotos/' + encodeURIComponent(String(cod).replace('#', '')) + '.jpg');
  return '<span class="foto">' + DIBUJO[f.clase || 'maquina'] +

/* ---------- utilidades ---------- */
function $(s){ return document.querySelector(s); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function p2(n){ return ('0'+n).slice(-2); }
function isoLocal(d){ return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()); }
function hoy(){ return isoLocal(new Date()); }
function ahora(){ var d=new Date(); return isoLocal(d)+'T'+p2(d.getHours())+':'+p2(d.getMinutes()); }
function dcorta(iso){ if(!iso) return '—'; var p=String(iso).slice(0,10).split('-'); return p[2]+'/'+p[1]; }
function nid(){ return 'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function diasEntre(a, b){
  var x = new Date(String(a).slice(0,10)+'T12:00:00'), y = new Date(String(b).slice(0,10)+'T12:00:00');
  return Math.max(0, Math.round((y-x)/86400000));
}
function aviso(m){ var a=$('#aviso'); a.textContent=m; a.hidden=false;
  clearTimeout(a._t); a._t=setTimeout(function(){ a.hidden=true; }, 3000); }
function nombreDe(cod){ var e = Maestros.flotaTodas().filter(function(f){ return f.cod===cod; })[0]; return e ? e.nombre : ''; }
function txtSistema(id){ var s = SISTEMAS.filter(function(x){ return x.id===id; })[0]; return s ? s.txt : id; }

function idSistema(v){
  var s = SISTEMAS.filter(function(x){ return x.id===v || x.txt===v; })[0]; return s ? s.id : (v || null); }
function fechaCO(iso){ var p = String(iso).slice(0,10).split('-'); return (+p[2])+'/'+(+p[1])+'/'+p[0]; }
function horaAhora(){ var d=new Date(); return p2(d.getHours())+':'+p2(d.getMinutes()); }
/* la hoja puede devolver la fecha como texto d/m/aaaa o como fecha ISO */
function aIso(v){
  var s = String(v==null?'':v).trim(); if (!s) return '';
  var m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); if (m) return m[3]+'-'+p2(m[2])+'-'+p2(m[1]);
  if (s.indexOf('T') > 0){ var d = new Date(s); if (!isNaN(d)) return isoLocal(d); }
  return s.slice(0,10);
}
function hace24h(ts){ return ts && (Date.now() - new Date(ts).getTime()) < 86400000; }

/* Reportes repetidos: un operario volvió a encontrar algo que el taller ya
   tenía anotado (fila REPORTE de la hoja Taller, la escribe el Preoperativo). */
function reportesDe(filas){
  var out = {};
  filas.forEach(function(r){
    if (String(r[2] || '').trim().toUpperCase() !== 'REPORTE') return;
    var id = String(r[3] || '').trim(); if (!id) return;
    out[id] = { id:id, equipo:String(r[4] || '').trim(), txt:String(r[8] || ''), por:String(r[9] || ''),
      fecha:aIso(r[10] || r[0]), refs:String(r[11] || '').split(',').filter(Boolean), origen:String(r[12] || '') };
  });
  return Object.keys(out).map(function(k){ return out[k]; });
}
function reportesDePend(id){ return (estado.reportes || []).filter(function(x){ return x.refs.indexOf(id) >= 0; }); }
function pendientesDe(cod){
  return (estado.novedades || []).filter(function(n){ return n.equipo === cod && !n.cerrada; })
    .sort(function(a,b){ return (a.urgencia === 'urgente' ? 0 : 1) - (b.urgencia === 'urgente' ? 0 : 1) || (a.fecha < b.fecha ? -1 : 1); });
}
/* mantenimiento preventivo (Mtto en maestros.js) */
function pillMtto(cod){
  var m = Mtto.estado(cod);
  if (m.nivel === 'vencido') return ' <span class="pill r">Mtto vencido</span>';
  if (m.nivel === 'proximo') return ' <span class="pill a">Mtto en ' + fmtH(m.faltan) + '</span>';
  return '';
}
function fmtH(n){ return n == null ? '—' : String(Math.round(n * 10) / 10).replace('.', ',') + ' h'; }
function pillPend(lista){
  if (!lista.length) return '';
  var urg = lista.some(function(n){ return n.urgencia === 'urgente'; });
  return ' <span class="pill ' + (urg ? 'r' : 'a') + '">' + lista.length + (lista.length === 1 ? ' pendiente' : ' pendientes') +
    (urg ? ' · urgente' : '') + '</span>';
}
function abiertoDe(cod){
  return estado.eventos.filter(function(e){ return e.equipo===cod && !e.fechaAlta; })[0] || null;
}
function pintarSync(){
  var s = $('#sync');
  if (sinGuardar){ s.hidden = false; s.textContent = 'Sin guardar en este dispositivo. Avísele a Anderson.'; return; }

   ===================================================================== */
function haceDias(n){ var x = new Date(); x.setDate(x.getDate() - n); return isoLocal(x); }
function htmlFecha(){
  return '<div class="rejilla" id="g-fecha">' +
      '<button class="op" data-f="0">Hoy</button>' +
      '<button class="op" data-f="1">Ayer</button>' +
      '<button class="op" data-f="otra">Otra fecha</button>' +
    '</div>' +
    '<label class="campo" id="campo-fecha" hidden><span>Fecha en que quedó parada</span>' +
      '<input type="date" id="in-fecha" max="' + hoy() + '"></label>';
}
function montarFecha(inicial, alCambiar){
  var val = inicial || hoy(), otra = val !== hoy() && val !== haceDias(1);
  function refrescar(){
    Array.prototype.forEach.call($('#panel').querySelectorAll('[data-f]'), function(b){
      var f = b.dataset.f;
      b.setAttribute('aria-pressed', String(f === 'otra' ? otra : (!otra && val === haceDias(+f))));
    });
    $('#campo-fecha').hidden = !otra;
    $('#in-fecha').value = val;
    alCambiar(val);
  }
  Array.prototype.forEach.call($('#panel').querySelectorAll('[data-f]'), function(b){
    b.onclick = function(){
      if (b.dataset.f === 'otra'){ otra = true; refrescar(); $('#in-fecha').focus(); return; }
      otra = false; val = haceDias(+b.dataset.f); refrescar();
    };
  });
  $('#in-fecha').onchange = function(){
    var v = $('#in-fecha').value;
    if (v && v <= hoy()) val = v; else aviso('La fecha no puede ser después de hoy.');
    refrescar();
  };
  refrescar();
}

      '<button class="accion roja" id="guardar" disabled>Dejarla reportada</button>' +
      '<button class="accion gris" data-cerrar>Cancelar</button>' +
      '<p class="nota">Si al repararla resulta ser de otro sistema, se corrige al darle el alta.</p>' +
    '</div>',
    function(){
      function refrescar(){
        Array.prototype.forEach.call($('#panel').querySelectorAll('[data-eq]'), function(b){
          b.setAttribute('aria-pressed', String(b.dataset.eq === sel.equipo)); });
        Array.prototype.forEach.call($('#panel').querySelectorAll('[data-tipo]'), function(b){
          b.setAttribute('aria-pressed', String(b.dataset.tipo === sel.tipo)); });
        Array.prototype.forEach.call($('#panel').querySelectorAll('[data-rsis]'), function(b){
          b.setAttribute('aria-pressed', String(b.dataset.rsis === sel.sistema)); });
        $('#g-causa').hidden = sel.tipo !== 'falla';
        // una falla no se guarda sin decir de qué sistema es (de ahí sale qué se está dañando)
        $('#guardar').disabled = !sel.equipo || (sel.tipo === 'falla' && !sel.sistema);
      }
      Array.prototype.forEach.call($('#panel').querySelectorAll('[data-eq]'), function(b){
        b.onclick = function(){ sel.equipo = b.dataset.eq; refrescar(); }; });
      Array.prototype.forEach.call($('#panel').querySelectorAll('[data-tipo]'), function(b){
        b.onclick = function(){ sel.tipo = b.dataset.tipo; refrescar(); }; });
      Array.prototype.forEach.call($('#panel').querySelectorAll('[data-rsis]'), function(b){
        b.onclick = function(){ sel.sistema = b.dataset.rsis; refrescar(); }; });
      montarFecha(sel.fecha, function(v){ sel.fecha = v; });
      refrescar();

      $('#guardar').onclick = async function(){
        if (!sel.equipo) return;
        if (abiertoDe(sel.equipo)){ cerrar(); pintar(); aviso(sel.equipo + ' ya estaba reportada.'); return; }
        var ev = {
          id: nid(),
          equipo: sel.equipo,
          tipo: sel.tipo,
          sistema: sel.tipo === 'falla' ? sel.sistema : null,   // se puede corregir al dar el alta
          novedad: $('#nov').value.trim(),
          reportadoPor: estado.yo,
          fechaReporte: sel.fecha,
          registradoEn: ahora(),
          fechaAlta: null,
          altaPor: null,
          trabajo: '',
          cerradoEn: null
        };
        estado.eventos.push(ev);
        encolarParada(ev);
        await persistir();
        cerrar(); pintar();
        aviso(sel.equipo + ' quedó reportada como parada' + (ev.fechaReporte === hoy() ? '.' : ' desde el ' + dcorta(ev.fechaReporte) + '.'));
        enviar();
      };
    });
}

/* =====================================================================
   Pantalla de una máquina
   ===================================================================== */
function verEquipo(cod){
  var ab = abiertoDe(cod);
  var historial = estado.eventos.filter(function(e){ return e.equipo === cod && e.fechaAlta; })
    .sort(function(a,b){ return a.fechaAlta < b.fechaAlta ? 1 : -1; });

  var h = topeFicha(cod, ab ? '<span class="pill ro">Parada</span>' : '<span class="pill v">Trabajando</span>') + '<div class="cuerpo">';
  var sisSel = { v: ab ? ab.sistema : null };

  var pend = pendientesDe(cod), pendHtml = '';
  if (pend.length){
    pendHtml = '<h2 class="ambar" style="margin-top:4px">Pendientes <span class="cuenta">' + pend.length + '</span></h2>' +
      pend.map(function(n){
        var dd = diasEntre(n.fecha, hoy());
        return '<div class="tarj pend"><div class="et">' + (n.urgencia === 'urgente' ? 'Urgente · puede dejarla parada pronto' : 'Puede esperar unos días') +
          (n.sistema ? ' · ' + esc(txtSistema(n.sistema)) : '') + '</div>' +
          '<div class="vl" style="font-weight:600">' + esc(n.novedad) + '</div>' +
          '<div class="vl" style="color:var(--steel);font-size:13px">Anotado el ' + dcorta(n.fecha) + ' por ' + esc(n.reportadoPor || '—') +
            ' · ' + (dd === 0 ? 'hoy' : 'hace ' + dd + (dd === 1 ? ' día' : ' días')) + '</div>' +
          (function(){ var rr = reportesDePend(n.id); if (!rr.length) return '';
            var u = rr.sort(function(a, b){ return a.fecha < b.fecha ? -1 : 1; })[rr.length - 1];
            return '<div class="vl" style="color:var(--amber);font-size:13px">Lo volvieron a reportar ' + rr.length + (rr.length === 1 ? ' vez' : ' veces') +
              ' · último: ' + esc(u.por) + ', ' + dcorta(u.fecha) + '</div>'; })() +
          '<button class="mini verde" data-resolver="' + esc(n.id) + '">Ya se solucionó</button>' +
          (ab ? '' : '<button class="mini roja" data-escalar="' + esc(n.id) + '">La dejó parada</button>') +
          // con varios pendientes, el que repite a otro se quita sin contarlo como solucionado
          (pend.length > 1 ? '<button class="mini gris" data-repetido="' + esc(n.id) + '">Es repetido</button>' : '') + '</div>';
      }).join('') + '<div style="height:8px"></div>';
  }

  if (ab){
    var d = diasEntre(ab.fechaReporte, hoy());
    h += '<div class="tarj alerta">' +
      '<div class="et">' + (ab.tipo === 'mantenimiento' ? 'Entró a mantenimiento programado' : 'Lo que reportaron') + '</div>' +
      '<div class="vl grande">' + (ab.novedad ? esc(ab.novedad) : 'Sin detalle') + '</div>' +
      '<div class="vl" style="color:var(--steel);font-size:14px;margin-top:6px">' +
        esc(ab.reportadoPor || '—') +
        ' · parada desde el ' + dcorta(ab.fechaReporte) +
        ' (' + (d === 0 ? 'hoy' : 'hace ' + d + (d===1?' día':' días')) + ')' +
        ' · <button id="corregir" style="text-decoration:underline;color:var(--ink)">Corregir fecha</button></div>' +
      '</div>';
    h += reparacionHtml(ab);
    h += pendHtml;

    // El mecánico es quien sabe de qué fue: el operario reporta el síntoma, él clasifica
    h += '<p class="paso">¿De qué fue?</p><div class="rejilla" id="g-sis">' +
      SISTEMAS.map(function(x){
        return '<button class="op" data-sis="' + esc(x.id) + '" aria-pressed="' + (sisSel.v===x.id) + '">' +
          esc(x.txt) + '</button>';
      }).join('') + '</div>' +
      '<div id="repetida"></div>' +
      '<label class="campo"><span>¿Qué se le hizo? <i>— opcional</i></span>' +
        '<textarea id="trab" placeholder="Cambio de manguera, se purgó el sistema…"></textarea></label>' +
      '<button class="accion verde" id="alta" disabled>Ya quedó lista</button>' +
      '<button class="accion gris" data-cerrar>Todavía no</button>';
  } else {
    h += '<div class="tarj"><div class="et">Estado</div><div class="vl grande" style="color:var(--green)">Trabajando' +
        (pend.length ? '<span style="color:var(--amber);font-size:16px;font-weight:600"> · con ' + pend.length + (pend.length === 1 ? ' pendiente' : ' pendientes') + '</span>' : '') + '</div></div>' +
      pendHtml +
      '<button class="accion roja" id="rep">Reportar que se dañó</button>' +
      '<button class="accion ambar" id="anotar">Anotar un pendiente</button>' +
      '<p class="nota">Un pendiente es algo que todavía no la para, pero puede pararla si no se atiende (fuga leve, ruido, desgaste).</p>' +
      '<button class="accion gris" data-cerrar>Cerrar</button>';
  }

  h += mttoHtml(cod);

  if (historial.length){
    h += '<h2 style="margin-top:22px">Últimas reparaciones</h2><div class="tarj">' +
      historial.slice(0, 8).map(function(e){
        return '<div class="hist"><span class="f mono">' + dcorta(e.fechaReporte) + '</span>' +
          '<span>' + (e.sistema ? '<span class="pill ' + (e.tipo === 'mantenimiento' ? 'a' : 'r') + '">' +
          esc(txtSistema(e.sistema)) + '</span> ' : '') +
          (e.novedad ? esc(e.novedad) : '') +
          '<br><span style="color:var(--steel);font-size:13px">' +
          diasEntre(e.fechaReporte, e.fechaAlta) + ' días parada · alta por ' + esc(e.altaPor || '—') +
          (e.trabajo ? ' · ' + esc(e.trabajo) : '') + '</span></span></div>';
      }).join('') + '</div>';
  }
  h += '<p class="nota" style="margin-top:12px">El historial completo de la máquina (paradas, pendientes y reportes repetidos) está en Gerencia → Historial (PDF).</p>';

  h += '</div>';

  abrir(h, function(){
    if ($('#rp-editar')) $('#rp-editar').onclick = function(){ editarReparacion(cod); };
    montarAdjuntos();
    var a = $('#alta');

    // avisar si esa misma parte ya había fallado
    function verRepetida(){
      var c = $('#repetida'); if (!c) return;
      if (!sisSel.v){ c.innerHTML = ''; return; }
      var n = historial.filter(function(e){
        return e.sistema === sisSel.v && e.fechaAlta && diasEntre(e.fechaAlta, hoy()) <= 90; }).length;
      c.innerHTML = n > 0
        ? '<div class="tarj alerta"><div class="et">Ojo</div><div class="vl">Esta máquina ya falló ' + n +
          (n===1?' vez':' veces') + ' por ' + esc(txtSistema(sisSel.v)).toLowerCase() +
          ' en los últimos tres meses.</div></div>'
        : '';
    }
    Array.prototype.forEach.call($('#panel').querySelectorAll('[data-sis]'), function(b){
      b.onclick = function(){
        sisSel.v = b.dataset.sis;
        Array.prototype.forEach.call($('#panel').querySelectorAll('[data-sis]'), function(x){
          x.setAttribute('aria-pressed', String(x.dataset.sis === sisSel.v)); });
        if (a) a.disabled = false;
        verRepetida();
      };
    });
    if (a && sisSel.v) a.disabled = false;
    verRepetida();

    if (a) a.onclick = async function(){
      if (!estado.yo){ cerrar(); elegirPersona(function(){ verEquipo(cod); }); return; }
      if (!sisSel.v){ aviso('Escoja de qué parte fue.'); return; }
      ab.sistema = sisSel.v;
      ab.fechaAlta = hoy();
      ab.altaPor = estado.yo;
      ab.trabajo = ($('#trab').value || '').trim();
      ab.cerradoEn = ahora();
      var dias = diasEntre(ab.fechaReporte, ab.fechaAlta), hora = horaAhora();
      encolarAlta(ab, hora);
      encolar('Altas', [fechaCO(ab.fechaAlta), '—', ab.equipo + ' ' + nombreDe(ab.equipo), ab.reportadoPor || '—',
        ab.altaPor, '—', hora, '—', txtSistema(ab.sistema) + (ab.trabajo ? ' — ' + ab.trabajo : '')], ENC_ALTAS, ab.id);
      await persistir();
      cerrar(); pintar();
      aviso(cod + ' quedó disponible. ' + dias + ' día(s) parada.');
      enviar();
    };
    var r = $('#rep');
    if (r) r.onclick = function(){ cerrar(); reportar(cod); };
    var an = $('#anotar');
    if (an) an.onclick = function(){ anotarPendiente(cod); };
    Array.prototype.forEach.call($('#panel').querySelectorAll('[data-resolver]'), function(b){
      b.onclick = function(){ resolverPendiente(b.dataset.resolver); };
    });
    Array.prototype.forEach.call($('#panel').querySelectorAll('[data-escalar]'), function(b){
      b.onclick = function(){ pasarAParada(b.dataset.escalar); };
    });
    Array.prototype.forEach.call($('#panel').querySelectorAll('[data-repetido]'), function(b){
      b.onclick = function(){ quitarRepetido(b.dataset.repetido); };
    });
    var c = $('#corregir');
    if (c) c.onclick = function(){ corregirFecha(cod); };
  });
}


/* =====================================================================
   Pendientes: anotar, resolver o pasar a parada
   ===================================================================== */
function encolarNovedad(n){
  encolar(HOJA, [fechaCO(hoy()), horaAhora(), n.cerrada ? 'RESUELTO' : 'PENDIENTE', n.id, n.equipo, nombreDe(n.equipo),
    n.urgencia, n.sistema ? txtSistema(n.sistema) : '', n.novedad, n.reportadoPor, n.fecha,
    n.trabajo || '', n.cerradoPor || '', n.cerrada ? diasEntre(n.fecha, n.fechaCierre) : ''], ENC_TALLER, n.id);
  porConfirmar(n.id, 'nov');
}
function anotarPendiente(cod, pref){
  var sel = { urgencia: 'normal', sistema: null };
  abrir(topeFicha(cod, '<span class="pill a">Anotar un pendiente</span>') +
    '<div class="cuerpo">' +
      '<label class="campo"><span>¿Qué tiene?</span><textarea id="pn-txt" placeholder="Bota un poco de aceite por el retén, ruido en la caja…">' + esc(pref ? pref.txt : '') + '</textarea></label>' +
      '<p class="paso">¿Qué tan urgente es?</p><div class="rejilla">' +
        '<button class="op ancho" data-urg="normal" aria-pressed="true">Puede esperar unos días<small>Se atiende en el próximo espacio</small></button>' +
        '<button class="op ancho" data-urg="urgente" aria-pressed="false">Urgente<small>Si no se atiende pronto, la deja parada</small></button>' +
      '</div>' +
      '<p class="paso">¿De qué sistema es? <i style="font-weight:400;font-style:normal;color:var(--steel)">— opcional</i></p><div class="rejilla">' +
        SISTEMAS.map(function(x){ return '<button class="op" data-psis="' + esc(x.id) + '" aria-pressed="false">' + esc(x.txt) + '</button>'; }).join('') +
      '</div>' +
      '<button class="accion ambar" id="pn-ok">Guardar pendiente</button>' +
      '<button class="accion gris" id="pn-volver">Volver</button>' +
      '<p class="nota">La máquina sigue trabajando y no baja la disponibilidad. El pendiente queda a la vista en el Taller y en la Programación hasta que se solucione.</p>' +
    '</div>',
    function(){
      $('#pn-volver').onclick = function(){ if (pref) verViejo(); else verEquipo(cod); };
      Array.prototype.forEach.call($('#panel').querySelectorAll('[data-urg]'), function(b){
        b.onclick = function(){ sel.urgencia = b.dataset.urg;
          Array.prototype.forEach.call($('#panel').querySelectorAll('[data-urg]'), function(x){ x.setAttribute('aria-pressed', String(x === b)); }); };
      });
      Array.prototype.forEach.call($('#panel').querySelectorAll('[data-psis]'), function(b){
        b.onclick = function(){ sel.sistema = sel.sistema === b.dataset.psis ? null : b.dataset.psis;
          Array.prototype.forEach.call($('#panel').querySelectorAll('[data-psis]'), function(x){ x.setAttribute('aria-pressed', String(x.dataset.psis === sel.sistema)); }); };
      });
      $('#pn-ok').onclick = async function(){
        var txt = $('#pn-txt').value.trim();
        if (!txt){ aviso('Escriba qué tiene la máquina.'); return; }
        var n = { id: nid(), equipo: cod, novedad: txt, urgencia: sel.urgencia, sistema: sel.sistema, reportadoPor: estado.yo,
          fecha: hoy(), registradoEn: ahora(), cerrada: false, fechaCierre: null, cerradoPor: null, trabajo: '', cerradoEn: null };
        estado.novedades.push(n);
        encolarNovedad(n);
        if (pref){ vistoViejo(pref.id); }
        await persistir(); pintar(); if (pref) verViejo(); else verEquipo(cod); enviar();
        aviso('Pendiente anotado en ' + cod + '.');
      };
    });
}
function novedadDe(id){ return (estado.novedades || []).filter(function(n){ return n.id === id; })[0] || null; }
function resolverPendiente(id){
  var n = novedadDe(id); if (!n) return;
  abrir(topeFicha(n.equipo, '<span class="pill v">Resolver pendiente</span>') +
    '<div class="cuerpo"><div class="tarj pend"><div class="et">Pendiente</div><div class="vl">' + esc(n.novedad) + '</div></div>' +
      '<label class="campo"><span>¿Qué se le hizo? <i>— opcional</i></span><textarea id="rs-txt" placeholder="Se cambió el retén…"></textarea></label>' +
      '<button class="accion verde" id="rs-ok">Ya se solucionó</button>' +
      '<button class="accion gris" id="rs-volver">Volver</button></div>',
    function(){
      $('#rs-volver').onclick = function(){ verEquipo(n.equipo); };
      $('#rs-ok').onclick = async function(){
        n.cerrada = true; n.fechaCierre = hoy(); n.cerradoPor = estado.yo; n.cerradoEn = ahora();
        n.trabajo = $('#rs-txt').value.trim();
        encolarNovedad(n);
        await persistir(); pintar(); verEquipo(n.equipo); enviar();
        aviso('Pendiente resuelto.');
      };
    });
}
/* Un pendiente que repite a otro (el operario lo reportó con otras palabras)
   se cierra como "Repetido": deja de verse en el Taller, la Programación y
   Gerencia, sin contarse como algo que se reparó. */
async function quitarRepetido(id){
  var n = novedadDe(id); if (!n) return;
  if (!confirm('¿Quitar este pendiente por repetido?\n\n' + n.novedad)) return;
  n.cerrada = true; n.fechaCierre = hoy(); n.cerradoPor = estado.yo; n.cerradoEn = ahora(); n.trabajo = 'Repetido';
  encolarNovedad(n);
  await persistir(); pintar(); verEquipo(n.equipo); enviar();
  aviso('Pendiente repetido quitado.');
}
/* El pendiente se cierra y la máquina queda parada desde hoy con esa novedad */
async function pasarAParada(id){
  var n = novedadDe(id); if (!n) return;
  if (abiertoDe(n.equipo)){ aviso(n.equipo + ' ya está parada.'); return; }
  if (!confirm(n.equipo + ' quedará parada desde hoy por: ' + n.novedad + '. ¿Continuar?')) return;
  var ev = { id: nid(), equipo: n.equipo, tipo: 'falla', sistema: null, novedad: n.novedad, reportadoPor: estado.yo,
    fechaReporte: hoy(), registradoEn: ahora(), fechaAlta: null, altaPor: null, trabajo: '', cerradoEn: null };
  estado.eventos.push(ev);
  encolarParada(ev);
  n.cerrada = true; n.fechaCierre = hoy(); n.cerradoPor = estado.yo; n.cerradoEn = ahora(); n.trabajo = 'Pasó a parada';
  encolarNovedad(n);
  await persistir(); pintar(); verEquipo(n.equipo); enviar();
  aviso(n.equipo + ' quedó parada. Si fue antes de hoy, corrija la fecha.');
}
/* Igual que fusionar(), para las filas PENDIENTE / RESUELTO */
function fusionarNovedades(filas){
  var rem = {};
  filas.forEach(function(r){
    var acc = String(r[2]||'').trim().toUpperCase(), id = String(r[3]||'').trim();
    if (!id || (acc !== 'PENDIENTE' && acc !== 'RESUELTO')) return;
    var n = rem[id] || (rem[id] = { id: id, equipo: String(r[4]||'').trim(), urgencia: 'normal', sistema: null, novedad: '',
      reportadoPor: '', fecha: aIso(r[10] || r[0]), registradoEn: null, cerrada: false, fechaCierre: null, cerradoPor: null, trabajo: '', cerradoEn: null });
    if (r[6]) n.urgencia = String(r[6]).trim() === 'urgente' ? 'urgente' : 'normal';
    if (r[7]) n.sistema = idSistema(String(r[7]).trim());
    if (r[8]) n.novedad = String(r[8]);
    if (r[9]) n.reportadoPor = String(r[9]);
    if (r[10]) n.fecha = aIso(r[10]);
    if (acc === 'RESUELTO'){
      n.cerrada = true; n.trabajo = String(r[11]||''); n.cerradoPor = String(r[12]||'');
      var d = new Date(n.fecha + 'T12:00:00'); d.setDate(d.getDate() + (parseInt(r[13], 10) || 0));
      n.fechaCierre = isNaN(d) ? aIso(r[0]) : isoLocal(d);
    }
  });
  var enCola = {};
  estado.cola.forEach(function(x){ enCola[x.id] = true; });
  var res = [];
  estado.novedades.forEach(function(l){
    var r = rem[l.id], pc = estado.porConfirmar[l.id];
    delete rem[l.id];
    if (enCola[l.id]){ res.push(l); return; }
    if (pc){
      if (r && (!l.cerrada || r.cerrada)){ delete estado.porConfirmar[l.id]; res.push(r); } else res.push(l);
      return;
    }
    if (!r){ if (hace24h(l.cerradoEn || l.registradoEn)) res.push(l); return; }
    res.push(l.cerrada && !r.cerrada && hace24h(l.cerradoEn) ? l : r);
  });
  Object.keys(rem).forEach(function(id){ res.push(rem[id]); });
  estado.novedades = res;
}

/* =====================================================================
   Mantenimiento preventivo: cada máquina tiene el horómetro de su último
   mantenimiento (hoja Maestros, tipo MTTO). El horómetro actual sale de lo
   que registran los operarios en el Preoperativo y el Cierre.
   ===================================================================== */
function mttoHtml(cod){
  var m = Mtto.estado(cod), u = Horometros.ultimo()[cod];
  var cl = m.nivel === 'vencido' ? ' mtto-v' : m.nivel === 'proximo' ? ' mtto-p' : '';
  var h = '<h2 style="margin-top:22px">Mantenimiento preventivo</h2><div class="tarj' + cl + '">';
  if (m.nivel === 'sindato'){
    h += '<div class="vl">Todavía no se ha registrado el último mantenimiento de esta máquina.</div>' +
      '<div class="nota" style="margin:6px 0 0">Regístrelo una vez y desde ahí el sistema avisa cada ' + Mtto.INTERVALO + ' horas.</div>';
  } else {
    var estadoTxt = m.nivel === 'vencido' ? '<b style="color:var(--red)">Vencido hace ' + fmtH(-m.faltan) + '</b>' :
                    m.nivel === 'proximo' ? '<b style="color:var(--amber)">Faltan ' + fmtH(m.faltan) + '</b>' :
                    m.nivel === 'ok' ? '<b style="color:var(--green)">Faltan ' + fmtH(m.faltan) + '</b>' : 'Sin horómetro registrado todavía';
    h += '<div class="et">Próximo mantenimiento</div><div class="vl grande">' + estadoTxt + '</div>' +
      '<div class="hist"><span class="f">Último</span><span>a las ' + fmtH(m.ultimo) + (m.fecha ? ' · ' + dcorta(m.fecha) : '') + (m.por ? ' · ' + esc(m.por) : '') + '</span></div>' +
      '<div class="hist"><span class="f">Próximo</span><span>a las ' + fmtH(m.proximo) + ' (cada ' + m.intervalo + ' h)</span></div>';
  }
  h += '<div class="hist"><span class="f">Horómetro</span><span>' + (u ? fmtH(u.h) + ' · registrado el ' + dcorta(u.fecha) : 'sin registros del Preoperativo') + '</span></div>' +
    '<button class="mini verde" id="mt-reg" data-cod="' + esc(cod) + '">Registrar mantenimiento hecho</button></div>';
  return h;
}
function registrarMtto(cod){
  var m = Mtto.estado(cod), u = Horometros.ultimo()[cod];
  abrir(topeFicha(cod, '<span class="pill v">Mantenimiento hecho</span>') +
    '<div class="cuerpo">' +
      '<label class="campo"><span>Horómetro cuando se hizo el mantenimiento</span><input id="mt-hor" inputmode="decimal" value="' +
        (u ? String(u.h).replace('.', ',') : '') + '" placeholder="1250" autocomplete="off"></label>' +

function guardarFlota(lista){
  var x = Maestros.fila('FLOTA', lista, estado.yo);
  estado.cola = estado.cola.filter(function(c){ return c.id !== x.id; });   // basta con la última versión
  encolar(x.hoja, x.fila, x.encabezados, x.id);
  FLOTA = Maestros.flota();
}
function maquinas(){
  var todas = Maestros.flotaTodas();
  var activas = todas.filter(function(f){ return f.activa !== false; });
  var bajas = todas.filter(function(f){ return f.activa === false; });
  function fila(f){
    var g = Maestros.GRUPOS[f.grupo] || 'Campo';
    return '<button class="maq-fila' + (f.activa === false ? ' baja' : '') + '" data-ed="' + esc(f.cod) + '">' + fotoHtml(f.cod) +
      '<span class="txt"><span class="cod">' + esc(f.cod) + '</span> ' + esc(f.nombre) +
      '<span class="det">' + esc(g) + (f.uso ? ' · ' + esc(f.uso) : '') + (f.activa === false ? ' · dada de baja' : '') + '</span></span>' +
      '<span class="ir" style="color:var(--steel);font-size:22px">›</span></button>';
  }
  abrir(tope('Máquinas', 'La misma lista que usan Programación y Gerencia') +
    '<div class="cuerpo">' +
      '<button class="accion verde" id="nueva">+ Agregar una máquina nueva</button>' +
      '<h2>Activas <span class="cuenta">' + activas.length + '</span></h2>' + activas.map(fila).join('') +
      (bajas.length ? '<h2>Dadas de baja <span class="cuenta">' + bajas.length + '</span></h2>' + bajas.map(fila).join('') : '') +
    '</div>',
    function(){
      $('#nueva').onclick = function(){ editarMaquina(null); };
      Array.prototype.forEach.call($('#panel').querySelectorAll('[data-ed]'), function(b){
        b.onclick = function(){ editarMaquina(b.dataset.ed); };

function editarMaquina(cod){
  var todas = Maestros.flotaTodas();
  var m = cod ? todas.filter(function(f){ return f.cod === cod; })[0] : null;
  var nueva = !m;
  m = m || { cod:'', nombre:'', grupo:'campo', clase:'maquina', uso:'' };
  var ab = cod ? abiertoDe(cod) : null;
  var opG = function(v, t){ return '<option value="' + v + '"' + (m.grupo === v ? ' selected' : '') + '>' + t + '</option>'; };
  abrir(tope(nueva ? 'Máquina nueva' : m.cod + ' · ' + m.nombre, nueva ? 'Aparece en Taller, Programación y Gerencia' : 'Corregir datos') +
    '<div class="cuerpo">' +
      (nueva
        ? '<label class="campo"><span>Código</span><input id="m-cod" placeholder="#12, o la placa si es un camión" autocomplete="off"></label>'
        : '<p class="nota">El código no se cambia, porque el historial de paradas y la programación están guardados con él.</p>') +
      '<label class="campo"><span>Marca y modelo</span><input id="m-nom" value="' + esc(m.nombre) + '" placeholder="Kubota M9540" autocomplete="off"></label>' +
      '<label class="campo"><span>Grupo</span><select id="m-gru">' +
        opG('campo', 'Campo — cosecha, fertilización y mantenimiento') + opG('sanidad', 'Sanidad') + opG('transporte', 'Transporte (no se programa)') +
      '</select></label>' +
      '<label class="campo"><span>Tipo</span><select id="m-cla">' +
        '<option value="maquina"' + (m.clase !== 'camion' ? ' selected' : '') + '>Tractor o máquina</option>' +
        '<option value="camion"' + (m.clase === 'camion' ? ' selected' : '') + '>Camión</option>' +
      '</select></label>' +
      '<label class="campo"><span>Uso <i>— opcional</i></span><input id="m-uso" value="' + esc(m.uso || '') + '" placeholder="Transporte de fruta" autocomplete="off"></label>' +
      '<button class="accion verde" id="m-ok">' + (nueva ? 'Agregar máquina' : 'Guardar cambios') + '</button>' +
      (nueva ? '' : m.activa === false
        ? '<button class="accion gris" id="m-alta">Volver a activarla</button>'
        : '<button class="accion gris" id="m-baja"' + (ab ? ' disabled' : '') + '>Dar de baja</button>' +
          (ab ? '<p class="nota">Está parada: dele el alta antes de darla de baja.</p>' : '<p class="nota">Dada de baja deja de aparecer en Taller y Programación; su historial se conserva.</p>')) +

        var nom = $('#m-nom').value.trim();
        if (!nom){ aviso('Escriba la marca y el modelo.'); return; }
        var datos = { nombre: nom, grupo: $('#m-gru').value, clase: $('#m-cla').value, uso: $('#m-uso').value.trim() };
        if (!datos.uso) delete datos.uso;
        if (nueva){
          var c = $('#m-cod').value.trim().toUpperCase().replace(/^(\d+)$/, function(x){ return '#' + p2(+x); });
          if (/^#\d$/.test(c)) c = '#0' + c.slice(1);
          if (!c){ aviso('Escriba el código.'); return; }
          if (todas.some(function(f){ return f.cod.toUpperCase() === c; })){ aviso('Ya existe una máquina con el código ' + c + '.'); return; }
          datos.cod = c;
          todas.push(datos);
        } else {
          todas.forEach(function(f){ if (f.cod === cod){ Object.keys(datos).forEach(function(k){ f[k] = datos[k]; }); if (!datos.uso) delete f.uso; } });
        }
        guardarFlota(todas);
        await persistir(); pintar(); maquinas(); enviar();
        aviso(nueva ? datos.cod + ' quedó agregada.' : 'Cambios guardados.');
      };
      var bj = $('#m-baja');
      if (bj) bj.onclick = async function(){
        if (!confirm('¿Dar de baja ' + cod + '? Deja de aparecer en Taller y Programación.')) return;
        todas.forEach(function(f){ if (f.cod === cod) f.activa = false; });
        guardarFlota(todas);
        await persistir(); pintar(); maquinas(); enviar();
        aviso(cod + ' quedó dada de baja.');
      };
      var al = $('#m-alta');
      if (al) al.onclick = async function(){
        todas.forEach(function(f){ if (f.cod === cod) delete f.activa; });
        guardarFlota(todas);
        await persistir(); pintar(); maquinas(); enviar();
        aviso(cod + ' volvió a la lista.');
      };
    });
}

async function traerMaestros(){
  if (!navigator.onLine) return;
  var pend = {};

        Array.prototype.forEach.call($('#panel').querySelectorAll('[data-rpe]'), function(b){ b.setAttribute('aria-pressed', String(b.dataset.rpe === sel.estado)); });
        var pide = sel.estado === 'repuesto';

      ['#rp-foto', '#rp-pdf'].forEach(function(sx){
        var inp = $(sx); if (!inp) return;

          Array.prototype.forEach.call(inp.files, function(f){

            if (!pdf && !/^image\//.test(f.type)){ aviso('Solo fotos o PDF.'); return; }
            if (pdf && f.size > Adjuntos.MAX_PDF){ aviso('El PDF pesa más de 10 MB. Tómele una foto a la cotización.'); return; }
            nuevos.push(f);
          });
          inp.value = ''; refrescar();
        };
      });
      montarAdjuntos();
      Array.prototype.forEach.call($('#panel').querySelectorAll('[data-rpe]'), function(b){ b.onclick = function(){ sel.estado = b.dataset.rpe; refrescar(); }; });
      $('#rp-rep').oninput = refrescar;

      refrescar();

        verEquipo(cod); pintar(); pintarNoLlego();
        aviso(cod + ': ' + Reparaciones.txtEstado(sel.estado).toLowerCase() + (subidos ? ' · ' + (subidos === 1 ? 'cotización enviada' : subidos + ' archivos enviados') : '') + '.');
        setTimeout(traerReparaciones, 6000);   // confirma en la hoja que llegó
      };
    });
}

    ev.tipo, ev.sistema ? txtSistema(ev.sistema) : '', ev.novedad, ev.reportadoPor, ev.fechaReporte, '', '', ''], ENC_TALLER, ev.id);

function encolarAlta(ab, hora){

function encolar(hoja, fila, encabezados, id){
  estado.cola.push({ hoja: hoja, fila: fila, encabezados: encabezados, id: id });
}

var enviando = false;
async function enviar(){
  if (enviando || !estado.cola.length || !navigator.onLine) { pintarSync(); return; }
  enviando = true;
  try {
    while (estado.cola.length){
      var x = estado.cola[0];
      try {
        await fetch(GS_URL, { method: 'POST', mode: 'no-cors',
          body: JSON.stringify({ hoja: x.hoja, fila: x.fila, encabezados: x.encabezados }) });
      } catch(e){ break; }           // sin señal: queda en la cola para el próximo intento
      estado.cola.shift();
      if (estado.porConfirmar[x.id]) estado.porConfirmar[x.id].enviadoEn = Date.now();
      await persistir();
    }
  } finally { enviando = false; pintarSync(); }
  // si el service worker del preoperativo guardó algo sin señal, que lo envíe ya
  try { if (navigator.serviceWorker && navigator.serviceWorker.controller)
    navigator.serviceWorker.controller.postMessage({ type: 'SYNC_NOW' }); } catch(e){}
}

/* La hoja manda: lo que hay allá reemplaza lo local, salvo lo que este
   celular aún no ha enviado o envió hace menos de un día (puede ir en camino). */
function fusionar(filas){
  var rem = {};
  filas.forEach(function(r){
    var acc = String(r[2]||'').trim().toUpperCase(), id = String(r[3]||'').trim();
    if (!id || (acc !== 'PARADA' && acc !== 'ALTA')) return;
    var e = rem[id] || (rem[id] = { id: id, equipo: String(r[4]||'').trim(), tipo: 'falla', sistema: null,
      novedad: '', reportadoPor: '', fechaReporte: aIso(r[10] || r[0]), registradoEn: null,
      fechaAlta: null, altaPor: null, trabajo: '', cerradoEn: null });
    if (r[6]) e.tipo = String(r[6]).trim();
    if (r[8]) e.novedad = String(r[8]);
    if (r[9]) e.reportadoPor = String(r[9]);
    if (r[10]) e.fechaReporte = aIso(r[10]);
    if (r[7]) e.sistema = idSistema(String(r[7]));      // desde la parada; el alta lo puede corregir
    if (acc === 'ALTA'){
      e.sistema = idSistema(String(r[7]||'')); e.trabajo = String(r[11]||''); e.altaPor = String(r[12]||'');
      // la fecha del alta sale de la parada + días, que no depende de cómo Sheets lea la columna Fecha
      var d = new Date(e.fechaReporte + 'T12:00:00'); d.setDate(d.getDate() + (parseInt(r[13], 10) || 0));
      e.fechaAlta = isNaN(d) ? aIso(r[0]) : isoLocal(d);
    }
  });
  var enCola = {};
  estado.cola.forEach(function(x){ enCola[x.id] = true; });
  var res = [];
  estado.eventos.forEach(function(l){
    var r = rem[l.id], pc = estado.porConfirmar[l.id];
    delete rem[l.id];
    if (enCola[l.id]){ res.push(l); return; }
    if (pc){                       // se envió: solo vale la hoja cuando ya tiene lo que se mandó
      if (r && llegoEvento(l, r, pc)){ delete estado.porConfirmar[l.id]; res.push(r); } else res.push(l);
      return;
    }
    if (!r){ if (hace24h(l.cerradoEn || l.registradoEn)) res.push(l); return; }
    // la versión local va adelante si cerró y la hoja todavía no tiene el alta
    res.push(l.fechaAlta && !r.fechaAlta && hace24h(l.cerradoEn) ? l : r);
  });
  Object.keys(rem).forEach(function(id){ res.push(rem[id]); });
  estado.eventos = res;
}

/* =====================================================================
   Confirmación de envíos. El envío a Google es "a ciegas" (no-cors): solo
   al leer la hoja se sabe si la fila llegó. Lo que no aparece se reenvía
   hasta 3 veces; si sigue sin llegar se avisa y Tulio decide. Nunca se
   borra nada sin avisar.
   ===================================================================== */
var GRACIA_MS = 2 * 60000, MAX_INTENTOS = 3;
function porConfirmar(id, tipo){ estado.porConfirmar[id] = { tipo: tipo, enviadoEn: null, intentos: 0 }; }
/* la hoja ya tiene lo que se mandó (o algo más nuevo hecho en otro equipo).
   Solo una corrección de fecha exige que la fecha coincida: si no, una
   parada nueva pisaría la corrección que otro equipo hizo después. */
function llegoEvento(l, r, pc){
  if (l.fechaAlta) return !!r.fechaAlta;
  return !!r.fechaAlta || !pc.fecha || r.fechaReporte === l.fechaReporte;
}
function reencolar(id, tipo){
  if (tipo === 'ev'){
    var e = estado.eventos.filter(function(x){ return x.id === id; })[0];
    if (!e) return false;
    if (e.fechaAlta) encolarAlta(e); else encolarParada(e);
    return true;
  }
  if (tipo === 'nov'){ var n = novedadDe(id); if (!n) return false; encolarNovedad(n); return true; }
  if (tipo === 'foto'){ var cod = id.slice(5); if (!fotos[cod]) return false; encolarFoto(cod); return true; }
  return false;
}
function reenviarPendientes(tipos){
  var enCola = {}, n = 0, t = Date.now();
  estado.cola.forEach(function(x){ enCola[x.id] = true; });
  Object.keys(estado.porConfirmar).forEach(function(id){
    var pc = estado.porConfirmar[id];
    if (tipos.indexOf(pc.tipo) < 0 || enCola[id] || !pc.enviadoEn || t - pc.enviadoEn < GRACIA_MS || pc.intentos >= MAX_INTENTOS) return;
    if (!reencolar(id, pc.tipo)){ delete estado.porConfirmar[id]; return; }
    estado.porConfirmar[id].intentos = pc.intentos + 1;
    if (pc.fecha) estado.porConfirmar[id].fecha = true;
    n++;
  });
  pintarNoLlego();
  return n;
}
function noLlego(){
  var lista = [];
  Object.keys(estado.porConfirmar).forEach(function(id){
    var pc = estado.porConfirmar[id];
    if (pc.intentos < MAX_INTENTOS) return;
    var txt;
    if (pc.tipo === 'ev'){
      var e = estado.eventos.filter(function(x){ return x.id === id; })[0];
      txt = e ? (e.fechaAlta ? 'Alta de ' : 'Parada de ') + e.equipo + ' — ' + e.novedad : id;
    } else if (pc.tipo === 'nov'){
      var n = novedadDe(id);
      txt = n ? (n.cerrada ? 'Pendiente resuelto de ' : 'Pendiente de ') + n.equipo + ' — ' + n.novedad : id;
    } else txt = 'Foto de ' + id.slice(5);
    lista.push({ id: id, txt: txt });
  });
  // con un maestros.js viejo en caché no existe sinLlegar
  if (Maestros.sinLlegar) Maestros.sinLlegar().forEach(function(m){ lista.push({ id: 'maestro:' + m.tipo, txt: 'Cambio en ' + m.nombre }); });
  if (window.Adjuntos) Adjuntos.sinLlegar().forEach(function(x){ lista.push({ id: 'adj:' + x.id, txt: 'Cotización de ' + x.cod + ' (' + x.nombre + '). Si ninguna cotización llega, falta activar los archivos en el Apps Script: avísele a Anderson.' }); });
  if (window.Reparaciones) Reparaciones.sinLlegar().forEach(function(x){ lista.push({ id: 'rep:' + x.envio, txt: 'En qué va la reparación de ' + x.cod + ' — ' + Reparaciones.txtEstado(x.datos.estado) }); });
  return lista;
}
function pintarNoLlego(){
  var b = $('#nollego'), l = noLlego();
  if (!l.length){ b.hidden = true; return; }
  b.hidden = false;
  b.innerHTML = '<b>' + l.length + (l.length === 1 ? ' registro no ha llegado' : ' registros no han llegado') +
    ' a la hoja de cálculo</b> después de 3 intentos.<button id="ver-nollego">Revisar</button>';
  $('#ver-nollego').onclick = verNoLlego;
}
/* ---------- App de preoperativo anterior todavía en uso ----------
   Lo que manda va a hojas que el Taller no lee (AppVieja en maestros.js).
   Los daños se pasan aquí como pendientes; lo ya revisado no se vuelve a
   mostrar en este celular. */
var VIEJO = null;
function vistosViejo(){ try { return JSON.parse(localStorage.getItem('taller_viejo_visto') || '{}') || {}; } catch(e){ return {}; } }
function vistoViejo(id){ var v = vistosViejo(); v[id] = true; try { localStorage.setItem('taller_viejo_visto', JSON.stringify(v)); } catch(e){} pintarViejo(); }
function pendViejo(){
  if (!VIEJO) return { nov:[], usos:[] };
  var v = vistosViejo();
  return { nov: VIEJO.nov.filter(function(x){ return !v[x.id]; }),
    usos: VIEJO.preop.concat(VIEJO.tanq).filter(function(x){ return !v[x.id]; }) };
}
async function traerViejo(){
  if (!navigator.onLine || !window.AppVieja) return;
  try { VIEJO = await AppVieja.traer(); } catch(e){ return; }
  pintarViejo();
}
function pintarViejo(){
  var b = $('#viejo'), p = pendViejo();
  if (!p.nov.length && !p.usos.length){ b.hidden = true; return; }
  b.hidden = false;
  b.innerHTML = '<b>Alguien sigue usando el preoperativo viejo.</b> ' +
    (p.nov.length ? (p.nov.length === 1 ? 'Reportó un daño que no está' : 'Reportó ' + p.nov.length + ' daños que no están') + ' en el Taller.' : 'Lo que manda no llega al Taller.') +
    '<button id="ver-viejo">Revisar</button>';
  $('#ver-viejo').onclick = verViejo;
}
function verViejo(){
  var p = pendViejo();
  if (!p.nov.length && !p.usos.length){ cerrar(); return; }
  var gente = {};
  p.nov.concat(p.usos).forEach(function(x){ var g = gente[x.op || 'Sin nombre'] = gente[x.op || 'Sin nombre'] || { cods:{}, ultima:'' }; g.cods[x.cod] = true; if (x.fecha > g.ultima) g.ultima = x.fecha; });
  abrir(tope('Preoperativo viejo', 'Lo que mandó no está en el Taller') +
    '<div class="cuerpo">' +
      '<p class="nota">Estos celulares tienen guardada la app de preoperativo anterior (la abrieron sin señal). Lo que mandan va a otra hoja: ' +
      'el Taller no lo ve. Pídales <b>abrir el Preoperativo con señal</b> una vez para que se actualice.</p>' +
      Object.keys(gente).map(function(k){ return '<div class="tarj"><div class="vl"><b>' + esc(k) + '</b> · ' + Object.keys(gente[k].cods).map(esc).join(', ') +
        ' · último uso ' + dcorta(gente[k].ultima) + '</div></div>'; }).join('') +
      (p.nov.length ? '<p class="paso">Daños que reportaron ahí</p>' + p.nov.map(function(x){
        return '<div class="tarj"><div class="vl"><b>' + esc(x.cod) + '</b> · ' + dcorta(x.fecha) + ' ' + esc(x.hora) + ' · ' + esc(x.op) + '</div>' +
          '<div class="nota" style="margin:4px 0 8px">' + esc([x.items, x.txt].filter(Boolean).join('. ')) + '</div>' +
          '<button class="accion ambar" data-vpend="' + esc(x.id) + '">Anotar como pendiente</button>' +
          '<button class="accion gris" data-vvisto="' + esc(x.id) + '">Ya está en el Taller</button></div>';
      }).join('') : '') +
      (p.usos.length ? '<button class="accion gris" id="vj-avise">Ya les avisé (ocultar ' + p.usos.length + (p.usos.length === 1 ? ' registro' : ' registros') + ')</button>' : '') +
      '<button class="accion gris" id="vj-cerrar">Cerrar</button></div>',
    function(){
      $('#vj-cerrar').onclick = cerrar;
      if ($('#vj-avise')) $('#vj-avise').onclick = function(){ p.usos.forEach(function(x){ vistoViejo(x.id); }); verViejo(); };
      Array.prototype.forEach.call($('#panel').querySelectorAll('[data-vvisto]'), function(b){
        b.onclick = function(){ vistoViejo(b.dataset.vvisto); verViejo(); };
      });
      Array.prototype.forEach.call($('#panel').querySelectorAll('[data-vpend]'), function(b){
        b.onclick = function(){
          var x = p.nov.filter(function(n){ return n.id === b.dataset.vpend; })[0]; if (!x) return;
          var cod = (FLOTA.filter(function(f){ return f.cod === x.cod; })[0] || {}).cod;
          if (!cod){ aviso('La máquina ' + x.cod + ' no está en la lista de la flota.'); return; }
          var go = function(){ anotarPendiente(cod, { id:x.id, txt: [x.items, x.txt].filter(Boolean).join('. ') + ' (lo reportó ' + (x.op || 'el operario') + ' el ' + dcorta(x.fecha) + ' en el preoperativo viejo)' }); };
          if (!estado.yo) elegirPersona(go); else go();
        };
      });
    });
}
function verNoLlego(){
  var l = noLlego();
  if (!l.length){ cerrar(); return; }
  abrir(tope('No llegaron a la hoja', 'Siguen guardados en este celular') +
    '<div class="cuerpo">' +
      '<p class="nota">Se enviaron 3 veces y no aparecen en la hoja de cálculo. Puede volver a intentarlo, o descartarlo ' +
      'si ya no sirve (queda lo que tenga la hoja). Si vuelve a pasar, avísele a Anderson.</p>' +
      l.map(function(x){
        return '<div class="tarj"><div class="vl">' + esc(x.txt) + '</div>' +
          '<button class="accion verde" data-reint="' + esc(x.id) + '">Volver a enviar</button>' +
          '<button class="accion gris" data-desc="' + esc(x.id) + '">Descartar</button></div>';
      }).join('') +
      '<button class="accion gris" id="nl-cerrar">Cerrar</button></div>',
    function(){
      $('#nl-cerrar').onclick = cerrar;
      Array.prototype.forEach.call($('#panel').querySelectorAll('[data-reint]'), function(b){
        b.onclick = async function(){
          var id = b.dataset.reint;
          if (id.indexOf('adj:') === 0){ await Adjuntos.reintentar(id.slice(4)); pintarNoLlego(); verNoLlego(); aviso('Se volvió a enviar.'); return; }
          if (id.indexOf('rep:') === 0){ await Reparaciones.reintentar(id.slice(4)); pintarNoLlego(); verNoLlego(); aviso('Se volvió a enviar.'); return; }
          if (id.indexOf('maestro:') === 0){ var x = Maestros.reintentar(id.slice(8)); if (x) encolar(x.hoja, x.fila, x.encabezados, x.id); }
          else { var pc = estado.porConfirmar[id]; if (pc){ reencolar(id, pc.tipo); if (pc.fecha) estado.porConfirmar[id].fecha = true; } }
          await persistir(); pintarNoLlego(); verNoLlego(); enviar();
          aviso('Se volvió a enviar.');
        };
      });
      Array.prototype.forEach.call($('#panel').querySelectorAll('[data-desc]'), function(b){
        b.onclick = async function(){
          var id = b.dataset.desc;
          if (!confirm('¿Descartar este registro? Se perderá lo que no llegó a la hoja.')) return;
          if (id.indexOf('adj:') === 0){ Adjuntos.descartar(id.slice(4)); pintarNoLlego(); verNoLlego(); return; }
          if (id.indexOf('rep:') === 0){ Reparaciones.descartar(id.slice(4)); pintar(); pintarNoLlego(); verNoLlego(); return; }
          if (id.indexOf('maestro:') === 0){ Maestros.descartar(id.slice(8)); FLOTA = Maestros.flota(); }
          else {
            var pc = estado.porConfirmar[id];
            delete estado.porConfirmar[id];
            if (pc && pc.tipo === 'ev') estado.eventos = estado.eventos.filter(function(x){ return x.id !== id; });
            if (pc && pc.tipo === 'nov') estado.novedades = estado.novedades.filter(function(x){ return x.id !== id; });
            if (pc && pc.tipo === 'foto'){ delete fotos[id.slice(5)]; guardarFotosLocal(); }
          }
          await persistir(); pintarNoLlego(); verNoLlego();
          traer(); traerFotos(); traerMaestros();
        };
      });
    });
}

/* Si no se puede leer la hoja, se dice claramente: lo que se ve puede no
   incluir lo registrado en otros celulares (nunca mostrar "todo bien" sin datos). */
function pintarLectura(ok){
  var b = $('#lectura');
  if (ok){ estado.leidoEn = new Date().toISOString(); b.hidden = true; return; }
  b.hidden = false;
  b.innerHTML = estado.leidoEn
    ? '<b>No se pudo actualizar desde la hoja de cálculo.</b> Lo que ve es lo último que se leyó, el ' +
      dcorta(estado.leidoEn.slice(0, 10)) + ' a las ' + new Date(estado.leidoEn).toTimeString().slice(0, 5) + '. Revise la señal.'
    : '<b>No se pudo leer la hoja de cálculo.</b> Lo que ve NO incluye lo registrado en otros celulares. ' +
      'Revise la señal y no use ventanas privadas o de incógnito.';
}
async function traer(){
  if (!navigator.onLine){ pintarLectura(false); return; }
  try {
    var r = await fetch(GS_URL + '?hoja=' + HOJA + '&t=' + Date.now());
    var d = await r.json();
    if (!d || !d.ok || !Array.isArray(d.datos)){ pintarLectura(false); return; }   // error del Apps Script: se deja lo local
    pintarLectura(true);
    // con una hoja abierta no se reemplazan los eventos: el formulario tiene uno en la mano
    if (!$('#hoja').hidden) return;
    fusionar(d.datos);
    fusionarNovedades(d.datos);
    estado.reportes = reportesDe(d.datos);
    var n = reenviarPendientes(['ev', 'nov']);
    await persistir();
    pintar();
    if (n) enviar();
  } catch(e){ pintarLectura(false); }
}

/* =====================================================================
   Fotos de las máquinas
   Van como texto (data URL) en la hoja "Fotos" con el mismo Apps Script:
   una celda de Sheets admite 50.000 caracteres, así que la foto se achica
   hasta caber. Columna 4 = equipo: subir otra el mismo día reemplaza la
   fila; si es otro día se agrega y vale la última.
   ===================================================================== */
function cargarFotosLocal(){ try { fotos = JSON.parse(localStorage.getItem(KEY_FOTOS) || '{}') || {}; } catch(e){ fotos = {}; } }
function guardarFotosLocal(){ try { localStorage.setItem(KEY_FOTOS, JSON.stringify(fotos)); return true; } catch(e){ return false; } }

function leerImagen(file){
  return new Promise(function(ok, mal){
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function(){ URL.revokeObjectURL(url); ok(img); };
    img.onerror = function(){ URL.revokeObjectURL(url); mal(new Error('No se pudo abrir la imagen')); };
    img.src = url;
  });
}
async function comprimirFoto(file){
  var img = await leerImagen(file);
  // recorte horizontal 3:2, que es como se muestra en todas partes
  var w = img.naturalWidth, h = img.naturalHeight, rw = w, rh = Math.round(w * 2 / 3);
  if (rh > h){ rh = h; rw = Math.round(h * 3 / 2); }
  var sx = Math.round((w - rw) / 2), sy = Math.round((h - rh) / 2);
  var anchos = [600, 480, 400, 320], calidades = [0.72, 0.6, 0.5];
  for (var i = 0; i < anchos.length; i++){
    var c = document.createElement('canvas');
    c.width = Math.min(anchos[i], rw); c.height = Math.round(c.width * rh / rw);
    c.getContext('2d').drawImage(img, sx, sy, rw, rh, 0, 0, c.width, c.height);
    for (var j = 0; j < calidades.length; j++){
      var d = c.toDataURL('image/jpeg', calidades[j]);
      if (d.length < 45000) return d;
    }
  }
  throw new Error('La foto es demasiado pesada');
}
async function subirFoto(cod, file){
  if (!estado.yo){ elegirPersona(function(){ verEquipo(cod); }); return; }
  var b = $('#cambiar-foto'); if (b) b.classList.add('subiendo');
  aviso('Procesando foto…');
  var dataUrl;
  try { dataUrl = await comprimirFoto(file); }
  catch(e){ if (b) b.classList.remove('subiendo'); aviso(e.message); return; }
  var anterior = fotos[cod];
  fotos[cod] = dataUrl;
  if (!guardarFotosLocal()){ if (anterior) fotos[cod] = anterior; else delete fotos[cod]; aviso('No cupo la foto en este celular.'); return; }
  encolarFoto(cod);
  await persistir();
  verEquipo(cod); pintar();
  aviso('Foto de ' + cod + ' guardada.');
  enviar();
}
function encolarFoto(cod){
  encolar('Fotos', [fechaCO(hoy()), horaAhora(), nombreDe(cod), cod, fotos[cod], estado.yo], ENC_FOTOS, 'foto:' + cod);
  porConfirmar('foto:' + cod, 'foto');
}
async function traerFotos(){
  if (!navigator.onLine) return;
  try {
    var r = await fetch(GS_URL + '?hoja=Fotos&t=' + Date.now());
    var d = await r.json();
    if (!d || !d.ok || !Array.isArray(d.datos)) return;
    var enCola = {};
    estado.cola.forEach(function(x){ enCola[x.id] = true; });
    var cambio = false, ult = {};
    d.datos.forEach(function(row){
      var cod = String(row[3]||'').trim(), url = String(row[4]||'');
      if (cod && url.indexOf('data:image/') === 0) ult[cod] = url;
    });
    Object.keys(estado.porConfirmar).forEach(function(id){       // la foto enviada ya está en la hoja
      var cod = id.slice(5);
      if (id.indexOf('foto:') === 0 && !enCola[id] && ult[cod] && ult[cod] === fotos[cod]) delete estado.porConfirmar[id];
    });
    Object.keys(ult).forEach(function(cod){
      if (enCola['foto:' + cod] || estado.porConfirmar['foto:' + cod]) return;
      if (fotos[cod] !== ult[cod]){ fotos[cod] = ult[cod]; cambio = true; }
    });
    if (cambio) guardarFotosLocal();
    var n = reenviarPendientes(['foto']);
    await persistir();
    if ($('#hoja').hidden) pintar();
    if (n) enviar();
  } catch(e){}
}

/* =====================================================================
   PIN
   ===================================================================== */
function montarPin(){
  var val = '';
  var teclas = ['1','2','3','4','5','6','7','8','9','','0','⌫'];
  $('#pin-teclas').innerHTML = teclas.map(function(t){
    return t ? '<button data-t="' + t + '">' + t + '</button>' : '<span></span>';
  }).join('');
  function puntos(){ Array.prototype.forEach.call($('#pin-puntos').children, function(p, i){
    p.className = i < val.length ? 'lleno' : ''; }); }
  Array.prototype.forEach.call($('#pin-teclas').querySelectorAll('button'), function(b){
    b.onclick = function(){
      $('#pin-error').textContent = '';
      if (b.dataset.t === '⌫'){ val = val.slice(0, -1); puntos(); return; }
      if (val.length >= 4) return;
      val += b.dataset.t; puntos();
      if (val.length < 4) return;
      if (val === PIN){
        try { localStorage.setItem('pin_ok_taller', '1'); } catch(e){}
        $('#pin').hidden = true;
      } else { val = ''; puntos(); $('#pin-error').textContent = 'PIN incorrecto. Inténtelo de nuevo.'; }
    };
  });
}

   Arranque

$('#btn-reportar').onclick = function(){ reportar(null); };

/* instalar como app */
if ('serviceWorker' in navigator){
  navigator.serviceWorker.register('/maquinaria-taller-palmag/sw.js').catch(function(){});
}

else $('#btn-yo').style.cursor = 'default';

(async function init(){
  if (document.documentElement.classList.contains('pin-ok')) $('#pin').hidden = true;
  montarPin();
  var fh = new Date().toLocaleDateString('es-CO', { weekday:'long', day:'numeric', month:'long' });

  var g = await DB.cargar();

  if (!estado.eventos) estado.eventos = [];
  if (!estado.cola) estado.cola = [];
  if (!estado.novedades) estado.novedades = [];
  if (!estado.porConfirmar) estado.porConfirmar = {};
  cargarFotosLocal();
  if (PERSONAS.indexOf(estado.yo) < 0) estado.yo = PERSONAS.length === 1 ? PERSONAS[0] : '';
  // limpia datos de ejemplo y campos de la primera versión
  estado.eventos = estado.eventos.filter(function(e){ return !e.ejemplo; });
  delete estado.ejemploCargado; delete estado.pendientes;
  pintar(); pintarNoLlego();
  // comprueba el almacenamiento guardando de verdad, no adivinando
  if (!(await DB.guardar(estado))) { sinGuardar = true; pintarSync(); }
  await enviar();
  await traer();
  traerFotos();
  traerMaestros();
  traerHorometros();
  traerViejo();
  traerReparaciones();
  window.addEventListener('online', async function(){ await enviar(); traer(); });
  setInterval(function(){ if (!estado.cola.length) traer(); else enviar(); }, 60000);
  setInterval(function(){ traerFotos(); traerMaestros(); traerHorometros(); traerViejo(); traerReparaciones(); }, 10 * 60000);
})();
