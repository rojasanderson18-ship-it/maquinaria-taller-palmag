<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taller — Palma Grande</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDF0EE; --card:#fff; --ink:#16211C; --soft:#4A5B53; --steel:#7E8C86; --line:#D3DAD6;
    --green:#1F5D3C; --green-s:#E2EDE6; --amber:#B0600D; --amber-s:#FBEEDC;
    --red:#9E2B21; --red-s:#F9E3E1; --r:4px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:'Barlow',system-ui,sans-serif;font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace}
  button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
  :focus-visible{outline:3px solid var(--green);outline-offset:2px}

  header{background:var(--ink);color:#EDF0EE;padding:14px 16px;position:sticky;top:0;z-index:20}
  header .fila{display:flex;align-items:center;gap:10px;max-width:760px;margin:0 auto}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .yo{margin-left:auto;font-size:13px;color:#9CB3A7;background:#2A3A33;border-radius:20px;padding:5px 12px}
  .sync{background:var(--amber);color:#fff;font-size:13px;padding:7px 16px;text-align:center}
  .sync[hidden]{display:none}

  .wrap{max-width:760px;margin:0 auto;padding:14px 16px 110px}
  .resumen{display:flex;gap:10px;margin-bottom:16px}
  .res{flex:1;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
  .res .n{font-size:30px;font-weight:700;line-height:1}
  .res .t{font-size:13px;color:var(--soft)}
  .res.mal{border-left:4px solid var(--red)} .res.mal .n{color:var(--red)}
  .res.bien{border-left:4px solid var(--green)} .res.bien .n{color:var(--green)}

  h2{font-size:14px;margin:20px 0 8px;font-weight:600;color:var(--soft);text-transform:uppercase;letter-spacing:.04em}

  .eq{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
      padding:14px;margin-bottom:9px;display:flex;align-items:center;gap:13px}
  .eq:active{transform:scale(.995)}
  .eq.varado{border-left:4px solid var(--red);background:#FFF9F8}
  .eq .cod{font-size:19px;font-weight:700;min-width:62px}
  .eq .nom{font-size:15px}
  .eq .det{font-size:13px;color:var(--steel);margin-top:2px}
  .eq .det b{color:var(--red)}
  .eq .ir{margin-left:auto;color:var(--steel);font-size:22px;flex:none}
  .eq.ok .cod{color:var(--green)}

  .fab{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(to top,var(--paper) 72%,rgba(237,240,238,0));
       padding:14px 16px calc(14px + env(safe-area-inset-bottom));z-index:15}
  .fab button{display:block;width:100%;max-width:728px;margin:0 auto;background:var(--red);color:#fff;
       padding:17px;border-radius:var(--r);font-size:17px;font-weight:700}
  .fab button.secundario{background:var(--card);color:var(--soft);border:1px solid var(--line);font-size:15px;font-weight:600;padding:14px}

  .hoja{position:fixed;inset:0;background:rgba(14,22,18,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
  .hoja[hidden]{display:none}
  .panel{background:var(--paper);width:100%;max-width:760px;max-height:94vh;overflow:auto;
         border-radius:14px 14px 0 0;padding:0 0 calc(18px + env(safe-area-inset-bottom))}
  .panel .tope{position:sticky;top:0;background:var(--paper);padding:16px 16px 10px;border-bottom:1px solid var(--line);z-index:2}
  .panel .tope .fila{display:flex;align-items:center;gap:10px}
  .panel h3{margin:0;font-size:19px;font-weight:700}
  .panel .sub{font-size:13px;color:var(--steel)}
  .cerrar{margin-left:auto;font-size:26px;color:var(--steel);padding:0 6px;line-height:1}
  .cuerpo{padding:16px}

  .paso{font-size:14px;font-weight:600;color:var(--soft);margin:0 0 9px}
  .rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:9px;margin-bottom:20px}
  .op{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:15px 8px;text-align:center;font-weight:600;font-size:15px;line-height:1.2}
  .op small{display:block;font-weight:400;font-size:12px;color:var(--steel);margin-top:3px}
  .op[aria-pressed=true]{border-color:var(--green);background:var(--green-s);color:var(--green)}
  .op.ancho{grid-column:1/-1;text-align:left;padding:15px 14px}

  .campo{display:block;margin-bottom:18px}
  .campo span{display:block;font-size:14px;font-weight:600;color:var(--soft);margin-bottom:6px}
  .campo span i{font-weight:400;font-style:normal;color:var(--steel)}
  .campo textarea,.campo input{width:100%;padding:13px;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
  .campo textarea{min-height:78px;resize:vertical}

  .accion{display:block;width:100%;padding:17px;border-radius:var(--r);font-size:17px;font-weight:700;margin-bottom:10px}
  .accion.verde{background:var(--green);color:#fff}
  .accion.roja{background:var(--red);color:#fff}
  .accion.gris{background:var(--card);border:1px solid var(--line);color:var(--ink);font-weight:600}
  .accion[disabled]{opacity:.45}

  .tarj{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px}
  .tarj.alerta{border-left:4px solid var(--red);background:#FFF9F8}
  .tarj .et{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--steel);font-weight:600}
  .tarj .vl{font-size:16px;margin-top:2px}
  .tarj .vl.grande{font-size:21px;font-weight:700}
  .hist{font-size:14px;padding:9px 0;border-bottom:1px solid #EDEFEE;display:flex;gap:10px}
  .hist:last-child{border-bottom:none}
  .hist .f{color:var(--steel);font-size:13px;min-width:72px;flex:none}
  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600}
  .pill.r{background:var(--red-s);color:var(--red)}
  .pill.a{background:var(--amber-s);color:var(--amber)}
  .pill.v{background:var(--green-s);color:var(--green)}
  .nota{font-size:13px;color:var(--steel);margin:0 0 16px}
  .vacio{background:var(--card);border:1px dashed var(--line);border-radius:var(--r);padding:26px 16px;text-align:center;color:var(--steel)}
  .barra i.a{background:var(--amber)} .barra i.r{background:var(--red)}
  .nota-inf{background:var(--amber-s);border-left:4px solid var(--amber);color:#7A430A;padding:12px 14px;border-radius:2px;margin-bottom:14px;font-size:14px}
  .aviso{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;background:var(--ink);color:#EDF0EE;
         padding:12px 20px;border-radius:var(--r);z-index:60;font-size:15px;max-width:90%;text-align:center}
  .aviso[hidden]{display:none}
</style>
</head>
<body>

<header><div class="fila">
  <h1>Taller</h1>
  <button class="yo" id="btn-yo">—</button>
</div></header>
<div class="sync" id="sync" hidden></div>


<div class="wrap" id="app"></div>

<div class="fab" id="fab"><button id="btn-reportar" class="secundario">Reportar una máquina que no esté en la lista</button></div>

<div class="hoja" id="hoja" hidden><div class="panel" id="panel"></div></div>
<div class="aviso" id="aviso" hidden></div>

<script>
/* =====================================================================
   TALLER — Palma Grande S.A.S.
   Captura solo lo que el informe de disponibilidad necesita:
   qué máquina, cuándo quedó fuera, cuándo volvió, qué le pasó,
   si fue falla o mantenimiento, y quién lo registró.
   Un evento = un registro, que nace abierto y se cierra con el alta.
   ===================================================================== */

var FLOTA = [
  {cod:'#01',  nombre:'Kubota B2441'},
  {cod:'#02',  nombre:'Kubota B2441'},
  {cod:'#03',  nombre:'Kubota M9540'},
  {cod:'#04',  nombre:'Kubota M9540'},
  {cod:'#05',  nombre:'John Deere 2850'},
  {cod:'#06',  nombre:'Kubota K5100'},
  {cod:'#07',  nombre:'Kubota M108S'},
  {cod:'#08',  nombre:'Lovol TH754-H'},
  {cod:'#09',  nombre:'Lovol TH754-H'},
  {cod:'#10',  nombre:'Lovol TH904-X'},
  {cod:'#11',  nombre:'Lovol TH904-X'},
  {cod:'FORD', nombre:'Ford 5000'},
  {cod:'EXX568', nombre:'VW Constellation'},
  {cod:'SXY206', nombre:'Isuzu FVR'}
];

/* Los sistemas son botones, no una lista desplegable. De aquí sale el Pareto
   de fallas que hoy no se puede sacar porque la novedad es texto libre. */
var SISTEMAS = [
  {id:'motor',       txt:'Motor'},
  {id:'hidraulico',  txt:'Hidráulico'},
  {id:'electrico',   txt:'Eléctrico'},
  {id:'transmision', txt:'Transmisión'},
  {id:'frenos',      txt:'Frenos'},
  {id:'llantas',     txt:'Llantas'},
  {id:'implemento',  txt:'Implemento'},
  {id:'otro',        txt:'Otro'}
];

var PERSONAS = ['Tulio', 'Juan Carlos Oviedo', 'Brayan Pérez', 'Ing. Luis Fernando'];

var KEY = 'taller-palma-v1';
var estado = { eventos: [], yo: '', pendientes: 0 };

/* ---------- almacenamiento ---------- */
/* window.storage solo existe dentro de Claude; en GitHub Pages se usa localStorage */
var DB = {
  cargar: async function(){
    try {
      if (window.storage){ var r = await window.storage.get(KEY); return r ? JSON.parse(r.value) : null; }
      var v = localStorage.getItem(KEY); return v ? JSON.parse(v) : null;
    }
    catch(e){ return null; }
  },
  guardar: async function(d){
    try {
      if (window.storage) await window.storage.set(KEY, JSON.stringify(d));
      else localStorage.setItem(KEY, JSON.stringify(d));
      return true;
    }
    catch(e){ return false; }
  }
};
var sinGuardar = false;
async function persistir(){
  var ok = await DB.guardar(estado);
  if (sinGuardar !== !ok){ sinGuardar = !ok; pintarSync(); }
  return ok;
}

/* ---------- utilidades ---------- */
function $(s){ return document.querySelector(s); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function p2(n){ return ('0'+n).slice(-2); }
function isoLocal(d){ return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()); }
function hoy(){ return isoLocal(new Date()); }
function ahora(){ var d=new Date(); return isoLocal(d)+'T'+p2(d.getHours())+':'+p2(d.getMinutes()); }
function dcorta(iso){ if(!iso) return '—'; var p=String(iso).slice(0,10).split('-'); return p[2]+'/'+p[1]; }
function nid(){ return 'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function diasEntre(a, b){
  var x = new Date(String(a).slice(0,10)+'T12:00:00'), y = new Date(String(b).slice(0,10)+'T12:00:00');
  return Math.max(0, Math.round((y-x)/86400000));
}
function aviso(m){ var a=$('#aviso'); a.textContent=m; a.hidden=false;
  clearTimeout(a._t); a._t=setTimeout(function(){ a.hidden=true; }, 3000); }
function nombreDe(cod){ var e = FLOTA.filter(function(f){ return f.cod===cod; })[0]; return e ? e.nombre : ''; }
function txtSistema(id){ var s = SISTEMAS.filter(function(x){ return x.id===id; })[0]; return s ? s.txt : id; }

function abiertoDe(cod){
  return estado.eventos.filter(function(e){ return e.equipo===cod && !e.fechaAlta; })[0] || null;
}
function pintarSync(){
  var s = $('#sync');
  if (sinGuardar){ s.hidden = false; s.textContent = 'Sin guardar en este dispositivo. Avísele a Anderson.'; return; }
  if (estado.pendientes > 0){ s.hidden = false;
    s.textContent = estado.pendientes + ' registro(s) esperando señal para enviarse. Puede seguir trabajando.'; return; }
  s.hidden = true;
}

/* =====================================================================
   Pantalla principal
   ===================================================================== */
function pintar(){
  var varados = [], libres = [];
  FLOTA.forEach(function(f){
    var ab = abiertoDe(f.cod);
    (ab ? varados : libres).push({ f: f, ab: ab });
  });
  varados.sort(function(a,b){ return a.ab.fechaReporte < b.ab.fechaReporte ? -1 : 1; });

  var h = '<div class="resumen">' +
    '<div class="res ' + (varados.length ? 'mal' : 'bien') + '"><div class="n">' + varados.length +
      '</div><div class="t">' + (varados.length === 1 ? 'máquina parada' : 'máquinas paradas') + '</div></div>' +
    '<div class="res bien"><div class="n">' + libres.length + '</div><div class="t">trabajando</div></div>' +
    '</div>';

  if (varados.length){
    h += '<h2>Reportadas por los operarios</h2>';
    h += varados.map(function(v){
      var d = diasEntre(v.ab.fechaReporte, hoy());
      return '<button class="eq varado" data-cod="' + esc(v.f.cod) + '">' +
        '<span class="cod mono">' + esc(v.f.cod) + '</span>' +
        '<span><span class="nom">' + esc(v.f.nombre) + '</span>' +
        '<span class="det">' + (v.ab.novedad ? esc(v.ab.novedad) : 'sin detalle') +
          '<br>Reportó ' + esc(v.ab.reportadoPor || '—') +
          (v.ab.origen === 'preoperativo' ? ' en el preoperativo' : '') + ' · ' +
          '<b>' + (d === 0 ? 'desde hoy' : 'parada hace ' + d + (d===1?' día':' días')) + '</b>' +
        '</span></span><span class="ir">›</span></button>';
    }).join('');
  } else {
    h += '<div class="vacio">Ninguna máquina parada en este momento.</div>';
  }

  h += '<h2>Trabajando</h2>';
  h += libres.map(function(v){
    return '<button class="eq ok" data-cod="' + esc(v.f.cod) + '">' +
      '<span class="cod mono">' + esc(v.f.cod) + '</span>' +
      '<span><span class="nom">' + esc(v.f.nombre) + '</span></span>' +
      '<span class="ir">›</span></button>';
  }).join('');

  if (estado.eventos.some(function(e){ return e.ejemplo; })){
    h = '<div class="nota-inf">Estos reportes son de ejemplo, para mostrar cómo llegan los varados desde el ' +
        'preoperativo. <button id="borrar-ej" style="text-decoration:underline;font-weight:700">Borrarlos</button></div>' + h;
  }
  $('#app').innerHTML = h;
  var be = $('#borrar-ej'); if (be) be.onclick = borrarEjemplo;
  Array.prototype.forEach.call($('#app').querySelectorAll('.eq'), function(b){
    b.onclick = function(){ verEquipo(b.dataset.cod); };
  });
  $('#btn-yo').textContent = estado.yo || '¿Quién eres?';
  pintarSync();
}

/* =====================================================================
   Hoja deslizable
   ===================================================================== */
function abrir(html, alMontar){
  $('#panel').innerHTML = html;
  $('#hoja').hidden = false;
  document.body.style.overflow = 'hidden';
  Array.prototype.forEach.call($('#panel').querySelectorAll('[data-cerrar]'), function(b){ b.onclick = cerrar; });
  if (alMontar) alMontar();
}
function cerrar(){ $('#hoja').hidden = true; $('#panel').innerHTML = ''; document.body.style.overflow = ''; }
$('#hoja').addEventListener('click', function(e){ if (e.target.id === 'hoja') cerrar(); });
document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !$('#hoja').hidden) cerrar(); });

function tope(titulo, sub){
  return '<div class="tope"><div class="fila"><div><h3>' + esc(titulo) + '</h3>' +
    (sub ? '<div class="sub">' + esc(sub) + '</div>' : '') +
    '</div><button class="cerrar" data-cerrar>×</button></div></div>';
}

/* =====================================================================
   Quién está usando la app (trazabilidad sin PIN ni fricción)
   ===================================================================== */
function elegirPersona(despues){
  abrir(tope('¿Quién está registrando?', 'Queda guardado en cada registro') +
    '<div class="cuerpo"><div class="rejilla">' +
    PERSONAS.map(function(p){
      return '<button class="op ancho" data-p="' + esc(p) + '" aria-pressed="' + (estado.yo===p) + '">' + esc(p) + '</button>';
    }).join('') + '</div></div>',
    function(){
      Array.prototype.forEach.call($('#panel').querySelectorAll('[data-p]'), function(b){
        b.onclick = async function(){
          estado.yo = b.dataset.p;
          await persistir(); cerrar(); pintar();
          if (despues) despues();
        };
      });
    });
}

/* =====================================================================
   Reportar una máquina dañada
   ===================================================================== */
function reportar(codPre){
  if (!estado.yo) { elegirPersona(function(){ reportar(codPre); }); return; }
  var sel = { equipo: codPre || null, tipo: 'falla' };

  var disponibles = FLOTA.filter(function(f){ return !abiertoDe(f.cod); });
  if (!disponibles.length){ aviso('Todas las máquinas ya están reportadas.'); return; }

  abrir(tope('Reportar una máquina', 'Solo si el operario no alcanzó a reportarla') +
    '<div class="cuerpo">' +
      '<p class="paso">1. ¿Cuál máquina?</p><div class="rejilla" id="g-eq">' +
        disponibles.map(function(f){
          return '<button class="op" data-eq="' + esc(f.cod) + '" aria-pressed="' + (sel.equipo===f.cod) + '">' +
            esc(f.cod) + '<small>' + esc(f.nombre) + '</small></button>';
        }).join('') + '</div>' +

      '<p class="paso">2. ¿Se dañó o entra a mantenimiento?</p><div class="rejilla" id="g-tipo">' +
        '<button class="op ancho" data-tipo="falla" aria-pressed="true">Se dañó<small>Entra como falla en el informe</small></button>' +
        '<button class="op ancho" data-tipo="mantenimiento" aria-pressed="false">Mantenimiento programado<small>No cuenta como falla</small></button>' +
      '</div>' +

      '<label class="campo"><span>¿Qué le pasa? <i>— opcional</i></span>' +
        '<textarea id="nov" placeholder="Fuga, ruido, no arranca…"></textarea></label>' +

      '<button class="accion roja" id="guardar" disabled>Dejarla reportada</button>' +
      '<button class="accion gris" data-cerrar>Cancelar</button>' +
      '<p class="nota">Queda parada desde hoy. De qué sistema fue la falla se escoge después, al darle el alta, que es cuando ya se sabe.</p>' +
    '</div>',
    function(){
      function refrescar(){
        Array.prototype.forEach.call($('#panel').querySelectorAll('[data-eq]'), function(b){
          b.setAttribute('aria-pressed', String(b.dataset.eq === sel.equipo)); });
        Array.prototype.forEach.call($('#panel').querySelectorAll('[data-tipo]'), function(b){
          b.setAttribute('aria-pressed', String(b.dataset.tipo === sel.tipo)); });
        $('#guardar').disabled = !sel.equipo;
      }
      Array.prototype.forEach.call($('#panel').querySelectorAll('[data-eq]'), function(b){
        b.onclick = function(){ sel.equipo = b.dataset.eq; refrescar(); }; });
      Array.prototype.forEach.call($('#panel').querySelectorAll('[data-tipo]'), function(b){
        b.onclick = function(){ sel.tipo = b.dataset.tipo; refrescar(); }; });
      refrescar();

      $('#guardar').onclick = async function(){
        if (!sel.equipo) return;
        estado.eventos.push({
          id: nid(),
          equipo: sel.equipo,
          tipo: sel.tipo,
          sistema: null,                 // lo clasifica el mecánico al cerrar
          novedad: $('#nov').value.trim(),
          reportadoPor: estado.yo,
          origen: 'taller',
          fechaReporte: hoy(),
          registradoEn: ahora(),
          fechaAlta: null,
          altaPor: null,
          trabajo: '',
          cerradoEn: null,
          enviado: false
        });
        estado.pendientes = estado.eventos.filter(function(e){ return !e.enviado; }).length;
        await persistir();
        cerrar(); pintar();
        aviso(sel.equipo + ' quedó reportada como parada.');
      };
    });
}

/* =====================================================================
   Pantalla de una máquina
   ===================================================================== */
function verEquipo(cod){
  var ab = abiertoDe(cod);
  var historial = estado.eventos.filter(function(e){ return e.equipo === cod && e.fechaAlta; })
    .sort(function(a,b){ return a.fechaAlta < b.fechaAlta ? 1 : -1; });

  var h = tope(cod + ' · ' + nombreDe(cod), ab ? 'Parada' : 'Trabajando') + '<div class="cuerpo">';
  var sisSel = { v: ab ? ab.sistema : null };

  if (ab){
    var d = diasEntre(ab.fechaReporte, hoy());
    h += '<div class="tarj alerta">' +
      '<div class="et">' + (ab.tipo === 'mantenimiento' ? 'Entró a mantenimiento programado' : 'Lo que reportaron') + '</div>' +
      '<div class="vl grande">' + (ab.novedad ? esc(ab.novedad) : 'Sin detalle') + '</div>' +
      '<div class="vl" style="color:var(--steel);font-size:14px;margin-top:6px">' +
        esc(ab.reportadoPor || '—') + (ab.origen === 'preoperativo' ? ' en el preoperativo' : '') +
        ' el ' + dcorta(ab.fechaReporte) +
        ' · parada ' + (d === 0 ? 'desde hoy' : 'hace ' + d + (d===1?' día':' días')) + '</div>' +
      '</div>';

    // El mecánico es quien sabe de qué fue: el operario reporta el síntoma, él clasifica
    h += '<p class="paso">¿De qué fue?</p><div class="rejilla" id="g-sis">' +
      SISTEMAS.map(function(x){
        return '<button class="op" data-sis="' + esc(x.id) + '" aria-pressed="' + (sisSel.v===x.id) + '">' +
          esc(x.txt) + '</button>';
      }).join('') + '</div>' +
      '<div id="repetida"></div>' +
      '<label class="campo"><span>¿Qué se le hizo? <i>— opcional</i></span>' +
        '<textarea id="trab" placeholder="Cambio de manguera, se purgó el sistema…"></textarea></label>' +
      '<button class="accion verde" id="alta" disabled>Ya quedó lista</button>' +
      '<button class="accion gris" data-cerrar>Todavía no</button>';
  } else {
    h += '<div class="tarj"><div class="et">Estado</div><div class="vl grande" style="color:var(--green)">Trabajando</div></div>' +
      '<button class="accion roja" id="rep">Reportar que se dañó</button>' +
      '<button class="accion gris" data-cerrar>Cerrar</button>';
  }

  if (historial.length){
    h += '<h2 style="margin-top:22px">Últimas reparaciones</h2><div class="tarj">' +
      historial.slice(0, 8).map(function(e){
        return '<div class="hist"><span class="f mono">' + dcorta(e.fechaReporte) + '</span>' +
          '<span>' + (e.sistema ? '<span class="pill ' + (e.tipo === 'mantenimiento' ? 'a' : 'r') + '">' +
          esc(txtSistema(e.sistema)) + '</span> ' : '') +
          (e.novedad ? esc(e.novedad) : '') +
          '<br><span style="color:var(--steel);font-size:13px">' +
          diasEntre(e.fechaReporte, e.fechaAlta) + ' días parada · alta por ' + esc(e.altaPor || '—') +
          (e.trabajo ? ' · ' + esc(e.trabajo) : '') + '</span></span></div>';
      }).join('') + '</div>';
  }

  h += '</div>';

  abrir(h, function(){
    var a = $('#alta');

    // avisar si esa misma parte ya había fallado
    function verRepetida(){
      var c = $('#repetida'); if (!c) return;
      if (!sisSel.v){ c.innerHTML = ''; return; }
      var n = historial.filter(function(e){
        return e.sistema === sisSel.v && e.fechaAlta && diasEntre(e.fechaAlta, hoy()) <= 90; }).length;
      c.innerHTML = n > 0
        ? '<div class="tarj alerta"><div class="et">Ojo</div><div class="vl">Esta máquina ya falló ' + n +
          (n===1?' vez':' veces') + ' por ' + esc(txtSistema(sisSel.v)).toLowerCase() +
          ' en los últimos tres meses.</div></div>'
        : '';
    }
    Array.prototype.forEach.call($('#panel').querySelectorAll('[data-sis]'), function(b){
      b.onclick = function(){
        sisSel.v = b.dataset.sis;
        Array.prototype.forEach.call($('#panel').querySelectorAll('[data-sis]'), function(x){
          x.setAttribute('aria-pressed', String(x.dataset.sis === sisSel.v)); });
        if (a) a.disabled = false;
        verRepetida();
      };
    });
    if (a && sisSel.v) a.disabled = false;
    verRepetida();

    if (a) a.onclick = async function(){
      if (!estado.yo){ cerrar(); elegirPersona(function(){ verEquipo(cod); }); return; }
      if (!sisSel.v){ aviso('Escoja de qué parte fue.'); return; }
      ab.sistema = sisSel.v;
      ab.fechaAlta = hoy();
      ab.altaPor = estado.yo;
      ab.trabajo = ($('#trab').value || '').trim();
      ab.cerradoEn = ahora();
      ab.enviado = false;
      estado.pendientes = estado.eventos.filter(function(e){ return !e.enviado; }).length;
      await persistir();
      cerrar(); pintar();
      aviso(cod + ' quedó disponible. ' + diasEntre(ab.fechaReporte, ab.fechaAlta) + ' día(s) parada.');
    };
    var r = $('#rep');
    if (r) r.onclick = function(){ cerrar(); reportar(cod); };
  });
}

/* Mientras no esté conectado al preoperativo, estos tres entran como ejemplo
   para que se vea de dónde salen los varados. Se borran desde el aviso. */
function sembrarEjemplo(){
  var d = function(n){ var x = new Date(); x.setDate(x.getDate()-n); return isoLocal(x); };
  [['#05','Julio Vacca','No arranca, se pidió repuesto',6],
   ['#09','Cesar Verona','Llanta trasera averiada',2],
   ['#07','Jhon Garnica','Bota aceite por la manguera',0]].forEach(function(x){
    estado.eventos.push({ id:nid(), equipo:x[0], tipo:'falla', sistema:null, novedad:x[2],
      reportadoPor:x[1], origen:'preoperativo', fechaReporte:d(x[3]), registradoEn:d(x[3])+'T06:30',
      fechaAlta:null, altaPor:null, trabajo:'', cerradoEn:null, enviado:false, ejemplo:true });
  });
  estado.ejemploCargado = true;
}
async function borrarEjemplo(){
  estado.eventos = estado.eventos.filter(function(e){ return !e.ejemplo; });
  estado.pendientes = estado.eventos.filter(function(e){ return !e.enviado; }).length;
  await persistir(); pintar(); aviso('Ejemplos borrados.');
}

(async function init(){
  var g = await DB.cargar();
  if (g && g.eventos) estado = g;
  if (!estado.eventos) estado.eventos = [];
  if (!estado.ejemploCargado && !estado.eventos.length) sembrarEjemplo();
  estado.pendientes = estado.eventos.filter(function(e){ return !e.enviado; }).length;
  pintar();
  // comprueba el almacenamiento guardando de verdad, no adivinando
  if (!(await DB.guardar(estado))) { sinGuardar = true; pintarSync(); }
})();
