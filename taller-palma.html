<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Taller — Palma Grande</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --verde:#1a4731;--verde-m:#2d6a4f;--verde-s:#52b788;--verde-p:#d8f3dc;--verde-pp:#f0faf2;
  --dorado:#b7791f;--dorado-p:#fef3c7;
  --rojo:#991b1b;--rojo-m:#dc2626;--rojo-p:#fee2e2;
  --naranja:#ea580c;--naranja-p:#ffedd5;
  --azul:#1e40af;--azul-p:#dbeafe;
  --gris:#64748b;--gris-p:#f1f5f9;--gris-b:#e2e8f0;
  --bg:#f0f4f1;--surface:#fff;--text:#1e293b;--muted:#64748b;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:72px}
.top-bar{height:4px;background:linear-gradient(90deg,var(--dorado),#f59e0b)}
header{background:var(--verde);padding:12px 16px 0;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.25)}
.hdr-row{display:flex;align-items:center;justify-content:space-between;padding-bottom:11px}
.hdr-left{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;background:var(--dorado);border-radius:9px;display:grid;place-items:center;font-size:18px;flex-shrink:0}
.hdr-title{font-family:'DM Serif Display',serif;font-size:16px;color:#fff;line-height:1.1}
.hdr-sub{font-size:10px;color:rgba(255,255,255,.45);margin-top:1px}
.hdr-badge{background:rgba(255,255,255,.1);border-radius:7px;padding:4px 10px;font-size:11px;color:rgba(255,255,255,.75);white-space:nowrap}
.tabs{display:flex;border-top:1px solid rgba(255,255,255,.1)}
.tab{flex:1;padding:10px 4px;border:none;background:transparent;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;color:rgba(255,255,255,.5);border-bottom:3px solid transparent;transition:all .2s;text-align:center}
.tab.active{color:#fff;border-bottom-color:var(--dorado)}
main{max-width:600px;margin:0 auto;padding:14px 13px}
.sec{display:none}.sec.active{display:block;animation:fadeUp .25s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty-icon{font-size:36px;margin-bottom:8px}
.empty-title{font-size:14px;font-weight:700;margin-bottom:3px}
.empty-sub{font-size:12px;opacity:.7}
.loading{text-align:center;padding:32px 16px;color:var(--muted)}
.spinner{width:22px;height:22px;border:3px solid var(--gris-b);border-top-color:var(--verde-m);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}
.preop-card{background:var(--surface);border-radius:14px;margin-bottom:11px;box-shadow:0 1px 3px rgba(0,0,0,.06);overflow:hidden;border-left:5px solid var(--gris-b)}
.preop-card.pendiente{border-left-color:var(--dorado)}
.preop-card.autorizado{border-left-color:var(--verde-s)}
.preop-card.observacion{border-left-color:var(--naranja)}
.preop-card.retenido{border-left-color:var(--rojo-m)}
.preop-card.alta{border-left-color:var(--azul)}
.pc-hdr{padding:12px 14px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;cursor:pointer}
.pc-equipo{font-weight:700;font-size:14px;line-height:1.2}
.pc-meta{font-size:11px;color:var(--muted);margin-top:2px}
.pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.pill-ok{background:var(--verde-p);color:var(--verde-m)}
.pill-obs{background:var(--naranja-p);color:var(--naranja)}
.pill-fail{background:var(--rojo-p);color:var(--rojo-m)}
.pill-wait{background:var(--dorado-p);color:var(--dorado)}
.pill-alta{background:var(--azul-p);color:var(--azul)}
.pill-gris{background:var(--gris-p);color:var(--gris)}
.pc-body{padding:0 14px 14px;display:none}
.pc-body.open{display:block}
.niveles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.nivel-box{background:var(--gris-p);border-radius:9px;padding:8px 5px;text-align:center;border:1.5px solid transparent}
.nivel-box.warn{background:var(--naranja-p);border-color:#fdba74}
.nivel-box.danger{background:var(--rojo-p);border-color:#fca5a5}
.nivel-lbl{font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.nivel-val{font-size:16px;font-weight:700;color:var(--text)}
.nivel-box.warn .nivel-val{color:var(--naranja)}
.nivel-box.danger .nivel-val{color:var(--rojo-m)}
.items-falla{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.item-tag{padding:5px 9px;border-radius:8px;font-size:11px;font-weight:700}
.item-warn{background:var(--naranja-p);color:var(--naranja)}
.item-fail{background:var(--rojo-p);color:var(--rojo-m)}
.items-ok{font-size:12px;color:var(--verde-m);font-weight:600;margin-bottom:10px}
.nov-operario{background:var(--rojo-p);border-left:3px solid var(--rojo-m);border-radius:8px;padding:9px 11px;margin-bottom:10px;font-size:12px;line-height:1.5}
.nov-op-lbl{font-size:10px;font-weight:700;color:var(--rojo-m);text-transform:uppercase;margin-bottom:3px}
.horo-row{display:flex;justify-content:space-between;align-items:center;background:var(--gris-p);border-radius:8px;padding:7px 10px;margin-bottom:10px;font-size:12px}
.horo-val{font-weight:700;font-size:13px}
.dec-lbl{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:7px}
.dec-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:8px}
.dec-btn{padding:11px 4px;border-radius:10px;border:2px solid var(--gris-b);cursor:pointer;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:700;background:var(--gris-p);color:var(--muted);transition:all .15s;text-align:center}
.dec-btn:active{transform:scale(.97)}
.dec-btn.sel-sale{background:var(--verde-m);color:#fff;border-color:var(--verde)}
.dec-btn.sel-obs{background:var(--naranja);color:#fff;border-color:#c2410c}
.dec-btn.sel-nosale{background:var(--rojo-m);color:#fff;border-color:var(--rojo)}
.obs-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.obs-tag{padding:6px 10px;border-radius:8px;border:1.5px solid var(--gris-b);background:var(--surface);font-size:11px;cursor:pointer;transition:all .15s;user-select:none}
.obs-tag.sel{background:var(--verde-p);border-color:var(--verde-s);color:var(--verde-m);font-weight:600}
.obs-tag.rojo.sel{background:var(--rojo-p);border-color:var(--rojo-m);color:var(--rojo-m)}
.notas-input{width:100%;border:1.5px solid var(--gris-b);border-radius:9px;padding:9px 11px;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--text);background:var(--surface);outline:none;resize:vertical;min-height:56px;margin-bottom:8px}
.notas-input:focus{border-color:var(--verde-s)}
.conf-btn{width:100%;padding:12px;border-radius:10px;border:none;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;cursor:pointer;background:var(--verde);color:#fff;transition:all .2s}
.conf-btn:active{transform:scale(.99)}
.conf-btn.done{background:var(--gris-p);color:var(--gris)}
.dec-confirmada{border-radius:10px;padding:10px 13px;margin-bottom:10px;border:1.5px solid transparent}
.dec-conf-sale{background:var(--verde-pp);border-color:var(--verde-s)}
.dec-conf-obs{background:var(--naranja-p);border-color:#fdba74}
.dec-conf-nosale{background:var(--rojo-p);border-color:#fca5a5}
.dec-conf-txt{font-size:12px;font-weight:700}
.dec-conf-sub{font-size:11px;color:var(--muted);margin-top:2px}
.alta-sec{background:var(--azul-p);border:1.5px solid #93c5fd;border-radius:11px;padding:13px;margin-top:10px}
.alta-sec-lbl{font-size:11px;font-weight:700;color:var(--azul);text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px}
.alta-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px}
.alta-tag{padding:6px 10px;border-radius:8px;border:1.5px solid #93c5fd;background:#fff;font-size:11px;cursor:pointer;transition:all .15s;user-select:none}
.alta-tag.sel{background:var(--azul-p);border-color:var(--azul);color:var(--azul);font-weight:600}
.alta-input{width:100%;border:1.5px solid #93c5fd;border-radius:9px;padding:9px 11px;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--text);background:#fff;outline:none;resize:vertical;margin-bottom:7px}
.alta-input:focus{border-color:var(--azul)}
.alta-hora{width:100%;border:1.5px solid #93c5fd;border-radius:9px;padding:9px 11px;font-family:'DM Sans',sans-serif;font-size:13px;margin-bottom:8px;outline:none}
.alta-btn{width:100%;padding:12px;border-radius:10px;border:none;background:var(--azul);color:#fff;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;cursor:pointer}
.alta-hecha{background:var(--azul-p);border-radius:10px;padding:11px 13px;border:1.5px solid #93c5fd}
.alta-hecha-lbl{font-size:11px;font-weight:700;color:var(--azul);margin-bottom:5px}
.alta-hecha-txt{font-size:12px;color:var(--text)}
.varados-banner{background:var(--rojo-m);border-radius:12px;padding:13px 14px;margin-bottom:12px;color:#fff}
.varados-banner-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;opacity:.75;margin-bottom:8px}
.varado-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.15)}
.varado-item:last-child{border-bottom:none;padding-bottom:0}
.varado-num{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:12px;font-weight:700;flex-shrink:0}
.varado-info{flex:1;min-width:0}
.varado-nombre{font-size:13px;font-weight:700}
.varado-meta{font-size:11px;opacity:.7;margin-top:1px}
.varado-btn{background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.3);border-radius:8px;color:#fff;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:700;padding:6px 11px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.tractor-row{background:var(--surface);border-radius:12px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.06);display:flex;align-items:center;gap:11px;padding:13px 14px;cursor:pointer;border-left:4px solid var(--gris-b)}
.tractor-row.varado{border-left-color:var(--rojo-m)}
.tractor-row.autorizado{border-left-color:var(--verde-s)}
.tractor-row.observacion{border-left-color:var(--naranja)}
.tractor-row.retenido{border-left-color:var(--rojo-m)}
.tractor-row.pendiente{border-left-color:var(--dorado)}
.tr-num{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0;background:var(--gris)}
.tr-num.verde{background:var(--verde-m)}
.tr-num.rojo{background:var(--rojo-m)}
.tr-num.naranja{background:var(--naranja)}
.tr-num.dorado{background:var(--dorado)}
.tr-nombre{font-size:13px;font-weight:700}
.tr-meta{font-size:11px;color:var(--muted);margin-top:2px}
.tr-arrow{color:var(--muted);font-size:18px;margin-left:auto;flex-shrink:0}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:500;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal-sheet{background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-width:600px;max-height:88vh;display:flex;flex-direction:column;animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-pill{width:36px;height:4px;background:var(--gris-b);border-radius:2px;margin:10px auto 0;display:block}
.modal-hdr{padding:12px 16px;border-bottom:1px solid var(--gris-b);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.modal-titulo{font-family:'DM Serif Display',serif;font-size:16px}
.modal-close{width:30px;height:30px;border-radius:50%;border:none;background:var(--gris-p);cursor:pointer;font-size:14px;display:grid;place-items:center;color:var(--muted)}
.modal-body{padding:14px 16px;overflow-y:auto;flex:1}
.hist-entry{border-radius:11px;padding:11px 13px;margin-bottom:8px;border-left:3px solid var(--gris-b)}
.hist-preop{background:var(--gris-p);border-left-color:var(--verde-s)}
.hist-cierre{background:#f8fafc;border-left-color:var(--dorado)}
.hist-cierre.varado{background:var(--rojo-p);border-left-color:var(--rojo-m)}
.hist-cierre.novedad{background:var(--naranja-p);border-left-color:var(--naranja)}
.hist-cierre.operativo{background:var(--verde-pp);border-left-color:var(--verde-s)}
.hist-alta{background:var(--azul-p);border-left-color:var(--azul)}
.hist-fecha{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.hist-txt{font-size:12px;font-weight:700;color:var(--text)}
.hist-sub{font-size:11px;color:var(--muted);margin-top:2px}
.alta-hist-form{background:var(--rojo-p);border-radius:12px;padding:14px;margin-bottom:14px;border:1.5px solid var(--rojo-m)}
.alta-hist-lbl{font-size:12px;font-weight:700;color:var(--rojo-m);margin-bottom:10px;line-height:1.4}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--verde);color:#fff;padding:11px 20px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.2);opacity:0;transition:all .3s cubic-bezier(.34,1.56,.64,1);z-index:999;white-space:nowrap;border-left:4px solid var(--dorado);max-width:90vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#toast.error{background:var(--rojo-m);border-left-color:#fca5a5}
#pin-screen{position:fixed;inset:0;background:#1a4731;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px}
.pin-key{padding:15px;border-radius:11px;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.07);color:#fff;font-family:'DM Sans',sans-serif;font-size:18px;font-weight:600;cursor:pointer}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
</style>
<script>
if(localStorage.getItem('pin_ok_taller')==='1'){document.write('<style>#pin-screen{display:none!important}</style>');}
</script>
</head>
<body>

<!-- PIN -->
<div id="pin-screen">
  <div style="text-align:center;margin-bottom:28px">
    <div style="width:60px;height:60px;background:rgba(255,255,255,.1);border-radius:14px;display:grid;place-items:center;font-size:28px;margin:0 auto 14px">🔧</div>
    <div style="font-family:'DM Serif Display',serif;font-size:20px;color:#fff;margin-bottom:4px">Palma Grande S.A.S</div>
    <div style="font-size:12px;color:rgba(255,255,255,.45)">Panel del Mecánico</div>
  </div>
  <div style="background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);border-radius:16px;padding:22px;width:100%;max-width:290px">
    <div style="font-size:10px;font-weight:700;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;text-align:center">Ingresa tu PIN</div>
    <div style="display:flex;gap:10px;justify-content:center;margin-bottom:18px" id="pin-dots">
      <div style="width:13px;height:13px;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:transparent" id="dot-0"></div>
      <div style="width:13px;height:13px;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:transparent" id="dot-1"></div>
      <div style="width:13px;height:13px;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:transparent" id="dot-2"></div>
      <div style="width:13px;height:13px;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:transparent" id="dot-3"></div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:9px">
      <button onclick="pinInput('1')" class="pin-key">1</button><button onclick="pinInput('2')" class="pin-key">2</button><button onclick="pinInput('3')" class="pin-key">3</button>
      <button onclick="pinInput('4')" class="pin-key">4</button><button onclick="pinInput('5')" class="pin-key">5</button><button onclick="pinInput('6')" class="pin-key">6</button>
      <button onclick="pinInput('7')" class="pin-key">7</button><button onclick="pinInput('8')" class="pin-key">8</button><button onclick="pinInput('9')" class="pin-key">9</button>
      <div></div><button onclick="pinInput('0')" class="pin-key">0</button><button onclick="pinDelete()" class="pin-key" style="font-size:14px">⌫</button>
    </div>
    <div style="font-size:11px;color:rgba(255,255,255,.3);text-align:center;margin-top:14px" id="pin-error"></div>
    <button onclick="history.back()" style="width:100%;margin-top:12px;padding:11px;border-radius:9px;border:1px solid rgba(255,255,255,.13);background:transparent;color:rgba(255,255,255,.45);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer">← Volver</button>
  </div>
</div>
<script>
var pinVal='';var correctPin='2026';
function pinInput(n){if(pinVal.length>=4)return;pinVal+=n;updateDots();if(pinVal.length===4)checkPin();}
function pinDelete(){pinVal=pinVal.slice(0,-1);updateDots();document.getElementById('pin-error').textContent='';}
function updateDots(){for(var i=0;i<4;i++){var d=document.getElementById('dot-'+i);d.style.background=i<pinVal.length?'#fff':'transparent';d.style.borderColor=i<pinVal.length?'#fff':'rgba(255,255,255,.25)';}}
function checkPin(){if(pinVal===correctPin){localStorage.setItem('pin_ok_taller','1');document.getElementById('pin-screen').style.display='none';}else{pinVal='';updateDots();var e=document.getElementById('pin-error');e.textContent='PIN incorrecto';e.style.color='#fca5a5';var box=document.querySelector('#pin-screen [style*="grid-template-columns"]');if(box){box.style.animation='none';setTimeout(()=>{box.style.animation='shake .35s ease';},10);}}}
document.addEventListener('DOMContentLoaded',function(){if(localStorage.getItem('pin_ok_taller')==='1'){var el=document.getElementById('pin-screen');if(el)el.style.display='none';}});
</script>

<!-- APP -->
<div class="top-bar"></div>
<header>
  <div class="hdr-row">
    <div class="hdr-left">
      <div class="logo">🔧</div>
      <div>
        <div class="hdr-title">Panel del Mecánico</div>
        <div class="hdr-sub">Palma Grande S.A.S</div>
      </div>
    </div>
    <div class="hdr-badge" id="hdr-date">—</div>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="showTab('hoy',this)">📋 Hoy</button>
    <button class="tab" onclick="showTab('flota',this)" id="tab-flota">🚜 Flota</button>
  </div>
</header>

<main>
  <div class="sec active" id="sec-hoy">
    <div id="hoy-list"><div class="loading"><div class="spinner"></div><div>Cargando preoperativos...</div></div></div>
  </div>
  <div class="sec" id="sec-flota">
    <div id="varados-banner"></div>
    <div id="flota-list"></div>
  </div>
</main>

<!-- MODAL HISTORIAL -->
<div class="modal-overlay" id="modal-hist" onclick="cerrarModal(event)">
  <div class="modal-sheet">
    <span class="modal-pill"></span>
    <div class="modal-hdr">
      <div class="modal-titulo" id="modal-titulo">—</div>
      <button class="modal-close" onclick="cerrarModal(null,true)">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<div id="toast"></div>

<script>
// ═══════════════════════════════════════════════
//  CONSTANTES
// ═══════════════════════════════════════════════
const GS_URL='https://script.google.com/macros/s/AKfycbwvDU84orwDkO_iBIBdmaq2CSQWYdp4sH9O14k7u6RpeuGeB3Ay3Nqj3HdFZ_4UobNC/exec';
const HOY=new Date().toLocaleDateString('es-CO');
let MECANICO=localStorage.getItem('palma_mecanico')||'Tulio';

const TRACTORES=[
  {num:'01',nombre:'KUBOTA B2441'},{num:'02',nombre:'KUBOTA B2441'},
  {num:'03',nombre:'KUBOTA M9540'},{num:'04',nombre:'KUBOTA M9540'},
  {num:'05',nombre:'JOHN DEERE 2850'},{num:'06',nombre:'KUBOTA 5100'},
  {num:'07',nombre:'KUBOTA M108S'},{num:'08',nombre:'LOVOL TH754-H'},

let PREOPS=[], REVISIONES=[], ALTAS=[], VARADOS={};
let decTemp={};

// ═══════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════
function extraerNumT(s){
  const m=String(s||'').match(/#\s*0*(\d+)/);
  return m?String(parseInt(m[1])).padStart(2,'0'):null;
}

function parseFechaGS(v){
  if(!v)return null;
  if(typeof v==='number')return new Date(Math.round((v-25569)*86400*1000));
  if(typeof v==='object'&&v.getTime)return v;
  const s=String(v).trim();
  if(s.includes('T')||s.match(/^\d{4}-\d{2}-\d{2}/))return new Date(s);
  const m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m){const a=parseInt(m[1]);if(a>12)return new Date(m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'));return new Date(m[3]+'-'+m[1].padStart(2,'0')+'-'+m[2].padStart(2,'0'));}
  return null;
}

function matchHoy(f){
  let d=String(f||'');
  if(d.includes('T')||d.match(/^\d{4}-/)){const o=new Date(d);if(!isNaN(o))d=o.toLocaleDateString('es-CO');}
  return d===HOY;
}

function parseNivel(v){
  if(v===null||v===undefined||v==='')return 50;
  const s=String(v);
  if(s.includes('.')&&!s.includes('%')){const f=parseFloat(s);if(f>0&&f<=1)return Math.round(f*100);}
  if(s.includes('%'))return parseInt(s)||50;
  const n=parseInt(s);return isNaN(n)?50:n;
}

function sid(s){return(s||'').replace(/[^a-z0-9]/gi,'_');}

function toast(msg,type=''){const t=document.getElementById('toast');t.textContent=msg;t.className='show'+(type?' '+type:'');setTimeout(()=>t.className='',3000);}

// ═══════════════════════════════════════════════
//  FETCH
// ═══════════════════════════════════════════════
async function fetchTodo(hoja){
  try{const r=await fetch(GS_URL+'?hoja='+hoja+'&t='+Date.now());const d=await r.json();return(d.ok&&d.datos)||[];}catch(e){return[];}
}
async function fetchHoy(hoja){
  try{const r=await fetch(GS_URL+'?hoja='+hoja+'&t='+Date.now());const d=await r.json();if(!d.ok)return[];return d.datos.filter(f=>matchHoy(f[0]));}catch(e){return[];}
}

// ═══════════════════════════════════════════════
//  CALCULAR VARADOS — función única y definitiva
//  Último CierreJornada varado/novedad por tractor
//  sin Alta posterior con fecha >= fecha varado
// ═══════════════════════════════════════════════
function calcularVarados(cierresAll, altasAll){
  const porNum={};
  cierresAll.forEach(function(row){
    const num=extraerNumT(row[3]);
    if(!num)return;
    const est=String(row[7]||'').toLowerCase().trim();
    if(est!=='varado'&&est!=='novedad')return;
    const fB=parseFechaGS(row[0]);
    if(!fB||isNaN(fB))return;
    const fA=porNum[num]?parseFechaGS(porNum[num][0]):null;
    if(!fA||isNaN(fA)||fB>=fA)porNum[num]=row;
  });
  const varados={};
  Object.keys(porNum).forEach(function(num){
    const fC=parseFechaGS(porNum[num][0]);
    if(!fC||isNaN(fC)){varados[num]=porNum[num];return;}
    const altasNum=altasAll.filter(a=>extraerNumT(a[2])===num);
    const ultimaAlta=altasNum.length?altasNum[altasNum.length-1]:null;
    const fA=ultimaAlta?parseFechaGS(ultimaAlta[0]):null;
    if(!fA||isNaN(fA)||fC>fA)varados[num]=porNum[num];
  });
  return varados;
}

async function cargar(){
  document.getElementById('hoy-list').innerHTML='<div class="loading"><div class="spinner"></div><div>Cargando...</div></div>';

  // Preservar texto en edición
  const guardado={};
  document.querySelectorAll('textarea,input[type=text],input[type=time]').forEach(el=>{if(el.id&&el.value&&el.value.trim())guardado[el.id]=el.value;});
  const decGuardado={...decTemp};

  const [cierresAll, altasAll, preopsHoy, revisHoy] = await Promise.all([
    fetchTodo('CierreJornada'),
    fetchTodo('Altas'),
    fetchHoy('Preoperativos'),
    fetchHoy('Revisiones'),
  ]);

  VARADOS=calcularVarados(cierresAll, altasAll);

  const altasHoy=altasAll.filter(r=>matchHoy(r[0]));

  // Deduplicar por equipo (último registro)
  const vP={};PREOPS=[...preopsHoy].reverse().filter(r=>{const k=(r[3]||'').trim();if(vP[k])return false;vP[k]=true;return true;}).reverse();
  const vR={};REVISIONES=[...revisHoy].reverse().filter(r=>{const k=(r[2]||'').trim();if(vR[k])return false;vR[k]=true;return true;}).reverse();
  const vA={};ALTAS=[...altasHoy].reverse().filter(r=>{const k=(r[2]||'').trim();if(vA[k])return false;vA[k]=true;return true;}).reverse();

  renderHoy();
  renderFlota();

  setTimeout(()=>{
    Object.entries(guardado).forEach(([id,val])=>{const el=document.getElementById(id);if(el&&!el.value.trim())el.value=val;});
    Object.entries(decGuardado).forEach(([equipo,dec])=>{decTemp[equipo]=dec;aplicarDecision(equipo,dec);});
  },150);
}

async function abrirHistorial(num){
  const t=TRACTORES.find(x=>x.num===num)||{nombre:'—'};
  document.getElementById('modal-titulo').textContent='#'+num+' '+t.nombre;
  document.getElementById('modal-body').innerHTML='<div class="loading"><div class="spinner"></div><div>Cargando historial...</div></div>';
  document.getElementById('modal-hist').classList.add('open');
  document.body.style.overflow='hidden';

  try{
    const [cierresAll,altasAll,preopsAll]=await Promise.all([
      fetchTodo('CierreJornada'),fetchTodo('Altas'),fetchTodo('Preoperativos'),
    ]);
    const eq='#'+num;
    const misPreops=preopsAll.filter(r=>(r[3]||'').includes(eq)).reverse();
    const misAltas=altasAll.filter(r=>(r[2]||'').includes(eq));
    const misCierres=cierresAll.filter(r=>(r[3]||'').includes(eq)).reverse();
    const misRevs=REVISIONES.filter(r=>(r[2]||'').includes(eq));

    // Varado activo en este tractor
    const ultimoCierre=misCierres[0];
    const ultimaAlta=misAltas.length?misAltas[misAltas.length-1]:null;
    let varadoActivo=false;
    if(ultimoCierre){
      const est=String(ultimoCierre[7]||'').toLowerCase().trim();
      if(est==='varado'||est==='novedad'){
        const fC=parseFechaGS(ultimoCierre[0]);
        const fA=ultimaAlta?parseFechaGS(ultimaAlta[0]):null;
        if(!fA||isNaN(fA)||!fC||isNaN(fC)||fC>fA)varadoActivo=true;
      }
    }

    let html='';

    if(varadoActivo){
      html+=`
        <div class="alta-hist-form">
          <div class="alta-hist-lbl">🔴 VARADO — ${ultimoCierre[8]||'Sin descripción'}<br>
            <span style="font-size:11px;font-weight:400;opacity:.8">Reportado: ${ultimoCierre[2]||'—'} · ${ultimoCierre[0]||'—'}</span>
          </div>
          <div style="display:flex;flex-direction:column;gap:7px">
            <textarea id="hst-notas-${num}" rows="2" placeholder="Describe el trabajo realizado..." style="width:100%;border:1.5px solid #fca5a5;border-radius:8px;padding:9px 11px;font-family:'DM Sans',sans-serif;font-size:13px;resize:none;outline:none"></textarea>
            <input type="text" id="hst-hora-${num}" placeholder="Hora alta ej: 10:30 a.m." style="border:1.5px solid #fca5a5;border-radius:8px;padding:9px 11px;font-family:'DM Sans',sans-serif;font-size:13px;width:100%;outline:none">
            <button onclick="darAltaHistorial('${num}','${eq} ${t.nombre}','${encodeURIComponent(ultimoCierre[2]||'')}')" style="background:var(--verde);color:#fff;border:none;border-radius:10px;padding:12px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;cursor:pointer">✅ Confirmar alta — Equipo listo para operar</button>
          </div>
        </div>`;
    }

    const eventos=[];
    misPreops.forEach(r=>eventos.push({tipo:'preop',fecha:r[0],data:r}));
    misCierres.forEach(r=>eventos.push({tipo:'cierre',fecha:r[0],data:r}));
    misAltas.forEach(r=>eventos.push({tipo:'alta',fecha:r[0],data:r}));
    eventos.sort((a,b)=>(parseFechaGS(b.fecha)||0)-(parseFechaGS(a.fecha)||0));

    if(!eventos.length){
      html+='<div class="empty"><div class="empty-icon">📋</div><div class="empty-title">Sin historial registrado</div></div>';
    } else {
      html+=eventos.map(ev=>{
        if(ev.tipo==='preop'){
          const r=ev.data;const rev=misRevs.find(rv=>rv[0]===r[0]);const dec=rev?.[4]||'Pendiente';
          return `<div class="hist-entry hist-preop"><div class="hist-fecha">📋 Preoperativo · ${r[0]||'—'}</div><div class="hist-txt">👤 ${r[2]||'—'} · ⏱️ ${r[1]||'—'}</div><div class="hist-sub">Decisión: ${dec}${rev&&rev[7]?' — '+rev[7]:''}</div></div>`;
        }else if(ev.tipo==='cierre'){
          const r=ev.data;const est=String(r[7]||'').toLowerCase().trim();
          const cls=est==='varado'?'varado':est==='novedad'?'novedad':est==='operativo'?'operativo':'';
          return `<div class="hist-entry hist-cierre ${cls}"><div class="hist-fecha">🌇 Cierre · ${r[0]||'—'}</div><div class="hist-txt">👤 ${r[2]||'—'} · Estado: ${r[7]||'—'}</div>${r[8]?`<div class="hist-sub">⚙️ ${r[8]}</div>`:''} ${r[4]?`<div class="hist-sub">Horómetro: ${r[4]} h</div>`:''}</div>`;
        }else{
          const r=ev.data;
          return `<div class="hist-entry hist-alta"><div class="hist-fecha">🔵 Alta · ${r[0]||'—'}</div><div class="hist-txt">🔧 ${r[8]||'—'}</div><div class="hist-sub">Por: ${r[4]||'—'} · ${r[6]||'—'}${r[7]&&r[7]!=='—'?' · '+r[7]+' min':''}</div></div>`;
        }
      }).join('');
    }

    document.getElementById('modal-body').innerHTML=html;
  }catch(e){
    document.getElementById('modal-body').innerHTML='<div class="empty"><div class="empty-icon">❌</div><div class="empty-title">Error cargando historial</div></div>';
  }
}

function cerrarModal(e,force){
  if(force||!e||e.target===document.getElementById('modal-hist')){
    document.getElementById('modal-hist').classList.remove('open');
    document.body.style.overflow='';
  }
}

// ═══════════════════════════════════════════════
//  ACCIONES
// ═══════════════════════════════════════════════
function toggleCard(id){const b=document.getElementById('pcb-'+id);if(b)b.classList.toggle('open');}

function decidir(equipo,dec){decTemp[equipo]=dec;aplicarDecision(equipo,dec);}

function aplicarDecision(equipo,dec){
  const id=sid(equipo);
  const card=document.getElementById('pc-'+id);if(!card)return;
  const btns=card.querySelectorAll('.dec-btn');
  if(btns[0])btns[0].className='dec-btn'+(dec==='sale'?' sel-sale':'');
  if(btns[1])btns[1].className='dec-btn'+(dec==='obs'?' sel-obs':'');
  if(btns[2])btns[2].className='dec-btn'+(dec==='nosale'?' sel-nosale':'');
  const altaSec=document.getElementById('alta-sec-'+id);
  if(altaSec)altaSec.style.display=dec==='nosale'?'block':'none';
}

async function confirmar(equipo,operario,fecha,hora){
  const dec=decTemp[equipo];
  if(!dec){toast('⚠️ Elige SALE o NO SALE primero','error');return;}
  const id=sid(equipo);
  const notas=document.getElementById('notes-'+id)?.value||'';
  const horaConf=new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});
  const decision=dec==='sale'?'AUTORIZADO':dec==='obs'?'CON OBSERVACIÓN':'RETENIDO';
  try{
    await fetch(GS_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({
      hoja:'Revisiones',
      fila:[fecha,hora,equipo,operario,decision,MECANICO,horaConf,notas],
      encabezados:['Fecha','Hora Preop','Equipo','Operario','Decisión','Mecánico','Hora Revisión','Observaciones'],
      colorCol:5,color:dec==='sale'?'#dcfce7':dec==='obs'?'#fef3c7':'#fee2e2'
    })});
    toast(dec==='sale'?`✅ ${equipo} autorizado`:dec==='obs'?`⚠️ ${equipo} con observación`:`🚫 ${equipo} retenido`);
    setTimeout(()=>cargar(),1500);
  }catch(e){toast('Error guardando','error');}
}

async function darAlta(equipo,operario,fecha){
  const id=sid(equipo);
  const trabajo=document.getElementById('alta-notas-'+id)?.value?.trim()||'';
  if(!trabajo){toast('⚠️ Describe el trabajo realizado','error');return;}
  const horaAlta=document.getElementById('alta-hora-'+id)?.value||new Date().toTimeString().slice(0,5);
  const rev=REVISIONES.find(r=>(r[2]||'').trim()===equipo.trim());
  const horaRet=rev?.[6]||'—';
  let minutos='—';
  try{const[hR,mR]=(horaRet||'').split(':').map(Number);const[hA,mA]=horaAlta.split(':').map(Number);if(!isNaN(hR)&&!isNaN(hA)){minutos=Math.max(0,(hA*60+mA)-(hR*60+mR));if(minutos<0)minutos+=1440;}}catch(e){}
  const hoy=new Date();
  try{
    await fetch(GS_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({hoja:'Altas',fila:[fecha,hoy.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'}),equipo,operario,MECANICO,horaRet,horaAlta,minutos,trabajo],encabezados:['Fecha','Hora Preop','Equipo','Operario','Mecánico','Hora Retención','Hora Alta','Minutos Resolución','Trabajo Realizado'],colorCol:9,color:'#dbeafe'})});
    await fetch(GS_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({hoja:'CierreJornada',fila:[hoy.toLocaleDateString('es-CO'),hoy.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'}),operario,equipo,'','','','operativo','Alta mecánica: '+trabajo,''],encabezados:['Fecha','Hora','Operario','Equipo','Horómetro Final','Horómetro Inicial','Horas Trabajadas','Estado','Novedad','Labor Realizada']})});
    toast(`✅ ${equipo} dado de alta`);
    setTimeout(()=>cargar(),1500);
  }catch(e){toast('Error guardando','error');}
}

async function darAltaHistorial(num,eq,operarioEnc){
  const operario=decodeURIComponent(operarioEnc);
  const trabajo=document.getElementById('hst-notas-'+num)?.value?.trim()||'';
  if(!trabajo){toast('⚠️ Describe el trabajo realizado','error');return;}
  const horaAlta=document.getElementById('hst-hora-'+num)?.value||new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});
  const hoy=new Date();
  try{
    await fetch(GS_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({hoja:'Altas',fila:[hoy.toLocaleDateString('es-CO'),'—',eq,operario,MECANICO,'—',horaAlta,'—',trabajo],encabezados:['Fecha','Hora Preop','Equipo','Operario','Mecánico','Hora Retención','Hora Alta','Minutos','Trabajo Realizado'],colorCol:9,color:'#dbeafe'})});
    await fetch(GS_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({hoja:'CierreJornada',fila:[hoy.toLocaleDateString('es-CO'),hoy.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'}),operario,eq,'','','','operativo','Alta mecánica: '+trabajo,''],encabezados:['Fecha','Hora','Operario','Equipo','Horómetro Final','Horómetro Inicial','Horas Trabajadas','Estado','Novedad','Labor Realizada']})});
    toast(`✅ ${eq} dado de alta`);
    cerrarModal(null,true);
    setTimeout(()=>cargar(),1500);
  }catch(e){toast('Error guardando','error');}
}

function toggleTag(el,taId,grpId){
  el.classList.toggle('sel');
  const tags=[...document.querySelectorAll('#'+grpId+' .sel')].map(t=>t.textContent.trim()).join(' · ');
  const ta=document.getElementById(taId);if(ta)ta.value=tags;
}

// ═══════════════════════════════════════════════
//  NAV + INIT
// ═══════════════════════════════════════════════
function showTab(name,btn){
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  document.getElementById('sec-'+name).classList.add('active');
  btn.classList.add('active');
}

function init(){
  document.getElementById('hdr-date').textContent=
    new Date().toLocaleDateString('es-CO',{weekday:'short',day:'numeric',month:'short'}).replace('.','');
  cargar();
  setInterval(()=>{
    const hayFoco=document.activeElement&&(document.activeElement.tagName==='TEXTAREA'||document.activeElement.tagName==='INPUT');
    const hayContenido=[...document.querySelectorAll('textarea,input[type=text]')].some(el=>el.value.trim().length>0);
    if(!hayFoco&&!hayContenido)cargar();
  },90000);
}

init();
</script>
