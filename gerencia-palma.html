<style>
  :root{
    --paper:#EEF0EF; --card:#fff; --ink:#15201C; --soft:#4B5A54; --steel:#7E8C86; --line:#D4DAD7;
    --green:#1F5D3C; --green-s:#E3EDE7; --amber:#B0600D; --amber-s:#FBEEDC;
    --red:#9E2B21; --red-s:#F9E3E1; --blue:#2A4C6B; --blue-s:#E7EDF3;
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{background:var(--paper);color:var(--ink);font-family:'Barlow',system-ui,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace}
  button{font-family:inherit}
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px 60px}

  header.top{background:var(--ink);color:#EDF0EE;padding:12px 20px;border-bottom:3px solid var(--green)}
  header.top .cont{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px}
  header.top .volver{color:#9CB3A7;font-size:24px;line-height:1;text-decoration:none;padding:2px 4px 4px 0}
  header.top .marca{font-size:11px;letter-spacing:.14em;color:#8FA79A;font-weight:600;text-transform:uppercase}
  header.top h1{font-size:19px;margin:0;font-weight:700;line-height:1.15}

  .barra{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:18px 0 4px}
  .barra h2{font-size:21px;margin:0;font-weight:700}
  .barra .der{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  select,.btn{font:inherit;padding:8px 13px;border-radius:3px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}
  .btn.p{background:var(--green);color:#fff;border-color:var(--green);font-weight:600}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:10px;margin:14px 0 6px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:13px 15px;border-left:3px solid var(--steel)}
  .kpi .n{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:700;line-height:1.1}
  .kpi .t{font-size:13px;color:var(--soft)}
  .kpi .x{font-size:12px;color:var(--steel);margin-top:3px}
  .kpi.ok{border-left-color:var(--green)} .kpi.ok .n{color:var(--green)}
  .kpi.al{border-left-color:var(--amber)} .kpi.al .n{color:var(--amber)}
  .kpi.ma{border-left-color:var(--red)} .kpi.ma .n{color:var(--red)}

  .aviso{background:var(--amber-s);border-left:3px solid var(--amber);color:#7A430A;padding:11px 14px;border-radius:2px;font-size:14px;margin:12px 0}
  .err{background:var(--red-s);border-left:3px solid var(--red);color:#7A211A;padding:11px 14px;border-radius:2px;margin:12px 0;font-size:14px}
  .aviso strong,.err strong{font-weight:700}

  h3.sec{font-size:15px;margin:26px 0 3px;font-weight:600}
  p.hint{margin:0 0 11px;color:var(--steel);font-size:13px;max-width:78ch}

  .tabla{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:3px;overflow:hidden}
  th{font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;text-align:left;color:var(--soft);font-weight:600;padding:9px 10px;background:#E8EBEA;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:8px 10px;border-bottom:1px solid #EDEFEE;font-size:14px}
  tr:last-child td{border-bottom:none}
  td.num,th.num{text-align:right;white-space:nowrap}
  tfoot td{background:#E8EBEA;font-weight:700;border-top:1px solid var(--line)}
  .eqn{font-weight:700}
  .mod{color:var(--steel);font-size:13px}
  .pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
  .pill.ok{background:var(--green-s);color:var(--green)}
  .pill.al{background:var(--amber-s);color:var(--amber)}
  .pill.ma{background:var(--red-s);color:var(--red)}
  .pill.na{background:#E8EBEA;color:var(--steel)}

  .bar{height:16px;background:#E8EBEA;border-radius:2px;overflow:hidden;min-width:70px;position:relative}
  .bar i{display:block;height:100%;background:var(--green)}
  .bar i.al{background:var(--amber)} .bar i.ma{background:var(--red)} .bar i.az{background:var(--blue)}
  .meta{position:absolute;top:0;bottom:0;width:2px;background:#15201C;opacity:.45}

  .dos{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:860px){ .dos{grid-template-columns:1fr} }
  .graf{background:#fff;border:1px solid var(--line);border-radius:3px;padding:16px 18px}
  .gr{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .gr .lb{width:150px;flex:none;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gr .vl{width:70px;flex:none;text-align:right;font-size:13px}

  .critico{background:#fff;border:1px solid var(--line);border-left:3px solid var(--red);border-radius:3px;padding:14px 16px;margin-bottom:8px}
  .critico b{display:block;font-size:15px}

  .nota{background:#fff;border:1px dashed var(--line);border-radius:3px;padding:14px 16px;font-size:13px;color:var(--soft);margin-top:18px}
  .nota b{color:var(--ink)}
  .nota ul{margin:7px 0 0;padding-left:18px} .nota li{margin-bottom:4px}
  .cargando{padding:40px 0;color:var(--steel);text-align:center}
  .vacio{background:#fff;border:1px dashed var(--line);border-radius:3px;padding:18px;color:var(--steel);text-align:center;font-size:14px}
  @media(max-width:620px){
    .wrap{padding:0 14px 50px} .gr .lb{width:96px} th,td{font-size:13px}
    .barra .der{margin-left:0;width:100%} .barra .der select{flex:1}
    header.top .act{display:none}
  }

  #pin{position:fixed;inset:0;background:var(--ink);z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;color:#EDF0EE}
  #pin[hidden]{display:none}

  #pin .puntos{display:flex;gap:12px;justify-content:center;margin-bottom:22px}
  #pin .puntos i{width:14px;height:14px;border-radius:50%;border:2px solid #4A5B53}
  #pin .puntos i.lleno{background:#EDF0EE;border-color:#EDF0EE}
  #pin .teclas{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:280px}
  #pin .teclas button{background:#2A3A33;border:none;border-radius:4px;padding:16px;font-size:21px;font-weight:600;color:#EDF0EE;cursor:pointer}
  #pin .error{min-height:20px;margin-top:14px;font-size:14px;color:#F1A39B}
  #pin a{margin-top:18px;color:#9CB3A7;font-size:14px}

  #print{display:none}

    header.top,.barra .der,#app,#pin{display:none !important}
    .barra{padding:0}
    #print{display:block}
    body{background:#fff}
    @page{margin:12mm}
    #print h1{font-size:19px;margin:0}
    #print .sub{font-size:11px;color:#555;margin-bottom:12px}
    #print table{width:100%;border-collapse:collapse;font-size:10.5px;border:1px solid #999;margin-bottom:10px}
    #print th{background:#EEE;padding:4px 6px;border-bottom:1px solid #999;text-align:left;font-size:9.5px;text-transform:uppercase}
    #print td{padding:3px 6px;border-bottom:1px solid #DDD}
    #print tr{page-break-inside:avoid}
    #print h2{font-size:12px;margin:12px 0 4px;border-bottom:1px solid #CCC;padding-bottom:3px}
    #print .kpi-p{display:flex;gap:14px;margin-bottom:12px;flex-wrap:wrap}
    #print .kpi-p div{border:1px solid #BBB;padding:6px 10px;min-width:118px}
    #print .kpi-p b{display:block;font-size:17px}
    #print .kpi-p span{font-size:9.5px;color:#555}
    #print .firma{margin-top:28px;display:flex;gap:40px;font-size:10px}
    #print .firma div{flex:1;border-top:1px solid #333;padding-top:4px}
    #print .pie{margin-top:14px;font-size:9px;color:#666;border-top:1px solid #CCC;padding-top:5px}
    .barra h2{display:none}
  }
</style>

<div class="wrap">
  <div class="barra">
    <h2>Disponibilidad y fallas</h2>
    <div class="der">
      <select id="mes" aria-label="Mes"></select>

<script src="maestros.js"></script>
<script>
/* =====================================================================
   GERENCIA — Disponibilidad y fallas de maquinaria
   La única fuente es la hoja "Taller", que llena Tulio desde el Taller:
   cada evento (PARADA y luego ALTA, con el mismo ID) dice desde cuándo
   estuvo parada la máquina, hasta cuándo, si fue falla o mantenimiento
   y de qué sistema. Todo se calcula aquí; el Apps Script no cambia.
   ===================================================================== */

var GS_URL = 'https://script.google.com/macros/s/AKfycbwvDU84orwDkO_iBIBdmaq2CSQWYdp4sH9O14k7u6RpeuGeB3Ay3Nqj3HdFZ_4UobNC/exec';
var PIN = '2105';
var META = 90;

var GRUPOS = [
  { id:'sanidad',    txt:'Grupo sanidad' },
  { id:'campo',      txt:'Grupo cosecha, fertilización y mantenimiento' },
  { id:'transporte', txt:'Transporte' }
];
/* La misma flota del Taller y Programación (hoja Maestros, ver maestros.js).
   Las dadas de baja entran solo en los meses en que tuvieron paradas. */
var FLOTA = Maestros.flotaTodas();
var SISTEMAS = {motor:'Motor', hidraulico:'Hidráulico', electrico:'Eléctrico', transmision:'Transmisión',
  frenos:'Frenos', llantas:'Llantas', implemento:'Implemento', otro:'Otro'};

var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto',
             'septiembre','octubre','noviembre','diciembre'];
var EVENTOS = null, D = null;

/* ---------- utilidades ---------- */
function $(s){ return document.querySelector(s); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function p2(n){ return ('0'+n).slice(-2); }
function isoLocal(d){ return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()); }
function hoy(){ return isoLocal(new Date()); }
function sumarDias(iso, n){ var d = new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n); return isoLocal(d); }
function diasEntre(a, b){
  return Math.max(0, Math.round((new Date(b+'T12:00:00') - new Date(a+'T12:00:00')) / 86400000)); }
function n1(v){ return (v==null||v==='') ? '—' : String(Math.round(v*10)/10).replace('.',','); }
function pct(v){ return v==null ? '—' : String(Math.round(v*10)/10).replace('.',',')+'%'; }
function dcorta(iso){ if(!iso) return '—'; var p = String(iso).split('-'); return p.length===3 ? p[2]+'/'+p[1] : iso; }
function clase(v){ if(v==null) return 'na'; if(v >= META) return 'ok'; if(v >= META-5) return 'al'; return 'ma'; }
function eqDe(cod){ return FLOTA.filter(function(f){ return f.cod === cod; })[0] || null; }
function esCamion(cod){ var e = eqDe(cod); return !!e && e.grupo === 'transporte'; }
/* días que estuvo parada: hasta el alta sin incluirla; sin alta, hoy también cuenta */
function duracion(e){ return diasEntre(e.inicio, e.fin || sumarDias(hoy(), 1)); }
function txtSistema(id){ return SISTEMAS[id] || 'Sin clasificar'; }
/* la hoja puede devolver la fecha como texto d/m/aaaa, aaaa-mm-dd o fecha ISO */
function aIso(v){
  var s = String(v==null?'':v).trim(); if (!s) return '';
  var m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); if (m) return m[3]+'-'+p2(m[2])+'-'+p2(m[1]);
  if (s.indexOf('T') > 0){ var d = new Date(s); if (!isNaN(d)) return isoLocal(d); }
  return s.slice(0,10);
}
function idSistema(v){
  if (SISTEMAS[v]) return v;
  for (var k in SISTEMAS) if (SISTEMAS[k] === v) return k;
  return v ? 'otro' : null;
}

/* ---------- datos: hoja Taller ---------- */
/* Igual que el Taller: se juntan las filas por ID; la última fila PARADA
   manda en la fecha de parada y la fila ALTA cierra el evento. */
function eventosDe(filas){
  var ev = {}, orden = [];
  filas.forEach(function(r){
    var acc = String(r[2]||'').trim().toUpperCase(), id = String(r[3]||'').trim();
    if (!id || (acc !== 'PARADA' && acc !== 'ALTA')) return;
    var e = ev[id];
    if (!e){ e = ev[id] = { id:id, equipo:String(r[4]||'').trim(), tipo:'falla', sistema:null, novedad:'',
      reportadoPor:'', inicio:aIso(r[10] || r[0]), fin:null, altaPor:'', trabajo:'' }; orden.push(id); }
    if (r[6]) e.tipo = String(r[6]).trim() === 'mantenimiento' ? 'mantenimiento' : 'falla';
    if (r[8]) e.novedad = String(r[8]);
    if (r[9]) e.reportadoPor = String(r[9]);
    if (r[10]) e.inicio = aIso(r[10]);
    if (acc === 'ALTA'){
      e.sistema = idSistema(String(r[7]||'').trim()); e.trabajo = String(r[11]||''); e.altaPor = String(r[12]||'');
      var d = parseInt(r[13], 10);
      e.fin = isNaN(d) ? aIso(r[0]) : sumarDias(e.inicio, d);
    }
  });
  return orden.map(function(id){ return ev[id]; }).filter(function(e){ return /^\d{4}-\d{2}-\d{2}$/.test(e.inicio); });
}

async function traer(){
  var r = await fetch(GS_URL + '?hoja=Taller&t=' + Date.now());
  var d = await r.json();
  if (!d || !d.ok) throw new Error((d && d.error) || 'respuesta inválida');
  return eventosDe(d.datos || []);
}

/* ---------- cálculo del mes ---------- */
/* Días programados: lunes a sábado. Un día se pierde si la máquina estaba
   parada ese día: desde la fecha de parada (incluida) hasta el alta (sin
   incluir, porque ese día ya quedó lista). Si no tiene alta, hasta hoy. */
function calcular(eventos, anio, mes){
  var desde = anio+'-'+p2(mes)+'-01';
  var hasta = isoLocal(new Date(anio, mes, 0));
  var hy = hoy(), corte = hasta < hy ? hasta : hy;
  var prog = [];
  for (var f = desde; f <= corte; f = sumarDias(f, 1)) if (new Date(f+'T12:00:00').getDay() !== 0) prog.push(f);

  var noReconocidos = {};
  var delMes = eventos.filter(function(e){
    var fin = e.fin || sumarDias(corte, 1);
    if (!(e.inicio <= corte && fin > desde)) return false;
    // un equipo que no está en la flota se avisa, pero no entra en ningún número
    if (!eqDe(e.equipo)){ noReconocidos[e.equipo] = true; return false; }
    return true;
  }).sort(function(a,b){ return a.inicio < b.inicio ? -1 : 1; });

  var conParadas = {};
  delMes.forEach(function(e){ conParadas[e.equipo] = true; });
  var equipos = FLOTA.filter(function(q){ return q.activa !== false || conParadas[q.cod]; }).map(function(q){
    var perdido = {};   // fecha → 'falla' | 'mantenimiento' (la falla manda si se cruzan)
    var evs = delMes.filter(function(e){ return e.equipo === q.cod; });
    evs.forEach(function(e){
      var fin = e.fin || sumarDias(corte, 1);
      prog.forEach(function(d){ if (d >= e.inicio && d < fin && perdido[d] !== 'falla') perdido[d] = e.tipo; });
    });
    var dFalla = 0, dMtto = 0;
    Object.keys(perdido).forEach(function(d){ if (perdido[d] === 'falla') dFalla++; else dMtto++; });
    var fallasMes = evs.filter(function(e){ return e.tipo === 'falla' && e.inicio >= desde; });
    var durs = fallasMes.map(function(e){ return duracion(e); });
    return { equipo:q.cod, nombre:q.nombre, uso:q.uso || '', grupo:q.grupo, programados:prog.length,
      diasFalla:dFalla, diasMtto:dMtto, disponibles:prog.length - dFalla - dMtto,
      fallas:fallasMes.length, mttos:evs.filter(function(e){ return e.tipo === 'mantenimiento' && e.inicio >= desde; }).length,
      diasPorFalla: durs.length ? durs.reduce(function(a,b){ return a+b; }, 0) / durs.length : null,
      disponibilidad: prog.length ? (prog.length - dFalla - dMtto) / prog.length * 100 : null };
  });

  /* La maquinaria y los camiones (grupo transporte) se calculan por separado:
     los camiones no bajan la disponibilidad de la maquinaria. */
  function totales(lista, camion){
    var T = { programados:0, disponibles:0, diasFalla:0, diasMtto:0, fallas:0, mttos:0, equipos:lista.length,
              conFallas: lista.filter(function(e){ return e.fallas; }).length };
    lista.forEach(function(e){ T.programados += e.programados; T.disponibles += e.disponibles;
      T.diasFalla += e.diasFalla; T.diasMtto += e.diasMtto; T.fallas += e.fallas; T.mttos += e.mttos; });
    T.disponibilidad = T.programados ? T.disponibles / T.programados * 100 : null;
    var dur = delMes.filter(function(e){ return e.tipo === 'falla' && e.inicio >= desde && esCamion(e.equipo) === camion; })
      .map(function(e){ return duracion(e); });
    T.diasPorFalla = dur.length ? dur.reduce(function(a,b){ return a+b; }, 0) / dur.length : null;
    return T;
  }
  var maquinaria = equipos.filter(function(e){ return e.grupo !== 'transporte'; });
  var camiones = equipos.filter(function(e){ return e.grupo === 'transporte'; });
  var T = totales(maquinaria, false), TC = totales(camiones, true);

  // Pareto: fallas de la maquinaria que empezaron en el mes, por sistema
  var pareto = {};
  delMes.forEach(function(e){
    if (e.tipo !== 'falla' || e.inicio < desde || esCamion(e.equipo)) return;
    var k = e.fin ? (e.sistema || 'otro') : 'pendiente';
    var x = pareto[k] || (pareto[k] = { id:k, txt: k === 'pendiente' ? 'Sin alta todavía' : txtSistema(k), fallas:0, dias:0 });
    x.fallas++; x.dias += duracion(e);
  });

  return { anio:anio, mes:mes, desde:desde, hasta:hasta, corte:corte, diasProgramados:prog.length,
    futuro: desde > hy, equipos:equipos, maquinaria:maquinaria, camiones:camiones, totales:T, totalesCamiones:TC, eventos:delMes,
    abiertos: eventos.filter(function(e){ return !e.fin && eqDe(e.equipo); }),
    pareto: Object.keys(pareto).map(function(k){ return pareto[k]; })
      .sort(function(a,b){ return a.id === 'pendiente' ? 1 : b.id === 'pendiente' ? -1 : b.fallas - a.fallas || b.dias - a.dias; }),
    noReconocidos: Object.keys(noReconocidos) };
}

/* ---------- pintado ---------- */
function llenarMeses(){
  var h = new Date(), html = '';
  for (var i = 0; i < 12; i++){
    var d = new Date(h.getFullYear(), h.getMonth()-i, 1);
    html += '<option value="'+d.getFullYear()+'-'+(d.getMonth()+1)+'">'+MESES[d.getMonth()]+' '+d.getFullYear()+'</option>';
  }
  $('#mes').innerHTML = html;
}

function filaEquipo(e){
  var cl = clase(e.disponibilidad);
  return '<tr>' +
    '<td><span class="eqn mono">' + esc(e.equipo) + '</span> <span class="mod">' + esc(e.nombre) +
      (e.uso ? ' · ' + esc(e.uso) : '') + '</span></td>' +
    '<td class="num mono">' + e.programados + '</td>' +
    '<td class="num mono">' + e.disponibles + '</td>' +
    '<td class="num mono">' + (e.diasFalla || '—') + '</td>' +
    '<td class="num mono">' + (e.diasMtto || '—') + '</td>' +
    '<td class="num mono">' + (e.fallas || '—') + '</td>' +
    '<td class="num mono">' + n1(e.diasPorFalla) + '</td>' +
    '<td class="num"><span class="pill ' + cl + '">' + pct(e.disponibilidad) + '</span></td>' +
    '<td><div class="bar"><i class="' + (cl==='ok'?'':cl) + '" style="width:' + Math.max(1, e.disponibilidad||0) + '%"></i>' +
      '<span class="meta" style="left:' + META + '%"></span></div></td></tr>';
}

function tablaGrupo(titulo, lista){
  if (!lista.length) return '';
  var t = { prog:0, disp:0, df:0, dm:0, fal:0 };
  lista.forEach(function(e){ t.prog += e.programados; t.disp += e.disponibles; t.df += e.diasFalla; t.dm += e.diasMtto; t.fal += e.fallas; });
  return '<h3 class="sec">' + esc(titulo) + '</h3><div class="tabla">' +
    '<table><thead><tr><th>Equipo</th><th class="num">Prog.</th><th class="num">Disp.</th>' +
    '<th class="num">Días falla</th><th class="num">Días mtto.</th><th class="num">Fallas</th>' +
    '<th class="num">Días/falla</th><th class="num">Disponibilidad</th><th style="width:140px"></th></tr></thead><tbody>' +
    lista.map(filaEquipo).join('') +
    '</tbody><tfoot><tr><td>Subtotal</td><td class="num mono">' + t.prog + '</td><td class="num mono">' + t.disp + '</td>' +
    '<td class="num mono">' + t.df + '</td><td class="num mono">' + t.dm + '</td><td class="num mono">' + t.fal + '</td><td></td>' +
    '<td class="num">' + pct(t.prog ? t.disp / t.prog * 100 : null) + '</td><td></td></tr></tfoot></table></div>';
}

function pintar(){
  if (!D) return;
  var T = D.totales, html = '';

  if (D.futuro){ $('#app').innerHTML = '<div class="vacio">Ese mes todavía no empieza.</div>'; return; }

  if (D.noReconocidos.length){
    html += '<div class="err"><strong>Equipos sin reconocer en la hoja Taller:</strong> ' +
      esc(D.noReconocidos.join(', ')) + '. Sus registros quedaron por fuera del informe.</div>';
  }

  html += '<div class="kpis">' +
    '<div class="kpi ' + clase(T.disponibilidad) + '"><div class="n">' + pct(T.disponibilidad) + '</div>' +
      '<div class="t">Disponibilidad de la maquinaria</div><div class="x">' + T.disponibles + ' de ' + T.programados +
      ' días-máquina · meta ' + META + '% · sin camiones</div></div>' +
    '<div class="kpi ' + (T.diasFalla ? 'ma' : 'ok') + '"><div class="n">' + T.diasFalla + '</div>' +
      '<div class="t">Días-máquina perdidos por falla</div><div class="x">equivale a ' +
      n1(T.diasFalla / Math.max(1, D.diasProgramados)) + ' máquinas paradas todo el mes</div></div>' +
    '<div class="kpi"><div class="n">' + T.fallas + '</div><div class="t">Fallas en el mes</div>' +
      '<div class="x">en ' + T.conFallas + ' de ' + T.equipos + ' máquinas</div></div>' +
    '<div class="kpi"><div class="n">' + n1(T.diasPorFalla) + '</div><div class="t">Días promedio de reparación</div>' +
      '<div class="x">de la parada hasta el alta</div></div>' +
    '<div class="kpi ' + (T.diasMtto ? 'al' : '') + '"><div class="n">' + T.diasMtto + '</div>' +
      '<div class="t">Días en mantenimiento programado</div><div class="x">' + T.mttos + ' entrada(s) en el mes</div></div>' +
    '</div>';

  if (D.corte < D.hasta){
    html += '<div class="aviso">Mes en curso: el cálculo va hasta hoy, ' + dcorta(D.corte) + ' (' + D.diasProgramados + ' días programados).</div>';
  }

  if (D.abiertos.length){
    html += '<div class="err"><strong>' + D.abiertos.length + (D.abiertos.length === 1 ? ' máquina parada' : ' máquinas paradas') +
      ' sin alta.</strong> Siguen sumando días perdidos hasta hoy: ' +
      D.abiertos.map(function(v){ return esc(v.equipo) + ' desde el ' + dcorta(v.inicio) + ' (' + duracion(v) + ' días)'; }).join(', ') +
      '. Si ya están reparadas, Tulio debe darles el alta en el Taller antes de enviar el informe.</div>';
  }

  GRUPOS.forEach(function(g){
    if (g.id === 'transporte') return;          // los camiones van en su propia sección
    html += tablaGrupo(g.txt, D.equipos.filter(function(e){ return e.grupo === g.id; }));
  });

  /* gráficas: disponibilidad por máquina y Pareto por sistema (sin camiones) */
  var orden = D.maquinaria.slice().sort(function(a,b){ return a.disponibilidad - b.disponibilidad; });
  html += '<div class="dos"><div><h3 class="sec">Disponibilidad por máquina</h3>' +
    '<p class="hint">De menor a mayor. La línea marca la meta del ' + META + '%.</p><div class="graf">' +
    orden.map(function(e){
      var cl = clase(e.disponibilidad);
      return '<div class="gr"><span class="lb mono">' + esc(e.equipo) + ' <span class="mod">' + esc(e.nombre) + '</span></span>' +
        '<div class="bar" style="flex:1"><i class="' + (cl==='ok'?'':cl) + '" style="width:' + Math.max(1, e.disponibilidad) + '%"></i>' +
        '<span class="meta" style="left:' + META + '%"></span></div><span class="vl mono">' + pct(e.disponibilidad) + '</span></div>';
    }).join('') + '</div></div>';

  html += '<div><h3 class="sec">Fallas por sistema</h3>' +
    '<p class="hint">Qué parte de la maquinaria se daña más. Lo clasifica Tulio al dar el alta.</p>';
  if (D.pareto.length){
    var maxF = Math.max.apply(null, D.pareto.map(function(x){ return x.fallas; }));
    html += '<div class="graf">' + D.pareto.map(function(x){
      return '<div class="gr"><span class="lb">' + esc(x.txt) + '</span>' +
        '<div class="bar" style="flex:1"><i class="' + (x.id === 'pendiente' ? 'al' : 'ma') + '" style="width:' + (x.fallas / maxF * 100) + '%"></i></div>' +
        '<span class="vl mono">' + x.fallas + (x.fallas === 1 ? ' falla' : ' fallas') + '</span></div>' +
        '<div class="mod" style="margin:-4px 0 8px 160px">' + x.dias + (x.dias === 1 ? ' día parada' : ' días parada') + '</div>';
    }).join('') + '</div>';
  } else {
    html += '<div class="vacio">Sin fallas en el mes.</div>';
  }
  html += '</div></div>';

  /* camiones: aparte, con su propia disponibilidad */
  if (D.camiones.length){
    var TC = D.totalesCamiones;
    html += '<h3 class="sec" style="margin-top:30px">Camiones</h3>' +
      '<p class="hint">Transporte de fruta y de personal. Se miden aparte y no entran en la disponibilidad de la maquinaria.</p>' +
      '<div class="kpis">' +
        '<div class="kpi ' + clase(TC.disponibilidad) + '"><div class="n">' + pct(TC.disponibilidad) + '</div>' +
          '<div class="t">Disponibilidad de los camiones</div><div class="x">' + TC.disponibles + ' de ' + TC.programados + ' días-camión</div></div>' +
        '<div class="kpi ' + (TC.diasFalla ? 'ma' : 'ok') + '"><div class="n">' + TC.diasFalla + '</div><div class="t">Días perdidos por falla</div></div>' +
        '<div class="kpi"><div class="n">' + TC.fallas + '</div><div class="t">Fallas en el mes</div></div>' +
        '<div class="kpi"><div class="n">' + n1(TC.diasPorFalla) + '</div><div class="t">Días promedio de reparación</div></div>' +
      '</div>' + tablaGrupo('Detalle por camión', D.camiones);
  }

  /* equipos que explican el mes */
  var criticos = [];
  var masDias = D.maquinaria.slice().sort(function(a,b){ return b.diasFalla - a.diasFalla; })[0];
  if (masDias && masDias.diasFalla > 0){
    criticos.push({ t: masDias.equipo + ' ' + masDias.nombre + ' — ' + masDias.diasFalla +
      (masDias.diasFalla === 1 ? ' día parado' : ' días parados') + ' en ' + masDias.fallas + (masDias.fallas === 1 ? ' falla' : ' fallas'),
      d: masDias.fallas <= 1
        ? 'Una sola falla lo dejó quieto todos esos días. El problema no es la máquina, es el tiempo de consecución del repuesto. Se atiende con stock, no con mantenimiento.'
        : 'Concentra los días perdidos del mes. Revisar si son fallas distintas o la misma sin resolver.' });
  }
  var masFallas = D.maquinaria.slice().sort(function(a,b){ return b.fallas - a.fallas; })[0];
  if (masFallas && masFallas.fallas >= 3 && masFallas.equipo !== (masDias||{}).equipo){
    criticos.push({ t: masFallas.equipo + ' ' + masFallas.nombre + ' — ' + masFallas.fallas + ' fallas en el mes',
      d: 'Vuelve rápido cada vez, pero vuelve a caer. Falla repetida: ahí sí hay algo de fondo sin resolver.' });
  }
  var top = D.pareto.filter(function(x){ return x.id !== 'pendiente'; })[0];
  if (top && T.fallas >= 3 && top.fallas / T.fallas >= 0.4){
    criticos.push({ t: top.txt + ' — ' + top.fallas + ' de ' + T.fallas + ' fallas del mes',
      d: 'Un solo sistema concentra buena parte de las fallas. Vale la pena revisar el plan de mantenimiento preventivo de esa parte.' });
  }
  if (criticos.length){
    html += '<h3 class="sec">Lo que explica el mes</h3>' +
      '<p class="hint">Dónde se concentran los días perdidos, y por qué cada caso es un problema distinto.</p>' +
      criticos.map(function(c){ return '<div class="critico"><b>' + esc(c.t) + '</b><span>' + esc(c.d) + '</span></div>'; }).join('');
  }

  /* paradas del mes */
  html += '<h3 class="sec">Paradas del mes</h3>' +
    '<p class="hint">Cada parada registrada en el Taller con lo que reportaron, de qué fue y los días que estuvo parada.</p>';
  if (D.eventos.length){
    html += '<div class="tabla"><table><thead><tr><th>Parada</th><th>Equipo</th><th>Tipo</th><th>Sistema</th>' +
      '<th>Lo que reportaron</th><th>Trabajo realizado</th><th class="num">Días</th><th>Alta</th></tr></thead><tbody>' +
      D.eventos.map(function(e){
        return '<tr><td class="mono">' + dcorta(e.inicio) + '</td><td class="mono eqn">' + esc(e.equipo) + '</td>' +
          '<td>' + (e.tipo === 'mantenimiento' ? '<span class="pill az">Mantenimiento</span>' : '<span class="pill ma">Falla</span>') + '</td>' +
          '<td>' + (e.fin ? esc(txtSistema(e.sistema)) : '<span class="mod">al dar el alta</span>') + '</td>' +
          '<td>' + (esc(e.novedad) || '<span class="mod">sin detalle</span>') + '</td>' +
          '<td>' + (esc(e.trabajo) || '<span class="mod">—</span>') + '</td>' +
          '<td class="num mono">' + duracion(e) + '</td>' +
          '<td class="mono">' + (e.fin ? dcorta(e.fin) : '<span class="pill ma">sin alta</span>') + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  } else {
    html += '<div class="vacio">No hubo paradas en el mes.</div>';
  }

  html += '<div class="nota"><b>Cómo se calcula cada número</b><ul>' +
    '<li><b>Fuente:</b> la hoja Taller, que llena Tulio Olaya en el Taller. El preoperativo no entra en este cálculo.</li>' +
    '<li><b>Días programados:</b> lunes a sábado del mes' + (D.corte < D.hasta ? ', hasta hoy' : '') + '.</li>' +
    '<li><b>Días perdidos:</b> desde la fecha en que quedó parada (incluida) hasta el día del alta (sin incluir, porque ese día ya quedó lista). Sin alta, cuentan hasta hoy.</li>' +
    '<li><b>Disponibilidad:</b> días disponibles ÷ días programados. Las paradas por mantenimiento programado también restan, pero se muestran aparte y no cuentan como falla.</li>' +
    '<li><b>Camiones:</b> se calculan aparte; los indicadores de arriba, la gráfica y las fallas por sistema son solo de la maquinaria.</li>' +
    '<li><b>Días/falla:</b> promedio de días desde la parada hasta el alta de las fallas que empezaron en el mes.</li>' +
    '</ul></div>';

  $('#app').innerHTML = html;
}

/* ---------- carga ---------- */
async function cargar(forzar){
  var mv = $('#mes').value.split('-');
  if (!EVENTOS || forzar){
    $('#app').innerHTML = '<div class="cargando">Consultando la hoja Taller…</div>';
    try { await Maestros.traer(); } catch(e){}   // si falla se usa la copia guardada
    FLOTA = Maestros.flotaTodas();
    try { EVENTOS = await traer(); }
    catch(e){
      $('#app').innerHTML = '<div class="err"><strong>No se pudo leer la hoja Taller.</strong> Revise la conexión e intente con "Actualizar". (' + esc(e.message) + ')</div>';
      return;
    }
    $('#act').textContent = 'Actualizado ' + new Date().toLocaleTimeString('es-CO', { hour:'2-digit', minute:'2-digit' });
  }
  D = calcular(EVENTOS, +mv[0], +mv[1]);
  pintar();
}

/* ---------- informe imprimible ---------- */
function informe(){
  if (!D || D.futuro) return;
  var T = D.totales;
  var eqs = D.maquinaria.slice().sort(function(a,b){ return a.disponibilidad - b.disponibilidad; });
  var TC = D.totalesCamiones;
  var h = '<h1>Informe de disponibilidad y fallas de maquinaria</h1>' +
    '<div class="sub">Palma Grande S.A.S. · ' + MESES[D.mes - 1] + ' ' + D.anio + ' · ' + D.diasProgramados +
    ' días programados' + (D.corte < D.hasta ? ' · corte al ' + dcorta(D.corte) : '') + '</div>' +
    '<div class="kpi-p">' +
      '<div><b>' + pct(T.disponibilidad) + '</b><span>Disponibilidad de la maquinaria</span></div>' +
      '<div><b>' + T.diasFalla + '</b><span>Días-máquina perdidos por falla</span></div>' +
      '<div><b>' + T.fallas + '</b><span>Fallas</span></div>' +
      '<div><b>' + n1(T.diasPorFalla) + '</b><span>Días promedio de reparación</span></div>' +
      '<div><b>' + T.diasMtto + '</b><span>Días en mantenimiento</span></div>' +
      (D.camiones.length ? '<div><b>' + pct(TC.disponibilidad) + '</b><span>Disponibilidad de los camiones (aparte)</span></div>' : '') +
    '</div>';

  h += '<h2>Disponibilidad por máquina</h2><table><thead><tr><th>Equipo</th><th>Grupo</th><th>Programados</th>' +
    '<th>Disponibles</th><th>Días falla</th><th>Días mtto.</th><th>Fallas</th><th>Disponibilidad</th></tr></thead><tbody>' +
    eqs.map(function(e){
      var g = GRUPOS.filter(function(x){ return x.id === e.grupo; })[0];
      return '<tr><td>' + esc(e.equipo) + ' ' + esc(e.nombre) + (e.uso ? ' (' + esc(e.uso) + ')' : '') + '</td>' +
        '<td>' + esc(g ? g.txt.replace('Grupo ', '') : '') + '</td><td>' + e.programados + '</td><td>' + e.disponibles + '</td>' +
        '<td>' + e.diasFalla + '</td><td>' + e.diasMtto + '</td><td>' + e.fallas + '</td><td><b>' + pct(e.disponibilidad) + '</b></td></tr>';
    }).join('') + '</tbody></table>';

  if (D.camiones.length){
    h += '<h2>Camiones (aparte de la maquinaria)</h2><table><thead><tr><th>Camión</th><th>Uso</th><th>Programados</th>' +
      '<th>Disponibles</th><th>Días falla</th><th>Días mtto.</th><th>Fallas</th><th>Disponibilidad</th></tr></thead><tbody>' +
      D.camiones.map(function(e){
        return '<tr><td>' + esc(e.equipo) + ' ' + esc(e.nombre) + '</td><td>' + esc(e.uso) + '</td><td>' + e.programados + '</td>' +
          '<td>' + e.disponibles + '</td><td>' + e.diasFalla + '</td><td>' + e.diasMtto + '</td><td>' + e.fallas + '</td>' +
          '<td><b>' + pct(e.disponibilidad) + '</b></td></tr>';
      }).join('') + '</tbody></table>';
  }

  if (D.pareto.length){
    h += '<h2>Fallas por sistema (maquinaria)</h2><table><thead><tr><th>Sistema</th><th>Fallas</th><th>Días parada</th></tr></thead><tbody>' +
      D.pareto.map(function(x){ return '<tr><td>' + esc(x.txt) + '</td><td>' + x.fallas + '</td><td>' + x.dias + '</td></tr>'; }).join('') +
      '</tbody></table>';
  }

  if (D.eventos.length){
    h += '<h2>Paradas del mes</h2><table><thead><tr><th>Fecha</th><th>Equipo</th><th>Tipo</th><th>Sistema</th>' +
      '<th>Lo que reportaron</th><th>Trabajo realizado</th><th>Días</th><th>Alta</th></tr></thead><tbody>' +
      D.eventos.map(function(e){
        return '<tr><td>' + dcorta(e.inicio) + '</td><td>' + esc(e.equipo) + '</td>' +
          '<td>' + (e.tipo === 'mantenimiento' ? 'Mantenimiento' : 'Falla') + '</td>' +
          '<td>' + (e.fin ? esc(txtSistema(e.sistema)) : '') + '</td><td>' + esc(e.novedad) + '</td><td>' + esc(e.trabajo) + '</td>' +
          '<td>' + duracion(e) + '</td><td>' + (e.fin ? dcorta(e.fin) : 'sin alta') + '</td></tr>';
      }).join('') + '</tbody></table>';
  }

  h += '<div class="firma"><div>Jefe de Taller</div><div>Superintendente Agrícola</div><div>Gerencia</div></div>' +
    '<div class="pie">Fuente: hoja Taller. Disponibilidad = días disponibles ÷ días programados (lunes a sábado); ' +
    'los camiones se miden aparte y no entran en la de la maquinaria. ' +
    'Los días perdidos van desde la fecha de parada hasta el día del alta, sin incluirlo. El mantenimiento programado ' +
    'resta disponibilidad pero no cuenta como falla. Meta de referencia: ' + META + '%. Generado el ' +
    new Date().toLocaleDateString('es-CO') + '.</div>';

  $('#print').innerHTML = h;
  setTimeout(function(){ window.print(); }, 150);
}

/* ---------- PIN ---------- */
function montarPin(){
  var val = '';
  $('#pin-teclas').innerHTML = ['1','2','3','4','5','6','7','8','9','','0','⌫'].map(function(t){
    return t ? '<button data-t="' + t + '">' + t + '</button>' : '<span></span>';
  }).join('');
  function puntos(){ Array.prototype.forEach.call($('#pin-puntos').children, function(p, i){ p.className = i < val.length ? 'lleno' : ''; }); }
  Array.prototype.forEach.call($('#pin-teclas').querySelectorAll('button'), function(b){
    b.onclick = function(){
      $('#pin-error').textContent = '';
      if (b.dataset.t === '⌫'){ val = val.slice(0, -1); puntos(); return; }
      if (val.length >= 4) return;
      val += b.dataset.t; puntos();
      if (val.length < 4) return;
      if (val === PIN){ try { localStorage.setItem('pin_ok_gerencia', '1'); } catch(e){} $('#pin').hidden = true; }
      else { val = ''; puntos(); $('#pin-error').textContent = 'PIN incorrecto. Inténtelo de nuevo.'; }
    };
  });
}

/* ---------- arranque ---------- */
if (document.documentElement.className === 'pin-ok') $('#pin').hidden = true;
montarPin();
llenarMeses();
$('#mes').onchange = function(){ cargar(false); };
$('#btn-recargar').onclick = function(){ cargar(true); };
$('#btn-informe').onclick = informe;
cargar(true);
</script>
</body>
</html>
