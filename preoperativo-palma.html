<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Preoperativo — Palma Grande</title>
<meta name="theme-color" content="#16211C">
<link rel="manifest" href="manifest-preoperativo.json">
<link rel="icon" href="icons/preoperativo-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/preoperativo-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Preoperativo">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDF0EE; --card:#fff; --ink:#16211C; --soft:#4A5B53; --steel:#7E8C86; --line:#D3DAD6;
    --green:#1F5D3C; --green-s:#E2EDE6; --amber:#B0600D; --amber-s:#FBEEDC;
    --red:#9E2B21; --red-s:#F9E3E1; --azul:#2A4C6B; --azul-s:#E7EDF3; --r:4px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:'Barlow',system-ui,sans-serif;font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace}
  button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
  :focus-visible{outline:3px solid var(--green);outline-offset:2px}

  header{background:var(--ink);color:#EDF0EE;padding:12px 16px;position:sticky;top:0;z-index:20;border-bottom:3px solid var(--green)}
  header .fila{display:flex;align-items:center;gap:12px;max-width:720px;margin:0 auto}
  header .volver{color:#9CB3A7;font-size:24px;line-height:1;text-decoration:none;padding:2px 4px 4px 0}
  header .marca{font-size:11px;letter-spacing:.14em;color:#8FA79A;font-weight:600;text-transform:uppercase;white-space:nowrap}
  header h1{font-size:19px;margin:0;font-weight:700;line-height:1.15}
  header .fecha{font-size:12px;color:#8FA79A}
  header .der{margin-left:auto;display:flex;gap:7px}
  header .der button{font-size:13px;color:#C9D8D0;background:#26352E;border:1px solid #34443C;border-radius:20px;padding:6px 12px;white-space:nowrap}
  header .der button[hidden]{display:none}
  header #btn-instalar{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
  .sync{background:var(--amber);color:#fff;font-size:13px;padding:7px 16px;text-align:center}
  .sync[hidden]{display:none}
  .lectura{background:var(--red);color:#fff;font-size:13.5px;padding:9px 16px;text-align:center;line-height:1.35}
  .lectura[hidden]{display:none}
  .lectura b{font-weight:700}
  .nollego{background:#9a3412}
  .nollego button{margin:6px 4px 0;background:#fff;color:#9a3412;border:0;border-radius:6px;padding:4px 12px;font:inherit;font-weight:700;cursor:pointer}
  .progreso{height:4px;background:#C9D2CD}
  .progreso i{display:block;height:100%;background:var(--green);transition:width .2s}
  .progreso[hidden]{display:none}

  .wrap{max-width:720px;margin:0 auto;padding:16px 16px 120px}
  .paso-n{font-size:12px;font-weight:700;color:var(--steel);text-transform:uppercase;letter-spacing:.06em;margin:0 0 2px}
  h2{font-size:22px;margin:0 0 4px;line-height:1.2}
  .ayuda{font-size:14px;color:var(--soft);margin:0 0 16px}

  /* inicio */
  .inicio{display:grid;gap:14px;margin-top:6px}
  .gran{display:flex;align-items:center;gap:16px;text-align:left;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--green);
        border-radius:var(--r);padding:20px 18px;box-shadow:0 1px 3px rgba(22,33,28,.06)}
  .gran.cierre{border-left-color:var(--azul)}
  .gran svg{width:44px;height:44px;flex:none;color:var(--green)}
  .gran.cierre svg{color:var(--azul)}
  .gran b{display:block;font-size:20px}
  .gran span{font-size:14px;color:var(--soft)}
  .gran .ok{display:inline-block;margin-top:4px;font-size:12.5px;font-weight:600;color:var(--green);background:var(--green-s);border-radius:12px;padding:1px 9px}

  /* opciones */
  .rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:16px}
  .rejilla.maq{grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}
  .op{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:16px 12px;text-align:left;font-weight:600;font-size:16px;line-height:1.25}
  .op small{display:block;font-weight:400;font-size:13px;color:var(--steel);margin-top:3px}
  .op .cod{font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:700;display:block}
  .op[aria-pressed=true]{border-color:var(--green);background:var(--green-s);color:var(--green)}
  .op[disabled]{opacity:.45}
  .op .marca-op{display:block;font-size:12px;font-weight:700;margin-top:5px}
  .op .marca-op.rojo{color:var(--red)} .op .marca-op.ambar{color:var(--amber)} .op .marca-op.verde{color:var(--green)}

  .tarj{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px}
  .tarj.prog{border-left:5px solid var(--green)}
  .tarj.aviso-t{border-left:5px solid var(--amber);background:#FFFBF4}
  .tarj.alerta{border-left:5px solid var(--red);background:#FFF9F8}
  .tarj .et{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--steel);font-weight:700;margin-bottom:4px}
  .tarj .vl{font-size:16px}
  .tarj .vl.grande{font-size:20px;font-weight:700}
  .dato{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid #EDEFEE;font-size:15px}
  .dato:last-child{border-bottom:none}
  .dato span{color:var(--steel)} .dato b{text-align:right}

  .campo{display:block;margin-bottom:16px}
  .campo span{display:block;font-size:14px;font-weight:600;color:var(--soft);margin-bottom:6px}
  .campo span i{font-weight:400;font-style:normal;color:var(--steel)}
  .campo input,.campo textarea{width:100%;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
  .campo textarea{min-height:80px;resize:vertical}
  .horometro{font-family:'JetBrains Mono',monospace;font-size:34px !important;font-weight:700;text-align:center;letter-spacing:.02em}

  /* niveles e inspección: fila con su pregunta y botones */
  .chequeo{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:9px}
  .chequeo .q{font-weight:700;font-size:16px}
  .chequeo .q small{display:block;font-weight:400;font-size:13px;color:var(--steel)}
  .chequeo .bts{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-top:10px}
  .chequeo .bts button{border:2px solid var(--line);border-radius:var(--r);padding:12px 6px;font-weight:700;font-size:15px;background:#FAFBFA}
  .chequeo .bts button[aria-pressed=true].bien{border-color:var(--green);background:var(--green-s);color:var(--green)}
  .chequeo .bts button[aria-pressed=true].medio{border-color:var(--amber);background:var(--amber-s);color:var(--amber)}
  .chequeo .bts button[aria-pressed=true].mal{border-color:var(--red);background:var(--red-s);color:var(--red)}
  .chequeo.marcado-mal{border-left:5px solid var(--red)}
  .chequeo.marcado-medio{border-left:5px solid var(--amber)}
  .chequeo.marcado-bien{border-left:5px solid var(--green)}

  .estado-op{display:grid;gap:10px;margin-bottom:16px}
  .estado-op button{border:2px solid var(--line);border-radius:var(--r);padding:16px;text-align:left;font-weight:700;font-size:17px;background:var(--card)}
  .estado-op button small{display:block;font-weight:400;font-size:13.5px;color:var(--steel)}
  .estado-op button[aria-pressed=true].bien{border-color:var(--green);background:var(--green-s);color:var(--green)}
  .estado-op button[aria-pressed=true].medio{border-color:var(--amber);background:var(--amber-s);color:var(--amber)}
  .estado-op button[aria-pressed=true].mal{border-color:var(--red);background:var(--red-s);color:var(--red)}

  .nav{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(to top,var(--paper) 74%,rgba(237,240,238,0));
       padding:14px 16px calc(14px + env(safe-area-inset-bottom));z-index:15}
  .nav[hidden]{display:none}
  .nav .fila{display:flex;gap:10px;max-width:688px;margin:0 auto}
  .nav button{padding:17px;border-radius:var(--r);font-size:17px;font-weight:700}
  .nav .atras{background:var(--card);border:1px solid var(--line);color:var(--ink);flex:0 0 32%}
  .nav .sig{background:var(--green);color:#fff;flex:1}
  .nav .sig.enviar{background:var(--azul)}
  .nav .sig[disabled]{opacity:.42}

  .fin{text-align:center;padding:30px 10px}
  .fin .icono{width:84px;height:84px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:42px;color:#fff;background:var(--green)}
  .fin .icono.medio{background:var(--amber)} .fin .icono.mal{background:var(--red)}
  .fin h2{font-size:24px}
  .fin p{color:var(--soft);font-size:16px;margin:6px 0 22px}
  .accion{display:block;width:100%;padding:17px;border-radius:var(--r);font-size:17px;font-weight:700;margin-bottom:10px;background:var(--green);color:#fff}
  .accion.gris{background:var(--card);border:1px solid var(--line);color:var(--ink)}
  .nota{font-size:13px;color:var(--steel)}
  .aviso{position:fixed;left:50%;transform:translateX(-50%);bottom:100px;background:var(--ink);color:#EDF0EE;
         padding:12px 20px;border-radius:var(--r);z-index:60;font-size:15px;max-width:90%;text-align:center}
  .aviso[hidden]{display:none}
</style>
</head>
<body>

<header><div class="fila">
  <a class="volver" href="https://rojasanderson18-ship-it.github.io/maquinaria-taller-palmag/" aria-label="Volver a la página principal">‹</a>
  <div><div class="marca">Palma Grande S.A.S.</div><h1>Preoperativo</h1><div class="fecha" id="fecha-hoy"></div></div>
  <div class="der"><button id="btn-instalar" hidden>Instalar app</button></div>
</div></header>
<div class="lectura" id="lectura" hidden></div>
<div class="sync" id="sync" hidden></div>
<div class="lectura nollego" id="nollego" hidden></div>
<div class="progreso" id="progreso" hidden><i id="barra"></i></div>

<div class="wrap" id="app"></div>
<div class="nav" id="nav" hidden><div class="fila">
  <button class="atras" id="atras">Atrás</button>
  <button class="sig" id="sig">Siguiente</button>
</div></div>
<div class="aviso" id="aviso" hidden></div>

<script src="maestros.js"></script>
<script>
/* =====================================================================
   PREOPERATIVO — Palma Grande S.A.S.
   Lo diligencia el operario: al empezar el día (preoperativo) y al terminar
   (cierre de jornada). Pasos cortos, botones grandes.
   - Tractoristas y máquinas: la lista compartida (hoja Maestros).
   - Máquinas paradas y pendientes: hoja Taller. Una máquina parada no se
     puede escoger; los pendientes se le muestran al operario.
   - Programación del día: hoja ProgMaquinaria (sugiere máquina y labor).
   - Se guarda en PreopDiario (preoperativo) y CierreJornada (cierre, mismas
     columnas de siempre). Columna 4 = máquina y operario ("#04 · Jhon
     Garnica"): el Apps Script reemplaza la fila de hoy con ese mismo valor,
     así en doble turno cada operario tiene su registro, y si el mismo
     operario lo repite, se corrige.
   - Si la máquina tiene novedad o queda varada, le llega a Tulio como
     PENDIENTE en la hoja Taller (urgente si no puede trabajar). Tulio decide.
   - El tanqueo ya no va aquí: lo registra almacén.
   ===================================================================== */

var GS_URL = 'https://script.google.com/macros/s/AKfycbwvDU84orwDkO_iBIBdmaq2CSQWYdp4sH9O14k7u6RpeuGeB3Ay3Nqj3HdFZ_4UobNC/exec';
var KEY = 'preoperativo-palma-v2', KEY_REMOTO = 'preoperativo-remoto-v1';

var ITEMS = [
  { id:'frenos',   txt:'Frenos',          sub:'Pedal y freno de mano',       sis:'frenos' },
  { id:'llantas',  txt:'Llantas',         sub:'Presión, cortes, desgaste',   sis:'llantas' },
  { id:'luces',    txt:'Luces',           sub:'Delanteras y traseras',       sis:'electrico' },
  { id:'bateria',  txt:'Batería',         sub:'Arranca bien, bornes limpios', sis:'electrico' },
  { id:'escape',   txt:'Escape',          sub:'Sin humo excesivo',           sis:'motor' },
  { id:'fugas',    txt:'Fugas',           sub:'Aceite, agua, hidráulico',    sis:'hidraulico' },
  { id:'mandos',   txt:'Mandos',          sub:'Palancas, pedales, dirección', sis:'transmision' },
  { id:'exterior', txt:'Estado exterior', sub:'Golpes, piezas sueltas',      sis:'otro' }
];
var NIVELES = [
  { id:'aceite', txt:'Aceite de motor',        sis:'motor' },
  { id:'refri',  txt:'Agua / refrigerante',    sis:'motor' },
  { id:'hidra',  txt:'Aceite hidráulico',      sis:'hidraulico' }
];
var SISTEMAS = {motor:'Motor', hidraulico:'Hidráulico', electrico:'Eléctrico', transmision:'Transmisión',
  frenos:'Frenos', llantas:'Llantas', implemento:'Implemento', otro:'Otro'};
/* las mismas labores de la Programación */
var LABORES = ['Alce de racimos con tijera','Alce de racimos con quinta rueda','Rotospeed','Rolo cuchilla',
  'Fertilización con mezcla','Fertilización en bórax','Sanidad','Transporte','Labores varias'];
var OPERARIOS_DEF = ['Jhon Garnica','Oswaldo Sanches','Cesar Verona','Julio Vacca','Fernando Leon','Sandro Bonilla','Ever Clevez'];

var ENC_PREOP = ['Fecha','Hora','Operario','Equipo','Máquina','Labor','Lotes','Horómetro Inicial',
  'Aceite Motor','Refrigerante','Aceite Hidráulico'].concat(ITEMS.map(function(i){ return i.txt; })).concat(['Estado','Observaciones']);
var ENC_CIERRE = ['Fecha','Hora','Operario','Equipo','Horómetro Final','Horómetro Inicial','Horas Trabajadas','Estado','Novedad','Labor Realizada'];
var ENC_TALLER = ['Fecha','Hora','Acción','ID','Equipo','Máquina','Tipo','Sistema','Novedad','Reportó',
                  'Fecha Parada','Trabajo','Alta por','Días Parada'];

/* estado local: cola de envíos y lo que este celular registró hoy */
var estado = { cola: [], ultimoOperario: '', hoy: { fecha: '', preop: {} }, porConfirmar: [] };
/* lo que se lee de la hoja (con copia para trabajar sin señal) */
var R = { paradas: {}, pendientes: {}, prog: {}, preopHoy: {}, ultHor: {} };

/* ---------- utilidades ---------- */
function $(s){ return document.querySelector(s); }
function $$(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function p2(n){ return ('0'+n).slice(-2); }
function isoLocal(d){ return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()); }
function hoy(){ return isoLocal(new Date()); }
function horaAhora(){ var d = new Date(); return p2(d.getHours()) + ':' + p2(d.getMinutes()); }
function fechaCO(iso){ return new Date(iso + 'T12:00:00').toLocaleDateString('es-CO'); }
function dcorta(iso){ var p = String(iso).split('-'); return p.length === 3 ? p[2] + '/' + p[1] : iso; }
function nid(){ return 'o' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function num(v){
  var t = String(v == null ? '' : v).trim();
  if (/^\d{4}-\d{2}-\d{2}T/.test(t)) return null;      // Sheets convirtió el número en fecha
  var n = parseFloat(t.replace(',', '.')); return isNaN(n) ? null : n;
}
function fmtH(n){ return n == null ? '—' : String(Math.round(n * 10) / 10).replace('.', ',') + ' h'; }
function aIso(v){
  var s = String(v==null?'':v).trim(); if (!s) return '';
  var m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); if (m) return m[3]+'-'+p2(m[2])+'-'+p2(m[1]);
  if (s.indexOf('T') > 0){ var d = new Date(s); if (!isNaN(d)) return isoLocal(d); }
  return s.slice(0,10);
}
function aviso(m){ var a = $('#aviso'); a.textContent = m; a.hidden = false; clearTimeout(a._t); a._t = setTimeout(function(){ a.hidden = true; }, 3400); }

function flota(){ return Maestros.flota(); }
function maqDe(cod){ return Maestros.flotaTodas().filter(function(f){ return f.cod === cod; })[0] || null; }
function nombreDe(cod){ var m = maqDe(cod); return m ? m.nombre : ''; }
function operarios(){
  var l = Maestros.get('OPERARIOS');
  return l ? l.filter(function(o){ return o.nombre && o.activo !== false; }).map(function(o){ return o.nombre; }) : OPERARIOS_DEF.slice();
}
/* "#05 - John Deere 2850", "05 - KUBOTA…", "FORD" → código de la flota */
function codDe(txt){
  var t = String(txt || '').trim().toUpperCase();
  var f = Maestros.flotaTodas().filter(function(x){ return t === x.cod.toUpperCase() || t.indexOf(x.cod.toUpperCase() + ' ') === 0; })[0];
  if (f) return f.cod;
  var m = t.match(/^#?\s*0*(\d{1,2})\b/); return m ? '#' + p2(+m[1]) : t;
}

/* preoperativo de hoy de esa máquina y ese operario (en doble turno hay dos) */
function preopDe(cod, operario){
  var k = cod + '|' + operario;
  return estado.hoy.preop[k] || R.preopHoy[k] || null;
}
function preopsHoy(){
  var t = {};
  [R.preopHoy, estado.hoy.preop].forEach(function(o){ Object.keys(o).forEach(function(k){ t[k] = o[k]; }); });
  return Object.keys(t).map(function(k){ return t[k]; });
}

/* ---------- almacenamiento ---------- */
function persistir(){ try { localStorage.setItem(KEY, JSON.stringify(estado)); return true; } catch(e){ return false; } }
function cargarLocal(){
  try { var g = JSON.parse(localStorage.getItem(KEY) || 'null'); if (g) estado = g; } catch(e){}
  if (!estado.cola) estado.cola = [];
  if (!estado.porConfirmar) estado.porConfirmar = [];
  if (!estado.hoy || estado.hoy.fecha !== hoy()) estado.hoy = { fecha: hoy(), preop: {} };
  try { var r = JSON.parse(localStorage.getItem(KEY_REMOTO) || 'null'); if (r) R = r; } catch(e){}
  if (R.fecha !== hoy()){ R.prog = {}; R.preopHoy = {}; R.cierreHoy = {}; }
  if (!R.cierreHoy) R.cierreHoy = {};
  // versión anterior: preopHoy por máquina sola
  Object.keys(R.preopHoy).forEach(function(k){ if (k.indexOf('|') < 0) delete R.preopHoy[k]; });
  Object.keys(estado.hoy.preop).forEach(function(k){ if (k.indexOf('|') < 0) delete estado.hoy.preop[k]; });
}
function pintarSync(){
  var s = $('#sync');
  if (estado.cola.length){ s.hidden = false; s.textContent = estado.cola.length + ' registro(s) esperando señal para enviarse. Puede seguir trabajando.'; }
  else s.hidden = true;
}

/* =====================================================================
   Lectura de las hojas
   ===================================================================== */
async function leer(hoja){
  var r = await fetch(GS_URL + '?hoja=' + encodeURIComponent(hoja) + '&t=' + Date.now());
  var d = await r.json();
  if (!d || !d.ok || !Array.isArray(d.datos)) throw new Error('sin datos');
  return d.datos;
}
/* Si no se pudo leer el Taller no se sabe qué máquinas están paradas: se avisa
   arriba y en el paso de la máquina, en vez de mostrarlas todas como disponibles. */
function pintarLectura(){
  var b = $('#lectura');
  if (R.tallerOk){ b.hidden = true; return; }
  b.hidden = false;
  b.innerHTML = R.leidoTaller
    ? '<b>Sin conexión con la hoja de cálculo.</b> Las máquinas en taller son las de la última lectura (' + dcorta(R.leidoTaller.slice(0, 10)) + ').'
    : '<b>No se pudo leer la hoja de cálculo.</b> No se sabe qué máquinas están en el taller. Revise la señal y no use ventanas privadas o de incógnito.';
}
async function traerTodo(){
  if (!navigator.onLine){ R.tallerOk = false; R.intentado = true; pintarLectura(); return; }
  var hy = hoy();
  try { await Maestros.traer(); } catch(e){}
  var res = await Promise.all([leer('Taller'), leer('ProgMaquinaria'), leer('PreopDiario'), leer('CierreJornada'),
    leer('Preoperativos'), leer('Programacion')].map(function(p){
    return p.catch(function(){ return null; }); }));
  var taller = res[0], prog = res[1], preop = res[2], cierre = res[3], preopViejo = res[4], progViejo = res[5];
  R.tallerOk = !!taller; R.intentado = true;
  if (taller){
    R.leidoTaller = new Date().toISOString();
    var ev = {}, nov = {};
    taller.forEach(function(r){
      var acc = String(r[2]||'').trim().toUpperCase(), id = String(r[3]||'').trim(), cod = String(r[4]||'').trim();
      if (!id) return;
      if (acc === 'PARADA' || acc === 'ALTA'){
        var e = ev[id] = ev[id] || { cod:cod, novedad:'', desde:'', abierta:true };
        if (r[8]) e.novedad = String(r[8]); if (r[10]) e.desde = aIso(r[10]);
        if (acc === 'ALTA') e.abierta = false;
      } else if (acc === 'PENDIENTE' || acc === 'RESUELTO'){
        var n = nov[id] = nov[id] || { cod:cod, txt:'', urgente:false, abierta:true };
        if (r[8]) n.txt = String(r[8]); if (r[6]) n.urgente = String(r[6]).trim() === 'urgente';
        if (acc === 'RESUELTO') n.abierta = false;
      }
    });
    R.paradas = {}; R.pendientes = {};
    Object.keys(ev).forEach(function(k){ var e = ev[k]; if (e.abierta) R.paradas[e.cod] = e.novedad + (e.desde ? ' (desde el ' + dcorta(e.desde) + ')' : ''); });
    Object.keys(nov).forEach(function(k){ var n = nov[k]; if (n.abierta && n.txt) (R.pendientes[n.cod] = R.pendientes[n.cod] || []).push({ id:k, txt:n.txt, urgente:n.urgente }); });
  }
  if (prog){
    // la última fila de cada fecha + máquina vale (igual que en Programación)
    var p = {};
    prog.forEach(function(r){
      if (aIso(r[4]) !== hy) return;
      var cod = String(r[5]||'').trim(), acc = String(r[2]||'').trim().toUpperCase();
      if (acc === 'QUITAR'){ delete p[cod]; return; }
      if (acc === 'ASIGNAR') p[cod] = { labor:String(r[6]||''), lotes:String(r[7]==null?'':r[7]), implemento:String(r[8]||''),
        operario:String(r[9]||''), operario2:String(r[12]||''), obs:String(r[10]||''), programo:String(r[11]||'') };
    });
    R.prog = p;
  }
  // la hoja Programacion de siempre: por si la programaron con la versión anterior
  if (progViejo){
    if (!prog) R.prog = {};
    progViejo.forEach(function(r){
      var cod = codDe(r[2]);
      if (aIso(r[0]) !== hy || !maqDe(cod) || R.prog[cod] || !String(r[3] || '').trim()) return;
      R.prog[cod] = { labor:String(r[3]), lotes:String(r[4] == null ? '' : r[4]), implemento:String(r[5] || ''), operario:'', obs:'',
        programo:String(r[1] || '').split(' — ')[0] };
    });
  }
  var ult = {}, lecturas = {};
  function anotar(cod, f, h){ if (h == null || h <= 0 || !cod || !f || !maqDe(cod)) return; (lecturas[cod] = lecturas[cod] || []).push({ fecha:f, h:h }); }
  if (preop){
    R.preopHoy = {};
    preop.forEach(function(r){
      var f = aIso(r[0]), cod = codDe(r[3]), h = num(r[7]), op = String(r[2]||'').trim();
      anotar(cod, f, h);
      if (f === hy) R.preopHoy[cod + '|' + op] = { cod:cod, operario:op, hor:h, labor:String(r[5]||''), lotes:String(r[6]==null?'':r[6]) };
    });
  }
  if (cierre){
    R.cierreHoy = {};
    cierre.forEach(function(r){
      var f = aIso(r[0]), cod = codDe(r[3]), h = num(r[4]);
      anotar(cod, f, h);
      // el último cierre de hoy de cada máquina: en doble turno, de ahí arranca el segundo
      if (f === hy && h != null && h > 0 && (R.cierreHoy[cod] == null || h > R.cierreHoy[cod])) R.cierreHoy[cod] = h;
    });
  }
  if (preopViejo) preopViejo.forEach(function(r){ anotar(codDe(r[3]), aIso(r[0]), num(r[6])); });   // Preoperativo anterior
  // el último creíble: un horómetro mal digitado no queda de referencia (maestros.js)
  Object.keys(lecturas).forEach(function(cod){
    var u = Horometros.ultimoValido ? Horometros.ultimoValido(lecturas[cod])
      : lecturas[cod].reduce(function(a, x){ return !a || x.fecha > a.fecha || (x.fecha === a.fecha && x.h > a.h) ? x : a; }, null);
    if (u) ult[cod] = u;
  });
  if (preop || cierre || preopViejo) R.ultHor = ult;
  if (confirmar({ PreopDiario: preop, CierreJornada: cierre, Taller: taller })) enviar();
  R.fecha = hy;
  try { localStorage.setItem(KEY_REMOTO, JSON.stringify(R)); } catch(e){}
  pintarLectura();
}

/* =====================================================================
   Envío (cola: sin señal queda guardado y se manda al volver)
   ===================================================================== */
/* clave: cómo se reconoce la fila en la hoja para confirmar que llegó */
function encolar(hoja, fila, encabezados, clave){
  var x = { hoja:hoja, fila:fila, encabezados:encabezados, clave:clave || null, ref: nid() };
  estado.cola.push(x);
  if (clave) estado.porConfirmar.push({ ref:x.ref, hoja:hoja, fila:fila, encabezados:encabezados, clave:clave, enviadoEn:null, intentos:0 });
}
var enviando = false;
async function enviar(){
  if (enviando || !estado.cola.length || !navigator.onLine){ pintarSync(); return; }
  enviando = true;
  try {
    while (estado.cola.length){
      var x = estado.cola[0];
      try { await fetch(GS_URL, { method:'POST', mode:'no-cors', body: JSON.stringify({ hoja:x.hoja, fila:x.fila, encabezados:x.encabezados }) }); }
      catch(e){ break; }
      estado.cola.shift();
      estado.porConfirmar.forEach(function(c){ if (c.ref === x.ref) c.enviadoEn = Date.now(); });
      persistir();
    }
  } finally { enviando = false; pintarSync(); }
  try { if (navigator.serviceWorker && navigator.serviceWorker.controller)
    navigator.serviceWorker.controller.postMessage({ type: 'SYNC_NOW' }); } catch(e){}
}
/* =====================================================================
   Confirmación: el envío a Google no da respuesta (no-cors). Al leer la hoja
   se busca cada registro; si no está, se reenvía hasta 3 veces y después se
   avisa. Nada se borra sin que el operario lo decida.
   ===================================================================== */
var GRACIA_MS = 2 * 60000, MAX_INTENTOS = 3;
function confirmar(hojas){
  var vistos = {};
  function marca(h, k){ vistos[h + '|' + k] = true; }
  (hojas.PreopDiario || []).forEach(function(r){ marca('PreopDiario', aIso(r[0]) + '|' + codDe(r[3]) + '|' + String(r[2] || '').trim()); });
  (hojas.CierreJornada || []).forEach(function(r){ marca('CierreJornada', aIso(r[0]) + '|' + codDe(r[3]) + '|' + String(r[2] || '').trim()); });
  (hojas.Taller || []).forEach(function(r){ marca('Taller', String(r[3] || '').trim()); });
  var enCola = {}, t = Date.now(), reenvio = false;
  estado.cola.forEach(function(x){ if (x.ref) enCola[x.ref] = true; });
  estado.porConfirmar = estado.porConfirmar.filter(function(c){
    if (!hojas[c.hoja]) return true;                                  // esa hoja no se pudo leer
    var k = c.clave.id || (c.clave.fecha + '|' + c.clave.cod + '|' + (c.clave.op || ''));
    return !vistos[c.hoja + '|' + k];                                 // llegó: se quita
  });
  estado.porConfirmar.forEach(function(c){
    if (!hojas[c.hoja] || enCola[c.ref] || !c.enviadoEn || t - c.enviadoEn < GRACIA_MS || c.intentos >= MAX_INTENTOS) return;
    reencolar(c); c.intentos++; reenvio = true;
  });
  persistir(); pintarNoLlego();
  return reenvio;
}
function reencolar(c){
  c.ref = nid(); c.enviadoEn = null;
  estado.cola.push({ hoja:c.hoja, fila:c.fila, encabezados:c.encabezados, ref:c.ref });
}
function pintarNoLlego(){
  var b = $('#nollego'), l = estado.porConfirmar.filter(function(c){ return c.intentos >= MAX_INTENTOS; });
  if (!l.length){ b.hidden = true; return; }
  b.hidden = false;
  b.innerHTML = '<b>' + (l.length === 1 ? 'No llegó a la hoja: ' : 'No llegaron a la hoja: ') + '</b>' +
    l.map(function(c){ return esc(c.clave.txt); }).join(', ') + '. Siguen guardados en este celular.<br>' +
    '<button id="nl-reint">Volver a enviar</button><button id="nl-desc">Descartar</button>';
  $('#nl-reint').onclick = function(){
    l.forEach(function(c){ c.intentos = 0; reencolar(c); });
    persistir(); pintarNoLlego(); enviar(); aviso('Se volvió a enviar.');
  };
  $('#nl-desc').onclick = function(){
    if (!confirm('¿Descartar? Lo que no llegó a la hoja se pierde. Avísele a Tulio.')) return;
    estado.porConfirmar = estado.porConfirmar.filter(function(c){ return l.indexOf(c) < 0; });
    persistir(); pintarNoLlego();
  };
}

function igual(a, b){
  function n(x){ return String(x || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, ' ').trim(); }
  return n(a) === n(b);
}
/* "Es lo mismo": no se crea otro pendiente, pero queda constancia en la hoja
   Taller (fila REPORTE) de quién lo volvió a encontrar, cuándo y qué vio,
   ligada a los pendientes que ya estaban abiertos. Trazabilidad. */
function reporteRepetido(cod, texto, origen, operario){
  var id = nid(), refs = (R.pendientes[cod] || []).map(function(n){ return n.id; }).filter(Boolean).join(',');
  encolar('Taller', [fechaCO(hoy()), horaAhora(), 'REPORTE', id, cod, nombreDe(cod), '', '', texto, operario, hoy(), refs, origen, ''],
    ENC_TALLER, { id:id, txt:'Reporte repetido de ' + cod });
}
/* la novedad le llega a Tulio como pendiente del taller (él decide si la para) */
function pendienteParaTulio(cod, texto, urgente, sistema, operario){
  // si el taller ya tiene abierto ese mismo aviso de esa máquina, no se repite
  // (pasaba todos los días con la misma novedad); si ahora es urgente, sí va
  var ya = (R.pendientes[cod] || []).some(function(n){ return igual(n.txt, texto) && (n.urgente || !urgente); });
  if (ya) return false;
  var id = nid();
  encolar('Taller', [fechaCO(hoy()), horaAhora(), 'PENDIENTE', id, cod, nombreDe(cod), urgente ? 'urgente' : 'normal',
    sistema ? SISTEMAS[sistema] : '', texto, operario, hoy(), '', '', ''], ENC_TALLER, { id:id, txt:'Aviso al taller de ' + cod });
  (R.pendientes[cod] = R.pendientes[cod] || []).push({ txt:texto, urgente:urgente });
  return true;
}

        '<span><b>Cierre de jornada</b><span>Al terminar: horómetro final y cómo quedó la máquina</span></span></button>' +

function pintarPaso(){
  var paso = PASOS[F.i];
  var r = paso();
  $('#app').innerHTML = '<p class="paso-n">' + (F.tipo === 'preop' ? 'Preoperativo' : 'Cierre de jornada') + ' · paso ' + (F.i + 1) + ' de ' + PASOS.length + '</p>' + r.html;
  $('#progreso').hidden = false; $('#barra').style.width = ((F.i + 1) / PASOS.length * 100) + '%';
  $('#nav').hidden = false;

  $('#sig').textContent = ultimo ? 'Enviar' : 'Siguiente';
  $('#sig').classList.toggle('enviar', ultimo);
  $('#atras').textContent = F.i === 0 ? 'Inicio' : 'Atrás';
  function valido(){ $('#sig').disabled = !(r.listo ? r.listo() : true); }
  if (r.bind) r.bind(valido);
  valido();
  window.scrollTo(0, 0);
}
function siguiente(){
  if (F.i < PASOS.length - 1){ F.i++; pintarPaso(); }
  else if (F.tipo === 'preop') enviarPreop(); else enviarCierre();
}
$('#sig').onclick = function(){ if (!$('#sig').disabled) siguiente(); };
$('#atras').onclick = function(){ if (!F || F.i === 0) inicio(); else { F.i--; pintarPaso(); } };

/* botones de una sola elección: marcan y avisan */
function elegir(sel, attr, alElegir){
  $$(sel).forEach(function(b){
    b.onclick = function(){
      $$(sel).forEach(function(x){ x.setAttribute('aria-pressed', String(x === b)); });
      alElegir(b.getAttribute(attr));
    };
  });
}

/* ---------- 1. operario ---------- */
function pOperario(){
  var ops = operarios();
  return {
    html: '<h2>¿Quién es usted?</h2><p class="ayuda">Toque su nombre.</p><div class="rejilla">' +
      ops.map(function(o){ return '<button class="op" data-o="' + esc(o) + '" aria-pressed="' + (F.operario === o) + '">' + esc(o) + '</button>'; }).join('') + '</div>',
    listo: function(){ return !!F.operario && ops.indexOf(F.operario) >= 0; },
    bind: function(valido){ elegir('[data-o]', 'data-o', function(v){
      // otro operario: la máquina y la labor se vuelven a sugerir según su programación
      if (v !== F.operario){ F.cod = ''; F.codElegida = false; F.labor = ''; F.lotes = ''; F.deProg = false; }
      F.operario = v; valido(); setTimeout(siguiente, 180); }); }
  };
}

/* ---------- 2. máquina ---------- */
function pMaquina(){
  // sugerida: la que le programaron hoy, o en el cierre la del preoperativo de hoy
  var sug = '';
  // la máquina programada para este operario (turno 1, o turno 2 si hay doble turno)
  Object.keys(R.prog).forEach(function(c){ if (R.prog[c].operario === F.operario || R.prog[c].operario2 === F.operario) sug = c; });
  if (F.tipo === 'cierre'){
    preopsHoy().forEach(function(l){ if (l.operario === F.operario) sug = l.cod; });
  }
  /* Una máquina en el Taller no se puede escoger. En el cierre, la única
     excepción es la que este operario usó hoy (se varó durante el día). */
  function usadaHoy(c){
    return !!preopDe(c, F.operario);
  }
  function bloqueada(c){ return !!R.paradas[c] && !(F.tipo === 'cierre' && usadaHoy(c)); }
  if (F.cod && bloqueada(F.cod)) F.cod = '';
  if (!F.codElegida) F.cod = '';            // lo que no escogió el operario se vuelve a sugerir
  if (!F.cod && sug && !bloqueada(sug)) F.cod = sug;
  var lista = flota().slice().sort(function(a, b){ return (a.grupo === 'transporte') - (b.grupo === 'transporte'); });
  var p = R.prog[sug];
  var h = '<h2>¿Qué máquina ' + (F.tipo === 'preop' ? 'va a usar' : 'usó') + ' hoy?</h2><p class="ayuda">Toque la máquina.</p>';
  if (R.intentado && !R.tallerOk){
    h += '<div class="tarj alerta"><div class="vl"><b>No se pudo confirmar qué máquinas están en el taller.</b> ' +
      (R.leidoTaller ? 'Se muestran las de la última lectura (' + dcorta(R.leidoTaller.slice(0, 10)) + '). ' : '') +
      'Antes de usar una máquina, confirme con Tulio que no esté parada.</div></div>';
  }
  if (sug && p && F.tipo === 'preop'){
    h += '<div class="tarj prog"><div class="et">Su programación de hoy' + (p.operario2 === F.operario ? ' · turno 2' : '') + '</div><div class="vl grande">' + esc(sug) + ' · ' + esc(nombreDe(sug)) + '</div>' +
      '<div class="vl">' + esc(p.labor) + (p.lotes ? ' · lotes ' + esc(p.lotes) : '') + '</div></div>';
  }
  h += '<div class="rejilla maq">' + lista.map(function(m){
    var par = R.paradas[m.cod], pen = R.pendientes[m.cod];
    var marca = par ? '<span class="marca-op rojo">En taller' + (bloqueada(m.cod) ? '' : ' · la usó hoy') + '</span>' :
      m.cod === sug ? '<span class="marca-op verde">' + (F.tipo === 'preop' ? 'Programada para usted' : 'La de su preoperativo') + '</span>' :
      pen ? '<span class="marca-op ambar">⚠ Pendiente del taller</span>' : '';
    return '<button class="op" data-m="' + esc(m.cod) + '" aria-pressed="' + (F.cod === m.cod) + '"' + (bloqueada(m.cod) ? ' disabled' : '') + '>' +
      '<span class="cod">' + esc(m.cod) + '</span><small>' + esc(m.nombre) + '</small>' + marca + '</button>';
  }).join('') + '</div>' +
  '<p class="nota">' + (F.tipo === 'preop' ? 'Las máquinas en taller no se pueden usar hasta que Tulio les dé el alta.'
    : 'Las máquinas en taller no tienen cierre, salvo la que usted usó hoy si se varó durante el día.') + '</p>';
  return {
    html: h,
    listo: function(){ return !!F.cod && !bloqueada(F.cod); },
    bind: function(valido){ elegir('[data-m]', 'data-m', function(v){
      if (!confirmarMaquina(v, sug)){ pintarPaso(); return; }
      if (v !== F.cod){ F.labor = ''; F.lotes = ''; F.deProg = false; }
      F.cod = v; F.codElegida = true; F.repetido = null; valido(); setTimeout(siguiente, 180); }); }
  };
}
/* Antes de aceptar una máquina distinta a la suya, se pregunta: así un
   preoperativo no queda en la máquina de otro (celular compartido, o se le
   fue el dedo). Una máquina con preoperativo de otro operario hoy solo es
   normal si es su doble turno programado. */
function confirmarMaquina(v, sug){
  if (v === F.cod && F.codElegida) return true;
  var p = R.prog[v], suyo = p && (p.operario === F.operario || p.operario2 === F.operario);
  if (sug && v !== sug){
    var msg = F.tipo === 'preop'
      ? F.operario + ': usted está programado hoy en la ' + sug + ' · ' + nombreDe(sug) + '.\n\n¿Seguro que va a usar la ' + v + '?'
      : F.operario + ': su preoperativo de hoy fue en la ' + sug + '.\n\n¿Seguro que el cierre es de la ' + v + '?';
    if (!confirm(msg)) return false;
  }
  if (F.tipo === 'preop' && !suyo){
    var otros = preopsHoy().filter(function(l){ return l.cod === v && l.operario !== F.operario; }).map(function(l){ return l.operario; });
    if (otros.length && !confirm('La ' + v + ' ya tiene preoperativo hoy de ' + otros.join(' y ') + '.\n\n¿Usted también la va a usar (doble turno)?')) return false;
  }
  return true;
}

/* aviso de pendientes del taller para la máquina escogida */
function avisoPendientes(){
  var pen = R.pendientes[F.cod];
  if (!pen || !pen.length) return '';
  return '<div class="tarj aviso-t"><div class="et">Ojo · el taller anotó en esta máquina</div>' +
    pen.map(function(n){ return '<div class="vl">' + (n.urgente ? '<b>Urgente:</b> ' : '') + esc(n.txt) + '</div>'; }).join('') +
    '<div class="nota" style="margin-top:6px">Puede trabajar, pero esté atento. Si empeora, repórtelo al final.</div></div>';
}

/* ---------- 3. labor (preoperativo) ---------- */
function pLabor(){

  var h = '<h2>¿Qué labor va a hacer?</h2>' + avisoPendientes();

      '</div><p class="ayuda">Si le cambiaron la labor, escoja otra:</p>';
  } else {

  }
  h += '<div class="rejilla">' + LABORES.concat(p && LABORES.indexOf(p.labor) < 0 ? [p.labor] : []).map(function(l){
    return '<button class="op" data-l="' + esc(l) + '" aria-pressed="' + (F.labor === l) + '">' + esc(l) + '</button>'; }).join('') + '</div>' +
    '<label class="campo"><span>Lotes <i>— opcional</i></span><input id="lotes" value="' + esc(F.lotes) + '" placeholder="12, 13, 14" autocomplete="off"></label>';
  return {
    html: h,
    listo: function(){ return !!F.labor; },
    bind: function(valido){
      elegir('[data-l]', 'data-l', function(v){ F.labor = v; valido(); });
      $('#lotes').oninput = function(){ F.lotes = this.value; };
    }
  };
}

/* Un horómetro que salta mucho casi siempre es un dígito de más o una coma
   que faltó (1164,2 → 11642). No se bloquea: se pide revisar. */
function avisoSalto(n, u){
  if (n == null || !u || n <= u.h) return '';
  var dias = Math.max(1, Math.round((new Date(hoy() + 'T12:00:00') - new Date(u.fecha + 'T12:00:00')) / 86400000));
  if (n - u.h <= 24 * dias) return '';
  return '<div class="tarj alerta"><div class="vl">Es <b>' + fmtH(Math.round((n - u.h) * 10) / 10) + ' más</b> que el último registrado (' + fmtH(u.h) +
    ' el ' + dcorta(u.fecha) + '). Revise que no le sobre un número o le falte la coma.</div></div>';
}

/* ---------- 4. horómetro inicial ---------- */
function infoHorometro(){
  var u = R.ultHor[F.cod];
  return u ? 'Último registrado: <b>' + fmtH(u.h) + '</b> el ' + dcorta(u.fecha) + '.' : 'Todavía no hay un horómetro registrado para esta máquina.';
}
function pHorometro(){
  return {
    html: '<h2>Horómetro</h2><p class="ayuda">Escriba lo que marca el horómetro <b>antes de arrancar</b>.</p>' +
      '<label class="campo"><input id="hor" class="horometro" inputmode="decimal" placeholder="0" value="' + esc(F.hor) + '" autocomplete="off"></label>' +
      '<p class="nota">' + infoHorometro() + '</p><div id="hor-aviso"></div>',
    listo: function(){ return num(F.hor) != null && num(F.hor) >= 0; },
    bind: function(valido){
      var inp = $('#hor');
      function revisar(){
        F.hor = inp.value.trim(); valido();
        var n = num(F.hor), u = R.ultHor[F.cod];
        $('#hor-aviso').innerHTML = ((n != null && u && n < u.h)
          ? '<div class="tarj alerta"><div class="vl">Es <b>menor</b> que el último registrado (' + fmtH(u.h) + '). Revise que esté bien escrito.</div></div>' : '') +
          avisoSalto(n, u) + avisoMtto(n);
      }
      inp.oninput = revisar; revisar(); setTimeout(function(){ inp.focus(); }, 100);
    }
  };
}

/* mantenimiento preventivo con el horómetro que escribió (Mtto en maestros.js) */
function avisoMtto(n){
  if (n == null) return '';
  var m = Mtto.estado(F.cod, n);
  if (m.nivel === 'vencido') return '<div class="tarj alerta"><div class="et">Mantenimiento vencido</div><div class="vl">Le tocaba a las <b>' + fmtH(m.proximo) +
    '</b> (se pasó ' + fmtH(-m.faltan) + '). Avísele a Tulio.</div></div>';
  if (m.nivel === 'proximo') return '<div class="tarj aviso-t"><div class="et">Mantenimiento próximo</div><div class="vl">Faltan <b>' + fmtH(m.faltan) +
    '</b>: le toca a las ' + fmtH(m.proximo) + '.</div></div>';
  return '';
}

/* ---------- 5. niveles ---------- */
function pNiveles(){
  return {
    html: '<h2>Niveles</h2><p class="ayuda">Revise con el motor frío.</p>' + NIVELES.map(function(n){
      var v = F.niveles[n.id];
      return '<div class="chequeo' + (v ? ' marcado-' + (v === 'bien' ? 'bien' : v === 'bajo' ? 'medio' : 'mal') : '') + '" data-fila="' + n.id + '"><div class="q">' + esc(n.txt) + '</div><div class="bts">' +
        '<button class="bien" data-n="' + n.id + '" data-v="bien" aria-pressed="' + (v === 'bien') + '">Bien</button>' +
        '<button class="medio" data-n="' + n.id + '" data-v="bajo" aria-pressed="' + (v === 'bajo') + '">Bajo</button>' +
        '<button class="mal" data-n="' + n.id + '" data-v="muybajo" aria-pressed="' + (v === 'muybajo') + '">Muy bajo</button></div></div>';
    }).join(''),
    listo: function(){ return NIVELES.every(function(n){ return F.niveles[n.id]; }); },
    bind: function(valido){
      $$('[data-n]').forEach(function(b){
        b.onclick = function(){
          var id = b.dataset.n; F.niveles[id] = b.dataset.v;
          $$('[data-n="' + id + '"]').forEach(function(x){ x.setAttribute('aria-pressed', String(x === b)); });
          $('[data-fila="' + id + '"]').className = 'chequeo marcado-' + (b.dataset.v === 'bien' ? 'bien' : b.dataset.v === 'bajo' ? 'medio' : 'mal');
          valido();
        };
      });
    }
  };
}

/* ---------- 6. inspección ---------- */
function pInspeccion(){
  return {
    html: '<h2>Inspección</h2><p class="ayuda">Revise cada parte y toque <b>Bien</b> o <b>Problema</b>.</p>' + ITEMS.map(function(it){
      var v = F.items[it.id];
      return '<div class="chequeo' + (v ? ' marcado-' + (v === 'bien' ? 'bien' : 'mal') : '') + '" data-fila="' + it.id + '"><div class="q">' + esc(it.txt) + '<small>' + esc(it.sub) + '</small></div><div class="bts">' +
        '<button class="bien" data-i="' + it.id + '" data-v="bien" aria-pressed="' + (v === 'bien') + '">Bien</button>' +
        '<button class="mal" data-i="' + it.id + '" data-v="problema" aria-pressed="' + (v === 'problema') + '">Problema</button></div></div>';
    }).join('') + '<button class="accion gris" id="todo-bien" style="margin-top:6px">Marcar el resto como Bien</button>',
    listo: function(){ return ITEMS.every(function(it){ return F.items[it.id]; }); },
    bind: function(valido){
      function marcar(id, v){
        F.items[id] = v;
        $$('[data-i="' + id + '"]').forEach(function(x){ x.setAttribute('aria-pressed', String(x.dataset.v === v)); });
        $('[data-fila="' + id + '"]').className = 'chequeo marcado-' + (v === 'bien' ? 'bien' : 'mal');
      }
      $$('[data-i]').forEach(function(b){ b.onclick = function(){ marcar(b.dataset.i, b.dataset.v); valido(); }; });
      $('#todo-bien').onclick = function(){ ITEMS.forEach(function(it){ if (!F.items[it.id]) marcar(it.id, 'bien'); }); valido(); };
    }
  };
}

/* problemas encontrados en el preoperativo, en palabras */
function problemas(){
  var l = [];
  NIVELES.forEach(function(n){ if (F.niveles[n.id] && F.niveles[n.id] !== 'bien') l.push({ txt: n.txt + (F.niveles[n.id] === 'bajo' ? ' bajo' : ' muy bajo'), sis:n.sis }); });
  ITEMS.forEach(function(it){ if (F.items[it.id] === 'problema') l.push({ txt: it.txt, sis:it.sis }); });
  return l;
}
function sistemaComun(l){ var s = l.map(function(x){ return x.sis; }); return s.length && s.every(function(x){ return x === s[0]; }) ? s[0] : ''; }

/* Si el taller ya tiene algo anotado en esta máquina y el operario reporta una
   novedad, se le pregunta si es lo mismo: así a Tulio no le llega repetido
   (los operarios lo describen con otras palabras). Si la máquina no puede
   trabajar, sí se avisa siempre. */
function necesitaRep(){
  return !!(R.pendientes[F.cod] || []).length && F.estado !== 'varada' &&
    (F.estado === 'novedad' || (F.tipo === 'preop' && problemas().length > 0));
}
function pintarRep(valido){
  var z = $('#zona-rep'); if (!z) return;
  if (!necesitaRep()){ z.innerHTML = ''; return; }
  z.innerHTML = '<div class="tarj aviso-t"><div class="et">El taller ya tiene anotado en esta máquina</div>' +
    R.pendientes[F.cod].map(function(n){ return '<div class="vl">• ' + esc(n.txt) + '</div>'; }).join('') +
    '<div class="vl" style="margin-top:10px"><b>¿Lo que usted encontró es lo mismo?</b></div>' +
    '<div class="rejilla" style="margin-top:8px">' +
      '<button class="op" data-rep="mismo" aria-pressed="' + (F.repetido === 'mismo') + '">Es lo mismo<small>No se vuelve a avisar</small></button>' +
      '<button class="op" data-rep="nuevo" aria-pressed="' + (F.repetido === 'nuevo') + '">Es algo nuevo<small>Le llega a Tulio</small></button>' +
    '</div></div>';
  elegir('[data-rep]', 'data-rep', function(v){ F.repetido = v; valido(); });
}

/* ---------- 7. estado (preoperativo) ---------- */
function botonesEstado(textos){
  return '<div class="estado-op">' +
    '<button class="bien" data-e="operativa" aria-pressed="' + (F.estado === 'operativa') + '">' + textos[0] + '</button>' +
    '<button class="medio" data-e="novedad" aria-pressed="' + (F.estado === 'novedad') + '">' + textos[1] + '</button>' +
    '<button class="mal" data-e="varada" aria-pressed="' + (F.estado === 'varada') + '">' + textos[2] + '</button></div>';
}
function pEstado(){
  var pr = problemas();
  if (!F.estado) F.estado = pr.length ? 'novedad' : 'operativa';
  return {
    html: '<h2>¿Puede trabajar hoy?</h2>' +
      '<div class="tarj"><div class="dato"><span>Operario</span><b>' + esc(F.operario) + '</b></div>' +
        '<div class="dato"><span>Máquina</span><b>' + esc(F.cod) + ' · ' + esc(nombreDe(F.cod)) + '</b></div>' +
        '<div class="dato"><span>Labor</span><b>' + esc(F.labor) + (F.lotes ? ' · ' + esc(F.lotes) : '') + '</b></div>' +
        '<div class="dato"><span>Horómetro</span><b class="mono">' + fmtH(num(F.hor)) + '</b></div>' +
        '<div class="dato"><span>Encontró</span><b>' + (pr.length ? pr.map(function(x){ return esc(x.txt); }).join(', ') : 'Todo bien') + '</b></div></div>' +
      botonesEstado(['Sí, todo bien<small>Arranca a trabajar</small>', 'Sí, pero con novedad<small>Trabaja, y el taller queda avisado</small>',
                     'No puede trabajar<small>Le avisa a Tulio como urgente</small>']) +
      '<div id="zona-rep"></div>' +
      '<label class="campo"><span id="obs-et"></span><textarea id="obs" placeholder="¿Qué notó? Ruido, fuga, no arranca…">' + esc(F.obs) + '</textarea></label>',
    listo: function(){ return !!F.estado && (F.estado === 'operativa' || F.obs.trim().length > 2 || problemas().length > 0) &&
      (!necesitaRep() || !!F.repetido); },
    bind: function(valido){
      function etiqueta(){ $('#obs-et').innerHTML = F.estado === 'operativa' ? 'Observaciones <i>— opcional</i>' :
        'Cuéntele al taller qué pasa' + (problemas().length ? ' <i>— opcional</i>' : ''); }
      elegir('[data-e]', 'data-e', function(v){ F.estado = v; etiqueta(); pintarRep(valido); valido(); });
      $('#obs').oninput = function(){ F.obs = this.value; valido(); };
      etiqueta(); pintarRep(valido);
    }
  };
}

function enviarPreop(){
  var pr = problemas(), n = num(F.hor);
  var fila = [fechaCO(hoy()), horaAhora(), F.operario, F.cod + ' · ' + F.operario, nombreDe(F.cod), F.labor, F.lotes, n]
    .concat(NIVELES.map(function(x){ return { bien:'Bien', bajo:'Bajo', muybajo:'Muy bajo' }[F.niveles[x.id]]; }))
    .concat(ITEMS.map(function(it){ return F.items[it.id] === 'problema' ? 'Problema' : 'Bien'; }))
    .concat([{ operativa:'Puede trabajar', novedad:'Con novedad', varada:'No puede trabajar' }[F.estado], F.obs.trim()]);
  encolar('PreopDiario', fila, ENC_PREOP, { fecha:hoy(), cod:F.cod, op:F.operario, txt:'Preoperativo de ' + F.cod + ' (' + F.operario + ')' });
  var yaAnotado = F.repetido === 'mismo' && necesitaRep();
  if (F.estado !== 'operativa' || pr.length){
    var txt = (F.estado === 'varada' ? 'NO PUEDE TRABAJAR (preoperativo)' : 'Preoperativo') +
      (pr.length ? ': ' + pr.map(function(x){ return x.txt; }).join(', ') : '') + (F.obs.trim() ? '. ' + F.obs.trim() : '');
    if (yaAnotado) reporteRepetido(F.cod, txt, 'Preoperativo', F.operario);
    else pendienteParaTulio(F.cod, txt, F.estado === 'varada', sistemaComun(pr), F.operario);
  }
  estado.ultimoOperario = F.operario;
  estado.hoy.preop[F.cod + '|' + F.operario] = { cod:F.cod, operario:F.operario, hor:n, labor:F.labor, lotes:F.lotes };
  R.ultHor[F.cod] = { fecha:hoy(), h:n };
  persistir(); enviar();
  terminar(F.estado, F.estado === 'operativa' ? 'Preoperativo enviado' : F.estado === 'novedad' ? 'Enviado con novedad' : 'Máquina reportada',
    F.estado === 'operativa' ? '¡Buen día de trabajo!' :
    F.estado === 'novedad' ? (yaAnotado ? 'Puede trabajar. El taller ya lo tenía anotado.' : 'Puede trabajar. El taller ya quedó avisado de la novedad.') :
    'No use la máquina. Tulio ya quedó avisado como urgente.');
}

/* ---------- cierre: horómetro final ---------- */
function horInicialHoy(){
  var l = preopDe(F.cod, F.operario);
  if (l && l.hor != null) return l.hor;
  // segundo turno sin preoperativo: arranca donde terminó el primero
  return R.cierreHoy && R.cierreHoy[F.cod] != null ? R.cierreHoy[F.cod] : null;
}
function pHorFinal(){
  var ini = horInicialHoy();
  return {
    html: '<h2>Horómetro final</h2><p class="ayuda">Escriba lo que marca el horómetro <b>al apagar</b> la máquina.</p>' +
      '<label class="campo"><input id="hor" class="horometro" inputmode="decimal" placeholder="0" value="' + esc(F.hor) + '" autocomplete="off"></label>' +
      '<p class="nota">' + (ini != null ? 'En el preoperativo de hoy marcaba <b>' + fmtH(ini) + '</b>.' : infoHorometro() + ' No se encontró el preoperativo de hoy de esta máquina.') + '</p>' +
      '<div id="hor-aviso"></div>',
    listo: function(){ return num(F.hor) != null && num(F.hor) >= 0; },
    bind: function(valido){
      var inp = $('#hor');
      function revisar(){
        F.hor = inp.value.trim(); valido();
        var n = num(F.hor), box = $('#hor-aviso'), u = R.ultHor[F.cod];
        if (n != null && ini == null && u && n < u.h){
          box.innerHTML = '<div class="tarj alerta"><div class="vl">Es <b>menor</b> que el último registrado (' + fmtH(u.h) + '). Revise que esté bien escrito.</div></div>'; return; }
        if (n == null || ini == null){ box.innerHTML = ini == null ? avisoSalto(n, u) : ''; return; }
        var dif = Math.round((n - ini) * 10) / 10;
        box.innerHTML = dif < 0
          ? '<div class="tarj alerta"><div class="vl">Es <b>menor</b> que el inicial (' + fmtH(ini) + '). Revise que esté bien escrito.</div></div>'
          : dif > 16
          ? '<div class="tarj alerta"><div class="vl">Serían <b>' + fmtH(dif) + '</b> trabajadas hoy (inicial ' + fmtH(ini) + '). Revise que no le sobre un número o le falte la coma.</div></div>'
          : '<div class="tarj prog"><div class="et">Horas trabajadas hoy</div><div class="vl grande mono">' + fmtH(dif) + '</div></div>';
      }
      inp.oninput = revisar; revisar(); setTimeout(function(){ inp.focus(); }, 100);
    }
  };
}

/* ---------- cierre: cómo terminó ---------- */
function pEstadoFinal(){
  return {
    html: '<h2>¿Cómo quedó la máquina?</h2>' + avisoPendientes() +
      botonesEstado(['Bien para mañana<small>Sin novedades</small>', 'Con novedad<small>Funciona, pero algo hay que revisar</small>',
                     'Varada<small>No puede trabajar. Le avisa a Tulio como urgente</small>']) +
      '<div id="zona-rep"></div>' +
      '<label class="campo"><span id="obs-et"></span><textarea id="obs" placeholder="¿Qué pasó? Fuga, ruido, se apagó…">' + esc(F.obs) + '</textarea></label>',
    listo: function(){ return !!F.estado && (F.estado === 'operativa' || F.obs.trim().length > 2) && (!necesitaRep() || !!F.repetido); },
    bind: function(valido){
      function etiqueta(){ $('#obs-et').innerHTML = F.estado === 'operativa' || !F.estado ? 'Observaciones <i>— opcional</i>' : 'Cuéntele al taller qué pasó'; }
      elegir('[data-e]', 'data-e', function(v){ F.estado = v; etiqueta(); pintarRep(valido); valido(); });
      $('#obs').oninput = function(){ F.obs = this.value; valido(); };
      etiqueta(); pintarRep(valido);
    }
  };
}

/* ---------- cierre: labor realizada ---------- */
function pLaborFinal(){
  if (!F.labor){
    var l = preopDe(F.cod, F.operario) || {}, p = R.prog[F.cod] || {};
    F.labor = l.labor || p.labor || ''; F.lotes = l.lotes || p.lotes || '';
    if (F.labor && F.lotes) F.labor += ' · lotes ' + F.lotes;
  }
  var ini = horInicialHoy(), n = num(F.hor);
  return {
    html: '<h2>¿Qué labor hizo?</h2><p class="ayuda">Corríjala si cambió durante el día.</p>' +
      '<label class="campo"><textarea id="labor" placeholder="Alce de racimos con tijera · lotes 12, 13">' + esc(F.labor) + '</textarea></label>' +
      '<div class="tarj"><div class="dato"><span>Operario</span><b>' + esc(F.operario) + '</b></div>' +
        '<div class="dato"><span>Máquina</span><b>' + esc(F.cod) + ' · ' + esc(nombreDe(F.cod)) + '</b></div>' +
        '<div class="dato"><span>Horómetro final</span><b class="mono">' + fmtH(n) + '</b></div>' +
        (ini != null && n != null && n >= ini ? '<div class="dato"><span>Horas trabajadas</span><b class="mono">' + fmtH(Math.round((n - ini) * 10) / 10) + '</b></div>' : '') +
        '<div class="dato"><span>Quedó</span><b>' + { operativa:'Bien para mañana', novedad:'Con novedad', varada:'Varada' }[F.estado] + '</b></div></div>',
    listo: function(){ return true; },
    bind: function(){ $('#labor').oninput = function(){ F.labor = this.value; }; }
  };
}

function enviarCierre(){
  var n = num(F.hor), ini = horInicialHoy();
  var horas = ini != null && n != null && n >= ini && n - ini <= 24 ? Math.round((n - ini) * 10) / 10 : '';
  encolar('CierreJornada', [fechaCO(hoy()), horaAhora(), F.operario, F.cod + ' - ' + nombreDe(F.cod) + ' · ' + F.operario, n, ini == null ? '' : ini, horas,
    F.estado === 'varada' ? 'varado' : F.estado === 'novedad' ? 'novedad' : 'operativo', F.obs.trim(), F.labor.trim()], ENC_CIERRE,
    { fecha:hoy(), cod:F.cod, op:F.operario, txt:'Cierre de ' + F.cod + ' (' + F.operario + ')' });
  var yaAnotado = F.repetido === 'mismo' && necesitaRep();
  if (F.estado !== 'operativa' && yaAnotado) reporteRepetido(F.cod, 'Cierre de jornada: ' + F.obs.trim(), 'Cierre de jornada', F.operario);
  else if (F.estado !== 'operativa'){
    pendienteParaTulio(F.cod, (F.estado === 'varada' ? 'VARADA al terminar la jornada: ' : 'Cierre de jornada: ') + F.obs.trim(),
      F.estado === 'varada', '', F.operario);
  }
  estado.ultimoOperario = F.operario;
  R.ultHor[F.cod] = { fecha:hoy(), h:n };
  if (n != null && (R.cierreHoy[F.cod] == null || n > R.cierreHoy[F.cod])) R.cierreHoy[F.cod] = n;
  persistir(); enviar();
  terminar(F.estado, F.estado === 'operativa' ? 'Cierre enviado' : F.estado === 'novedad' ? 'Cierre con novedad' : 'Máquina varada',
    (horas !== '' ? 'Trabajó ' + fmtH(horas) + ' hoy. ' : '') +
    (F.estado === 'operativa' ? '¡Gracias, hasta mañana!' : F.estado === 'novedad' ? (yaAnotado ? 'El taller ya lo tenía anotado.' : 'El taller ya quedó avisado.') : 'Tulio ya quedó avisado como urgente.'));
}

function terminar(est, titulo, msg){
  $('#nav').hidden = true; $('#progreso').hidden = true;
  var cl = est === 'operativa' ? '' : est === 'novedad' ? 'medio' : 'mal';
  $('#app').innerHTML = '<div class="fin"><div class="icono ' + cl + '">' + (est === 'operativa' ? '✓' : '!') + '</div>' +
    '<h2>' + esc(titulo) + '</h2><p>' + esc(msg) + '</p>' +
    (estado.cola.length && !navigator.onLine ? '<p class="nota">Sin señal: quedó guardado en el celular y se envía solo cuando vuelva.</p>' : '') +
    '<button class="accion" id="otra">Volver al inicio</button></div>';
  $('#otra').onclick = inicio;
  F = null;
}

/* =====================================================================
   Instalar como app y arranque
   ===================================================================== */
if ('serviceWorker' in navigator){
  navigator.serviceWorker.register('/maquinaria-taller-palmag/sw.js').catch(function(){});
}
var pedidoInstalar = null;
window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); pedidoInstalar = e; $('#btn-instalar').hidden = false; });
$('#btn-instalar').onclick = async function(){
  var no = window.Instalar && Instalar.impedimento();
  if (no){ alert(no); return; }
  if (!pedidoInstalar) return;
  pedidoInstalar.prompt(); try { await pedidoInstalar.userChoice; } catch(e){}
  pedidoInstalar = null; $('#btn-instalar').hidden = true;
};
window.addEventListener('appinstalled', function(){ $('#btn-instalar').hidden = true; aviso('Preoperativo quedó instalado en el celular.'); });

(async function init(){
  var fh = new Date().toLocaleDateString('es-CO', { weekday:'long', day:'numeric', month:'long' });
  $('#fecha-hoy').textContent = fh.charAt(0).toUpperCase() + fh.slice(1);
  cargarLocal();
  R.tallerOk = false; R.intentado = false;
  inicio(); pintarSync();
  await enviar();
  await traerTodo();
  if (!F) inicio();                       // refresca lo de "hoy en este celular"
  window.addEventListener('online', function(){ enviar(); traerTodo(); });
  setInterval(function(){ if (estado.cola.length) enviar(); else if (!F) traerTodo(); }, 3 * 60000);
})();
</script>
