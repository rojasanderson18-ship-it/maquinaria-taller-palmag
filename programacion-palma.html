/* =====================================================================
   Google Sheets
   ===================================================================== */
function nid(){ return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function horaAhora(){ var d = new Date(); return p2(d.getHours()) + ':' + p2(d.getMinutes()); }
function fechaCO(iso){ return new Date(iso + 'T12:00:00').toLocaleDateString('es-CO'); }
function dcorta(iso){ var p = String(iso).split('-'); return p.length === 3 ? p[2] + '/' + p[1] : iso; }
/* la hoja puede devolver la fecha como texto d/m/aaaa, aaaa-mm-dd o fecha ISO */
function aIso(v){
  var s = String(v==null?'':v).trim(); if (!s) return '';
  var m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); if (m) return m[3]+'-'+p2(m[2])+'-'+p2(m[1]);
  if (s.indexOf('T') > 0){ var d = new Date(s); if (!isNaN(d)) return isoLocal(d); }
  return s.slice(0,10);
}
function idLabor(v){
  var l = LABORES.filter(function(x){ return x.id === v || x.txt === v; })[0];
  return l ? l.id : 'varias';
}

/* Cada cambio de una máquina en una fecha va a la cola: una fila para
   ProgMaquinaria y la escritura (o borrado) en la hoja Programacion de siempre. */
function registrar(fecha, cod, a){
  var d = new Date();
  estado.cola.push({ id:'prog:' + nid(), efecto:{ fecha:fecha, cod:cod, a: a ? JSON.parse(JSON.stringify(a)) : null },
    hoja: HOJA_PROG, encabezados: ENC_PROG,
    fila: [d.toLocaleDateString('es-CO'), horaAhora(), a ? 'ASIGNAR' : 'QUITAR', nid(), fecha, cod,
      a ? txtLabor(a.labor) : '', a ? (a.lotes || []).join(', ') : '', a ? (a.implemento || '') : '',
      a ? (a.operario || '') : '', a ? (a.obs || '') : '', estado.yo, a ? (a.operario2 || '') : ''] });
  var q = { hoja:'Programacion', fecha: fechaCO(fecha), tractor: cod + ' - ' + nombreDe(cod) };
  if (a){ q.action = 'write'; q.supervisor = estado.yo; q.labor = txtLabor(a.labor);
          q.lote = (a.lotes || []).join(', '); q.impl = a.implemento || ''; q.hora = ''; }
  else q.action = 'delete';
  var url = GS_URL + '?' + new URLSearchParams(q).toString();
  estado.cola[estado.cola.length - 1].legado = url;
  estado.cola.push({ id:'legado:' + nid(), url: url });
}

/* =====================================================================
   Confirmación: el envío no da respuesta (no-cors). Lo enviado queda por
   confirmar hasta que su fila (ID único) aparece en ProgMaquinaria; mientras
   tanto se sigue mostrando. Si no aparece se reenvía hasta 3 veces y luego
   se avisa. Si otro supervisor programó esa máquina ese día, manda la hoja.
   ===================================================================== */
var GRACIA_MS = 2 * 60000, MAX_INTENTOS = 3;
function confirmarProg(filas){
  var vistos = {}, otros = {}, t = Date.now(), reenvio = false, perdidos = [];
  filas.forEach(function(r){
    vistos[String(r[3] || '').trim()] = true;
    var k = aIso(r[4]) + '|' + String(r[5] || '').trim();
    (otros[k] = otros[k] || []).push(String(r[11] || '').trim());
  });
  var enCola = {}, ultimo = {};
  function clave(e){ return e.fecha + '|' + e.cod; }
  estado.porConfirmar.forEach(function(c){ ultimo[clave(c.efecto)] = c.fila[3]; });
  estado.cola.forEach(function(x){ if (x.fila){ enCola[x.fila[3]] = true; if (x.efecto) ultimo[clave(x.efecto)] = x.fila[3]; } });
  // un cambio que ya tiene otro más nuevo de la misma máquina y día no se reenvía
  // (si no, el viejo podría quedar de último en la hoja)
  estado.porConfirmar = estado.porConfirmar.filter(function(c){ return ultimo[clave(c.efecto)] === c.fila[3]; });
  estado.porConfirmar = estado.porConfirmar.filter(function(c){
    if (vistos[c.fila[3]]) return false;                              // llegó
    var de = (otros[c.efecto.fecha + '|' + c.efecto.cod] || []).filter(function(n){ return n && n !== c.fila[11]; });
    if (de.length && !enCola[c.fila[3]]){ perdidos.push(c.efecto.cod + ' del ' + dcorta(c.efecto.fecha) + ' (lo programó ' + de[de.length - 1] + ')'); return false; }
    return true;
  });
  estado.porConfirmar.forEach(function(c){
    if (enCola[c.fila[3]] || !c.enviadoEn || t - c.enviadoEn < GRACIA_MS || c.intentos >= MAX_INTENTOS) return;
    reencolarProg(c); c.intentos++; reenvio = true;
  });
  if (perdidos.length) aviso('No llegó su cambio de ' + perdidos.join(', ') + '. Quedó lo de la hoja: revíselo.');
  pintarNoLlego();
  return reenvio;
}
function reencolarProg(c){
  c.enviadoEn = null;
  estado.cola.push({ id:'prog:' + nid(), efecto:c.efecto, hoja:HOJA_PROG, encabezados:ENC_PROG, fila:c.fila, legado:c.legado });
  if (c.legado) estado.cola.push({ id:'legado:' + nid(), url:c.legado });
}
function pintarNoLlego(){
  var b = $('#nollego'), l = estado.porConfirmar.filter(function(c){ return c.intentos >= MAX_INTENTOS; });
  if (!l.length){ b.hidden = true; return; }
  b.hidden = false;
  b.innerHTML = '<b>No llegó a la hoja:</b> ' + l.map(function(c){
      return esc(c.efecto.cod) + ' del ' + dcorta(c.efecto.fecha) + (c.efecto.a ? '' : ' (quitar)'); }).join(', ') +
    '. Sigue guardado en este celular.<br><button id="nl-reint">Volver a enviar</button><button id="nl-desc">Descartar</button>';
  $('#nl-reint').onclick = async function(){
    l.forEach(function(c){ c.intentos = 0; reencolarProg(c); });
    await persistir(); pintarNoLlego(); enviar(); aviso('Se volvió a enviar.');
  };
  $('#nl-desc').onclick = async function(){
    if (!confirm('¿Descartar? Queda lo que tenga la hoja.')) return;
    estado.porConfirmar = estado.porConfirmar.filter(function(c){ return l.indexOf(c) < 0; });
    await persistir(); pintarNoLlego(); traerProgramacion();
  };
}

/* lotes, fincas e implementos se comparten en la hoja Maestros */
var CFG_MAESTROS = { LOTES:'lotes', FINCAS:'fincas', IMPL:'implementos', OPERARIOS:'operarios', SUPERVISORES:'supervisores' };
function pendienteMaestro(t){ return (estado.cola || []).some(function(x){ return x.id === 'maestro:' + t; }); }
function aplicarMaestros(){
  Object.keys(CFG_MAESTROS).forEach(function(t){
    var v = Maestros.get(t);
    if (v && !pendienteMaestro(t)) estado.config[CFG_MAESTROS[t]] = v;
  });
}
function guardarConfig(){
  var hubo = false;
  ['operarios', 'supervisores'].forEach(function(k){
    if (estado.config[k]) estado.config[k] = estado.config[k].filter(function(x){ return x.nombre; });
  });
  Object.keys(CFG_MAESTROS).forEach(function(t){
    var actual = estado.config[CFG_MAESTROS[t]];
    if (!actual) return;
    var guardada = Maestros.get(t);
    var defecto = t === 'LOTES' ? lotesDefecto() : t === 'FINCAS' ? FINCAS_DEF : t === 'IMPL' ? IMPL_DEF :
                  t === 'OPERARIOS' ? OPERARIOS_DEF : SUPERVISORES_DEF;
    if (JSON.stringify(actual) === JSON.stringify(guardada || defecto)) return;
    var x = Maestros.fila(t, actual, estado.yo);
    estado.cola = estado.cola.filter(function(c){ return c.id !== x.id; });
    estado.cola.push({ id:x.id, hoja:x.hoja, fila:x.fila, encabezados:x.encabezados });
    hubo = true;
  });
  return hubo;
}

var enviando = false;
async function enviar(){
  if (enviando || !estado.cola.length || !navigator.onLine){ pintarSync(); return; }
  enviando = true;
  try {
    while (estado.cola.length){
      var x = estado.cola[0];
      try {
        if (x.url) await fetch(x.url, { mode:'no-cors' });
        else await fetch(GS_URL, { method:'POST', mode:'no-cors',
          body: JSON.stringify({ hoja:x.hoja, fila:x.fila, encabezados:x.encabezados }) });
      } catch(e){ break; }      // sin señal: sigue en la cola
      estado.cola.shift();
      if (x.efecto){
        var pc = estado.porConfirmar.filter(function(c){ return c.fila[3] === x.fila[3]; })[0];
        if (pc) pc.enviadoEn = Date.now();
        else estado.porConfirmar.push({ efecto:x.efecto, fila:x.fila, legado:x.legado || null, enviadoEn:Date.now(), intentos:0 });
      }
      await persistir();
    }
  } finally { enviando = false; pintarSync(); }
  // si el service worker guardó algo sin señal, que lo envíe ya
  try { if (navigator.serviceWorker && navigator.serviceWorker.controller)
    navigator.serviceWorker.controller.postMessage({ type: 'SYNC_NOW' }); } catch(e){}
}

/* La hoja manda; encima se vuelven a aplicar los cambios de este celular que
   todavía no se han enviado. */
async function traerProgramacion(){
  if (!navigator.onLine) return;
  try {
    var r = await fetch(GS_URL + '?hoja=' + HOJA_PROG + '&t=' + Date.now());
    var d = await r.json();
    if (!d || !d.ok || !Array.isArray(d.datos)) return;
    if (!$('#hoja').hidden) return;           // con un formulario abierto no se cambia nada
    var dias = {};
    d.datos.forEach(function(row){
      var acc = String(row[2] || '').trim().toUpperCase(), f = aIso(row[4]), cod = String(row[5] || '').trim();
      if (!/^\d{4}-\d{2}-\d{2}$/.test(f) || !cod) return;
      if (acc === 'QUITAR'){ if (dias[f]) delete dias[f][cod]; return; }
      if (acc !== 'ASIGNAR') return;
      (dias[f] = dias[f] || {})[cod] = {
        labor: idLabor(String(row[6] || '').trim()),
        lotes: String(row[7] == null ? '' : row[7]).split(',').map(function(x){ return x.trim(); }).filter(Boolean),
        implemento: String(row[8] || '').trim() || null,
        operario: String(row[9] || '').trim() || null,
        operario2: String(row[12] || '').trim() || null,
        obs: String(row[10] || ''),
        programadoPor: String(row[11] || '')
      };
    });
    var reenvio = confirmarProg(d.datos);
    // encima de la hoja: lo enviado sin confirmar y lo que está en la cola, en orden
    estado.porConfirmar.map(function(c){ return c; }).concat(estado.cola.filter(function(x){ return x.efecto; }))
      .forEach(function(x){
        var e = x.efecto;
        if (e.a) (dias[e.fecha] = dias[e.fecha] || {})[e.cod] = e.a;
        else if (dias[e.fecha]) delete dias[e.fecha][e.cod];
      });
    Object.keys(dias).forEach(function(f){ if (!Object.keys(dias[f]).length) delete dias[f]; });
    estado.dias = dias;
    await persistir();
    pintar();
    if (reenvio) enviar();
  } catch(e){}
}

async function traerMaestros(){
  if (!navigator.onLine) return;
  var pend = {};
  Object.keys(CFG_MAESTROS).concat(['FLOTA']).forEach(function(t){ if (pendienteMaestro(t)) pend[t] = true; });
  try {
    if (await Maestros.traer(pend)){ aplicarMaestros(); await persistir(); if ($('#hoja').hidden) pintar(); }
    if (!Maestros.reenviar) return;   // maestros.js viejo en caché
    Maestros.avisos().forEach(function(m){ aviso(m); });
    // lo que se envió y no apareció en la hoja se vuelve a enviar (hasta 3 veces)
    var re = Maestros.reenviar(pend);
    re.forEach(function(x){ estado.cola.push({ id:x.id, hoja:x.hoja, fila:x.fila, encabezados:x.encabezados }); });
    if (re.length){ await persistir(); enviar(); }
  } catch(e){}
}

/* Las paradas sin alta de la hoja Taller (misma lectura que el Taller:
   filas PARADA y ALTA con el mismo ID). Si no hay señal, la última copia. */
async function leerTaller(){
  try {
    var r = await fetch(GS_URL + '?hoja=Taller&t=' + Date.now());
    var d = await r.json();
    if (!d || !d.ok || !Array.isArray(d.datos)) throw new Error('sin datos');
    var ev = {}, nov = {};
    d.datos.forEach(function(row){
      var acc = String(row[2] || '').trim().toUpperCase(), id = String(row[3] || '').trim();
      if (id && (acc === 'PENDIENTE' || acc === 'RESUELTO')){
        var n = nov[id] = nov[id] || { equipo:String(row[4] || '').trim(), txt:'', urgente:false, cerrado:false };
        if (row[8]) n.txt = String(row[8]);
        if (row[6]) n.urgente = String(row[6]).trim() === 'urgente';
        if (acc === 'RESUELTO') n.cerrado = true;
        return;
      }
      if (!id || (acc !== 'PARADA' && acc !== 'ALTA')) return;
      var e = ev[id] = ev[id] || { equipo:String(row[4] || '').trim(), novedad:'', desde:'', cerrada:false };
      if (row[8]) e.novedad = String(row[8]);
      if (row[10]) e.desde = aIso(row[10]);
      if (acc === 'ALTA') e.cerrada = true;
    });
    varadas = {};
    Object.keys(ev).forEach(function(id){
      var e = ev[id]; if (e.cerrada) return;
      varadas[e.equipo] = (e.novedad || 'reportada sin detalle') + (e.desde ? ' (desde el ' + dcorta(e.desde) + ')' : '');
    });
    pendTaller = {};
    Object.keys(nov).forEach(function(id){
      var n = nov[id]; if (n.cerrado || !n.txt) return;
      (pendTaller[n.equipo] = pendTaller[n.equipo] || []).push({ txt:n.txt, urgente:n.urgente });
    });
    try { localStorage.setItem(KEY_VARADAS, JSON.stringify(varadas)); localStorage.setItem(KEY_PEND, JSON.stringify(pendTaller)); } catch(e){}
    return true;
  } catch(e){
    try { var cp = localStorage.getItem(KEY_PEND); if (cp) pendTaller = JSON.parse(cp) || {}; } catch(e3){}
    try { var c = localStorage.getItem(KEY_VARADAS); if (c){ varadas = JSON.parse(c) || {}; return true; } } catch(e2){}
    varadas = {};
    return false;
  }
}

(async function init(){
  var g = await DB.cargar();
  if (g && g.dias) estado = g;
  if (!estado.dias) estado.dias = {};
  if (!estado.cola) estado.cola = [];
  if (!estado.porConfirmar) estado.porConfirmar = [];
  if (!estado.config) estado.config = { lotes:null, implementos:null, fincas:null, lotesConfirmados:false };
  delete estado.config.flota;               // la flota ahora es la compartida
  aplicarMaestros();
  cfgLotes(); cfgImpl(); cfgFincas();
  fechaSel = siguienteLaboral();
  ultimoQuien = estado.yo || '';
  estado.yo = '';                          // se vuelve a preguntar cada vez que se abre
  try { var cv = localStorage.getItem(KEY_VARADAS); if (cv) varadas = JSON.parse(cv) || {}; } catch(e){}
  try { var cp = localStorage.getItem(KEY_PEND); if (cp) pendTaller = JSON.parse(cp) || {}; } catch(e){}
  pintar();
  elegirQuien(null, true);
  if (!(await DB.guardar(estado))) { sinGuardar = true; pintarSync(); }
  await enviar();
  await traerMaestros();
  var hayTaller = await leerTaller();
  await traerProgramacion();
  if ($('#hoja').hidden) pintar();
  if (!hayTaller){
    $('#app').insertAdjacentHTML('afterbegin',
      '<div class="nota-z">No se pudo leer el Taller, así que no se sabe qué máquinas están paradas. ' +
      'Todas aparecen como disponibles hasta que haya señal.</div>');
  }
  window.addEventListener('online', async function(){ await enviar(); traerProgramacion(); });
  setInterval(async function(){
    if (estado.cola.length){ await enviar(); return; }
    await leerTaller(); await traerProgramacion();
  }, 2 * 60000);
  setInterval(traerMaestros, 10 * 60000);
})();
</script>
